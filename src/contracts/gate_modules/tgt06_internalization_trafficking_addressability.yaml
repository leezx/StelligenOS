version: "0.1.0"
name: stelligenos-gate-module-construction-contract-tgt06
description: >-
  Runtime Migration PR E13. The frozen construction contract for MOD-TGT06, the
  single primary Evidence Production Module of Gate TGT-06 (Internalization /
  Trafficking Addressability) under ADC_TARGET_GATESET@1.0 /
  INST-CRC-REFRACTORY-ADC-TARGET-v1. This PR delivers the contract + a
  human-readable construction drawing
  (docs/gate_modules/TGT-06_Internalization_Trafficking_Addressability.md) +
  validation / parity tests + a 17-item acceptance checklist ONLY. It ships no
  implementation. The Module is built in PR E14, and only after this contract is
  APPROVED (CURRENT_SYSTEM v5 section 6.4). TGT-06 needs its semantics frozen
  BEFORE any code because it slides very easily into four failure modes: (a)
  "surface expression / receptor-family membership -> assume the target-antibody
  complex internalizes", (b) treating internalization as a target-intrinsic
  constant instead of an antibody x epitope x affinity x conjugation x context
  dependent, configuration-specific property, (c) letting a single
  non-internalizing antibody / epitope configuration establish target-wide
  non-internalization, and (d) synthesizing a DIRECT existence proof by combining
  "configuration A internalizes" and "configuration B reaches the lysosome" from
  unrelated observations.

headline_conclusions:  # ChatGPT AI审核方案, frozen verbatim, before code
  - >-
    Internalization is configuration-specific, not a target-intrinsic constant.
    One qualifying disease-relevant antibody / epitope configuration with
    productive antibody-induced internalization and lysosomal delivery is
    sufficient DIRECT existence proof for addressability; failure of one
    configuration is only configuration-level opposing evidence and can never
    establish target-wide non-internalization.
  - >-
    DIRECT productive-addressability authority requires an auditable integrated
    observation tying antibody-induced internalization and lysosomal delivery to
    the same antibody / epitope configuration in a disease-relevant context.
    Surface localization, receptor-family inference, constitutive endocytosis,
    internalization without confirmed lysosomal delivery, non-CRC internalization
    and successful same-target ADC precedent remain lower-ceiling evidence and
    may not be combined across unrelated observations or configurations to
    synthesize DIRECT.
  - >-
    A target-wide surface-static potential fatal pattern requires
    productive-internalization / trafficking failure across multiple independent
    qualified antibody / epitope configurations and no qualifying productive
    DIRECT existence proof in the completed landscape. The machine may surface
    only POTENTIAL_FATAL_PATTERN; it never decides fatality, ADC efficacy, KILL,
    HOLD or a Candidate-level Decision.

core_chain: >-
  qualified disease-relevant context x antibody / epitope configuration identity
  x assay validation x audited internalization-evidence-search completion ->
  Gate-neutral empirical internalization / trafficking observations -> frozen
  rung -> a HIGHEST-QUALIFYING-RUNG grading authority under an EXISTENCE-PROOF
  aggregation truth table (one qualifying DIRECT productive configuration is
  POSITIVE / DIRECT; a qualifying INDIRECT_STRONG addressability landscape with
  no DIRECT is POSITIVE / INDIRECT_STRONG; a single DIRECT-quality failure is
  INCONCLUSIVE / DIRECT, never NEGATIVE) -> aggregate addressability Direction x
  Strength -> optional multiple-independent-configuration-failure fatal_review ->
  human review / GateSet policy. It never becomes: surface expression -> assumed
  internalization; receptor-family membership -> assumed internalization; one
  non-internalizing configuration -> target-wide non-internalization; a measured
  %-internalized value -> an invented ADC-effective internalization rate; a
  DIRECT existence proof stitched from unrelated observations; a NEGATIVE
  addressability call -> a KILL.

