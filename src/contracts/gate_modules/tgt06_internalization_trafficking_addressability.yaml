  pr: runtime_migration_pr_e13
  scope: tgt06_mod_tgt06_construction_contract_drawing_validation_and_acceptance_checklist_only
  spec_refs:
    - docs/architecture/CURRENT_SYSTEM_AND_MODULE_LOGIC_FOR_EXPERT_REVIEW.zh-CN.md (section 6.4 one Gate -> one primary Evidence Production Module + Module 权责边界; section 6.5 shared infrastructure; section 16 B group question 23 -> PR E+)
    - src/contracts/crc_adc_target_gateset.yaml (PR D -- the frozen TGT-06 gate contract, Evidence Ladder, allowed/forbidden inference, unknown behavior and fatal_conditions -- inherited verbatim; TGT-06 has NO inference_guard field)
    - src/contracts/gate_modules/tgt01_adc_modality_precedent.yaml (PR E1 -- the approved 17-item construction template, reused here)
    - src/contracts/gate_modules/tgt03_treatment_metastatic_persistence.yaml (PR E9 -- the highest-qualifying-rung grading + typed-completion + machine-local fatal_review Route A / Route B + local-evidence-context namespace precedent this contract mirrors for internalization addressability, and the improved (source_id, claim, all-driving-facts, local-context) dedup rule)
    - src/contracts/gate_modules/tgt04_tumor_surface_availability_density_plausibility.yaml (PR E11 -- the existence-proof-style DIRECT ceiling, the declared_multi_configuration_analysis single-vs-multi identity pattern, the "raw values are evidence, not thresholds" gene, and the "a single DIRECT-class opposing observation is not yet a Gate NEGATIVE" gene this contract reuses for internalization)
    - gate_modules/tgt01_adc_modality_precedent/ + gate_modules/tgt02_indication_specific_malignant_cell_coverage/ + gate_modules/tgt03_treatment_metastatic_persistence/ + gate_modules/tgt04_tumor_surface_availability_density_plausibility/ + gate_modules/tgt05_normal_tissue_fatal_liability/ + gate_modules/tgt08_target_opportunity_competition_ip_whitespace/ (PR E2 / E8 / E10 / E12 / E4 / E6 -- the runtime boundary genes this contract freezes for MOD-TGT06 -- an explicitly qualified disease-relevant context for a rung; an auditable local configuration identity that is a separate namespace from the canonical Instantiation context_id; every qualified upstream factual state carries an auditable basis; a CLOSED assay_validation_status enum plus a non-empty factual assay_method for DIRECT; a kind / fact-specific non-inflated study_context)
    - src/contracts/data_layout/evidence_package.schema.json / assessment.schema.json (PR A shapes the Module must produce)
    - src/contracts/evidence_reference.yaml (PR C reusable-EvidencePackage reference layer + provenance walk)
    - src/contracts/gate_contracts.yaml (PR B -- assessment_rule / fatal_gate_policy are GateSet-level refs, not Module logic)
  boundary: >-
    design-before-execution. PR E13 delivers the contract, the drawing, the
    validation / parity tests and the acceptance checklist. It adds NO
    implementation, NO provider / adapter, NO live-cell-imaging / pH-sensitive-dye
    / surface-decay-flow / lysosomal-co-localization / recycling-vs-degradation /
    same-target-ADC retrieval, NO extractor / normalizer / runner / dry-run
    executor, NO EvidencePackage or proposal runtime, NO fatal detector runtime,
    NO external data, NO numeric or ranking score, NO internalization-rate /
    half-life / percent-internalized / lysosomal-colocalization-coefficient
    threshold, NO invented "ADC-effective internalization rate" range, and NO new
    scientific ladder semantics. It does NOT create a generic GateModule
    framework, an abstract base class, or refactor MOD-TGT01 / MOD-TGT02 /
    MOD-TGT03 / MOD-TGT04 / MOD-TGT05 / MOD-TGT08. The ONLY existing file it may
    mutate is an append to logs/worklog.md; everything else it delivers is a NEW
    file. It does NOT touch src/contracts/crc_adc_target_gateset.yaml,
    src/objects/crc_adc_target_gateset.py, gate_modules/README.md,
    tests/test_crc_adc_target_gateset.py, tests/test_gate_modules_boundary.py or
    any built-roster test -- those wait for PR E14. MIGRATION_PENDING remains.
  next: >-
    runtime_migration_pr_e14 implements MOD-TGT06 as a deterministic Gate-specific
    scientific core in gate_modules/tgt06_internalization_trafficking_addressability/
    and raises the TGT-06 gate_binding primary_module_version from "0.0.0" to
    "1.0.0". It may start only after this contract is APPROVED.
  order: >-
    fatal-first + cheap-first: TGT-01 -> TGT-05 -> TGT-08 -> TGT-02 -> TGT-03 ->
    TGT-04 -> TGT-06 -> TGT-07. TGT-01 calibrated the Module mechanics; TGT-05 was
    the first fatal-first liability gate; TGT-08 was the external opportunity gate
    and the first reachable canonical NEGATIVE; TGT-02 was the first
    indication-specific malignant-cell coverage gate; TGT-03 was the first
    treatment / metastatic persistence gate; TGT-04 was the first surface
    availability / density plausibility gate; TGT-06 is the first
    internalization / trafficking addressability gate -- an EXISTENCE-PROOF,
    configuration-dependent gate where one qualifying antibody / epitope
    configuration is a sufficient DIRECT proof and a target-wide NEGATIVE / fatal
    needs multiple independent configurations. MIGRATION_PENDING is not lifted
    until all eight primary Modules are built.

