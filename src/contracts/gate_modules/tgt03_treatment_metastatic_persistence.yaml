version: "0.1.0"
name: stelligenos-gate-module-construction-contract-tgt03
description: >-
  Runtime Migration PR E9. The frozen construction contract for MOD-TGT03, the
  single primary Evidence Production Module of Gate TGT-03 (Treatment /
  Metastatic Persistence) under ADC_TARGET_GATESET@1.0 /
  INST-CRC-REFRACTORY-ADC-TARGET-v1. This PR delivers the contract + a
  human-readable construction drawing
  (docs/gate_modules/TGT-03_Treatment_Metastatic_Persistence.md) + validation /
  parity tests + a 17-item acceptance checklist ONLY. It ships no implementation.
  The Module is built in PR E10, and only after this contract is APPROVED
  (CURRENT_SYSTEM v5 section 6.4). TGT-03 needs its semantics frozen BEFORE any
  code because it slides very easily into three failure modes: (a) "baseline CRC
  expression (TGT-02) -> assume the target persists in the treated / metastatic
  setting", (b) "one paired biopsy series or one loss observation -> a completed
  population-level persistence answer or an early fatal call", and (c) confusing
  a scientific NEGATIVE ("the target is materially lost in the actual refractory
  / metastatic context") with a KILL.

headline_conclusions:  # ChatGPT AI审核方案, frozen verbatim, before code
  - >-
    Baseline expression is not persistence. TGT-02 evidence cannot discharge
    TGT-03 unless the evidence source itself explicitly measures a qualified
    treatment / metastasis context.
  - >-
    TGT-03 is a bidirectional scientific persistence gate: qualified
    clinical-context retention supports POSITIVE, qualified clinical-context near
    / marked loss supports NEGATIVE; NEGATIVE is not fatal and not KILL.
  - >-
    Reproducible protein-level near / marked loss may trigger only
    POTENTIAL_FATAL_PATTERN; reproducibility requires auditable evidence and is
    not defined solely by a numeric context count. The Module never decides
    fatality.

core_chain: >-
  qualified treatment / metastasis context x measurement layer x malignant-cell
  attribution x audited persistence-search completion -> Gate-neutral empirical
  persistence observations -> frozen rung -> aggregate persistence Direction x
  Strength -> optional reproducible-loss fatal_review -> human review / GateSet
  policy. It never becomes: baseline CRC expression -> assumed persistence; a
  minor down-regulation -> assumed loss / fatal; two observations -> automatically
  "reproducible"; protein persistence -> assumed surface density; NEGATIVE -> KILL.

migration:
  pr: runtime_migration_pr_e9
  scope: tgt03_mod_tgt03_construction_contract_drawing_validation_and_acceptance_checklist_only
  spec_refs:
    - docs/architecture/CURRENT_SYSTEM_AND_MODULE_LOGIC_FOR_EXPERT_REVIEW.zh-CN.md (section 6.4 one Gate -> one primary Evidence Production Module + Module 权责边界; section 6.5 shared infrastructure; section 11.2 EVGAP-02 CRC linkage lock; section 16 B group question 23 -> PR E+)
    - src/contracts/crc_adc_target_gateset.yaml (PR D -- the frozen TGT-03 gate contract, Evidence Ladder, allowed/forbidden inference, unknown behavior, fatal_conditions and inference_guard -- inherited verbatim)
    - src/contracts/gate_modules/tgt01_adc_modality_precedent.yaml (PR E1 -- the approved 17-item construction template, reused here)
    - src/contracts/gate_modules/tgt02_indication_specific_malignant_cell_coverage.yaml (PR E7 -- the reachable-scientific-NEGATIVE + typed-completion + machine-local fatal_review + no-two-axis-strength precedent, and the bidirectional-coverage-vs-fatal separation this contract mirrors for persistence)
    - src/contracts/gate_modules/tgt05_normal_tissue_fatal_liability.yaml + tgt08_target_opportunity_competition_ip_whitespace.yaml (PR E3 / E5 -- the fatal-vs-scientific separation precedent)
    - gate_modules/tgt01_adc_modality_precedent/ + gate_modules/tgt02_indication_specific_malignant_cell_coverage/ + gate_modules/tgt05_normal_tissue_fatal_liability/ + gate_modules/tgt08_target_opportunity_competition_ip_whitespace/ (PR E2 / E8 / E4 / E6 -- the runtime boundary genes this contract freezes for MOD-TGT03 -- canonical target identity + fixed-Instantiation context pin, observation context_key / completion search_scope HARD binding, Gate-neutral EvidencePackage, exact canonical EP reuse incl. observation_id + canonical-provenance re-check, kind/fact-specific study_context, a SEARCH_COMPLETION_AUDIT EP that cannot be lost to dedup, hard identity/provenance/completion-consistency failure -> whole-run reject, non-canonical proposal envelope, completion-audit snapshot parity)
    - src/contracts/data_layout/evidence_package.schema.json / assessment.schema.json (PR A shapes the Module must produce)
    - src/contracts/evidence_reference.yaml (PR C reusable-EvidencePackage reference layer + provenance walk)
    - src/contracts/gate_contracts.yaml (PR B -- assessment_rule / fatal_gate_policy are GateSet-level refs, not Module logic)
  boundary: >-
    design-before-execution. PR E9 delivers the contract, the drawing, the
    validation / parity tests and the acceptance checklist. It adds NO
    implementation, NO provider / adapter, NO GEO / HPA / CPTAC / scRNA / spatial
    / paired-biopsy retrieval, NO extractor / normalizer / runner / dry-run
    executor, NO EvidencePackage or proposal runtime, NO fatal detector runtime,
    NO external data, NO numeric or ranking score, NO fold-change /
    percent-positive / H-score / down-regulation cutoff, and NO new scientific
    ladder semantics. It does NOT create a generic GateModule framework, an
    abstract base class, or refactor MOD-TGT01 / MOD-TGT02 / MOD-TGT05 /
    MOD-TGT08. The ONLY existing file it may mutate is an append to
    logs/worklog.md; everything else it delivers is a NEW file. It does NOT touch
    src/contracts/crc_adc_target_gateset.yaml, src/objects/crc_adc_target_gateset.py,
    gate_modules/README.md, tests/test_crc_adc_target_gateset.py or
    tests/test_gate_modules_boundary.py -- those wait for PR E10.
    MIGRATION_PENDING remains.
  next: >-
    runtime_migration_pr_e10 implements MOD-TGT03 as a deterministic Gate-specific
    scientific core in gate_modules/tgt03_treatment_metastatic_persistence/ and
    raises the TGT-03 gate_binding primary_module_version from "0.0.0" to "1.0.0".
    It may start only after this contract is APPROVED.
  order: >-
    fatal-first + cheap-first: TGT-01 -> TGT-05 -> TGT-08 -> TGT-02 -> TGT-03 ->
    TGT-04 -> TGT-06 -> TGT-07. TGT-01 calibrated the Module mechanics; TGT-05
    was the first fatal-first liability gate; TGT-08 was the external opportunity
    gate and the first reachable canonical NEGATIVE; TGT-02 was the first
    indication-specific malignant-cell coverage gate; TGT-03 is the first
    treatment / metastatic persistence gate -- a bidirectional scientific
    persistence judgement whose NEGATIVE (materially impaired persistence) is a
    genuine scientific finding, distinct from the reproducible-loss fatal pattern.

