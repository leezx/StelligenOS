version: "0.1.0"
name: stelligenos-gate-module-construction-contract-tgt05
description: >-
  Runtime Migration PR E3. The frozen construction contract for MOD-TGT05, the
  single primary Evidence Production Module of Gate TGT-05 (Normal-Tissue Fatal
  Liability) under ADC_TARGET_GATESET@1.0 / INST-CRC-REFRACTORY-ADC-TARGET-v1.
  This PR delivers the contract + a human-readable construction drawing
  (docs/gate_modules/TGT-05_Normal_Tissue_Fatal_Liability.md) + validation /
  parity tests + a 17-item acceptance checklist ONLY. It ships no
  implementation. The Module is built in PR E4, and only after this contract is
  APPROVED (CURRENT_SYSTEM v5 section 6.4: "逐 Gate 绘制 Evidence Production
  Module 施工图；审核通过后 Module 才可开工"). TGT-05 needs its semantics frozen
  BEFORE any code because it slides very easily into an incorrect
  "public-data prediction of the therapeutic window".

migration:
  pr: runtime_migration_pr_e3
  scope: tgt05_mod_tgt05_construction_contract_drawing_validation_and_acceptance_checklist_only
  spec_refs:
    - docs/architecture/CURRENT_SYSTEM_AND_MODULE_LOGIC_FOR_EXPERT_REVIEW.zh-CN.md (section 6.4 one Gate -> one primary Evidence Production Module + Module 权责边界; section 6.5 shared infrastructure; section 16 B group question 23 -> PR E+)
    - src/contracts/crc_adc_target_gateset.yaml (PR D -- the frozen TGT-05 gate contract, Evidence Ladder, allowed/forbidden inference, unknown behavior and fatal_conditions -- inherited verbatim)
    - src/contracts/gate_modules/tgt01_adc_modality_precedent.yaml (PR E1 -- the approved 17-item construction template, reused here)
    - gate_modules/tgt01_adc_modality_precedent/ (PR E2 -- the runtime boundary genes this contract freezes for MOD-TGT05 -- canonical target identity, Gate-neutral EvidencePackage, exact canonical EP reuse, classification-driving parity, hard identity/provenance failure -> machine reject, non-canonical proposal envelope)
    - src/contracts/data_layout/evidence_package.schema.json / assessment.schema.json (PR A shapes the Module must produce)
    - src/contracts/evidence_reference.yaml (PR C reusable-EvidencePackage reference layer + provenance walk)
    - src/contracts/gate_contracts.yaml (PR B -- assessment_rule / fatal_gate_policy are GateSet-level refs, not Module logic)
  boundary: >-
    design-before-execution. PR E3 delivers the contract, the drawing, the
    validation / parity tests and the acceptance checklist. It adds NO
    implementation, NO provider / adapter, NO extractor / normalizer / runner /
    dry-run executor, NO EvidencePackage or assessment runtime output, NO
    external data, NO numeric scoring, NO biological thresholds, NO
    product-specific therapeutic-window logic, and NO new scientific ladder
    semantics. It does NOT create a generic GateModule framework, an abstract
    base class, or refactor MOD-TGT01. MIGRATION_PENDING remains.
  next: >-
    runtime_migration_pr_e4 implements MOD-TGT05 as a deterministic Gate-specific
    scientific core in gate_modules/tgt05_normal_tissue_fatal_liability/ and
    raises the TGT-05 gate_binding primary_module_version from "0.0.0" to
    "1.0.0". It may start only after this contract is APPROVED.
  order: >-
    fatal-first + cheap-first: TGT-01 -> TGT-05 -> TGT-08 -> TGT-02 -> TGT-03 ->
    TGT-04 -> TGT-06 -> TGT-07. TGT-01 calibrated the Module mechanics; TGT-05 is
    the first true fatal-first target-liability pruning Gate.

template_provenance:
  status: RECONSTRUCTED
  template_basis: >-
    approved E1 17-item construction template
    (src/contracts/gate_modules/tgt01_adc_modality_precedent.yaml), already
    validated by the merged PR E2 implementation. PR E3 reuses it and does not
    reinvent the template.
  blueprint_status: >-
    Blueprint v1.3 section H2.8 (Gate Module Acceptance Template, 17 items) is
    referenced by CURRENT_SYSTEM v5 but NOT present in this repository or the
    File Library.
  source:
    - "approved E1 17-item construction template (validated by the merged PR E2 implementation)"
    - CURRENT_SYSTEM v5 section 6.4 (one Gate -> one primary Module; the Module 权责边界 list)
    - ADC_TARGET_GATESET@1.0 / TGT-05 frozen contract (src/contracts/crc_adc_target_gateset.yaml, PR D)
    - runtime migration PR A-E2 contracts (objects / Gate system / Matrix + provenance / CRC GateSet / MOD-TGT01)
  claim:
    not_claimed_verbatim_from_blueprint: true
    seventeen_item_template_reused_from_e1: true
    functionally_complete_and_consistent_with_prior_frozen_decisions: true

kernel_invariant: >-
  The kernel defines the contract; the Gate Module implements the contract.
  One-way dependency, exactly like extensions/ and MOD-TGT01: a future
  gate_modules/ implementation MAY import kernel objects / Gate identity /
  contracts; src/ MUST NEVER import gate_modules/. The Module may not modify the
  Gate id / name / candidate ownership, the gate_question, the Evidence Ladder,
  the evidence ceiling, or the fatal / unknown / conflict / inference semantics
  (CURRENT_SYSTEM v5 section 6.4). It may not reason across Gates, lower a
  measurement requirement, or turn UNKNOWN into PASS / HOLD / KILL.
  TGT-05-specific: MOD-TGT05 is a ONE-WAY normal-tissue LIABILITY DETECTOR, never
  a safety predictor. Public evidence can strongly confirm a target-level
  normal-tissue liability; it usually cannot confirm the absence of one. The
  Module's job is to find target-level normal-tissue liability as reliably as
  possible -- not to prove a target is "safe".

# The 17-item Gate Module Acceptance checklist (template reused from the approved
# PR E1 template -- see template_provenance). Each item the future MOD-TGT05
# implementation must satisfy before it can be accepted.
acceptance_checklist:

  "01_gate_identity_and_version":
    gate_id: TGT-05
    gate_version: "1.0"
    canonical_gateset_id: ADC_TARGET_GATESET
    gateset_version: "1.0"
    candidate_level: L04
    candidate_ownership: ADC_TARGET (L04)
    instantiation_binding: INST-CRC-REFRACTORY-ADC-TARGET-v1
    rule: the Module inherits this identity; it does not own, rename or redefine it

  "02_primary_module_identity_and_version":
    primary_module_id: MOD-TGT05
    deterministic_id_rule: "Data Layout Spec Appendix A: Module = MOD-<GATE without hyphen>"
    construction_contract_version: "0.1.0"
    module_implementation_version: "0.0.0"
    rule: >-
      exactly one primary Evidence Production Module per Gate. "0.0.0" means
      declared, not built (the PR D gate_binding slot). PR E4 builds it and
      raises the version to >= 1.0; PR E3 does not change the binding version.
      MOD-TGT05 does not own the Gate identity.

  "03_gate_question":
    verbatim_from: src/contracts/crc_adc_target_gateset.yaml gate_contracts.TGT-05.gate_question
    text: >-
      Is there evidence of accessible normal-human-tissue expression, or observed
      target-mediated toxicity, that creates a potentially material
      on-target / off-tumor liability for ADC development? (fatal-first gate --
      a target-level public-evidence gate, not a product-specific
      therapeutic-window judgement)
    rule: the Module quotes this verbatim and may not widen or narrow it
    tgt05_framing:
      answers: >-
        whether there is a target-level normal-tissue on-target / off-tumor
        liability class that ADC development against this target must contend with
      does_not_answer:
        - a product-specific therapeutic window (this is a target-level gate)
        - whether the candidate is desirable (Direction is about the evidence, not the candidate)
        - tumor selectivity or malignant-cell coverage (that is TGT-02 / TGT-04)
        - whether the target is "safe" -- the Gate can confirm a liability, it cannot confirm its absence

  "04_admissible_evidence_classes":
    verbatim_from: gate_contracts.TGT-05.evidence_required + evidence_ladder.*.admissible_evidence_classes
    admissible:
      - clinical on-target / off-tumor toxicity attributable to this target from an ADC against the same target
      - clinical on-target / off-tumor toxicity for the same target from a non-ADC targeted modality (CAR-T / T-cell engager / naked antibody)
      - protein-level normal-tissue expression in vital organs from validated human atlases (immunohistochemistry / mass-spec proteomics)
      - normal-tissue single-cell expression
      - same-target on-target toxicity in non-human primates with translational relevance
      - normal-tissue liability inferred only from RNA atlases without protein confirmation
      - rodent-only normal-tissue or toxicity data
      - vital-organ coverage across central nervous system, cardiac, hepatic, pulmonary, hematopoietic, gastrointestinal
    not_admissible_into_this_gate:
      - ADC-modality precedent / addressability evidence (that is TGT-01)
      - CRC malignant-cell target expression / coverage evidence (TGT-02)
      - treatment / metastatic persistence evidence (TGT-03)
      - surface availability / antigen density / localization evidence (TGT-04)
      - internalization / trafficking evidence (TGT-06)
      - shedding / soluble-antigen / sink evidence (TGT-07)
      - competitive landscape / IP-whitespace evidence (TGT-08)

  "05_evidence_ladder_and_evidence_ceiling":
    verbatim_from: gate_contracts.TGT-05.evidence_ladder + evidence_ceiling
    DIRECT:
      admissible_evidence_classes:
        - clinical on-target / off-tumor toxicity attributable to this target from an ADC against the same target
      ceiling_rule: establishes an ADC-relevant normal-tissue liability class, including observed severity for that ADC
    INDIRECT_STRONG:
      admissible_evidence_classes:
        - clinical on-target / off-tumor toxicity for the same target from a non-ADC targeted modality (CAR-T / T-cell engager / naked antibody) -- shows the target is biologically accessible in normal tissue; the toxicity mechanism, exposure and severity do not transfer one-to-one to an ADC therapeutic window
        - protein-level normal-tissue expression in vital organs from validated human atlases
        - same-target on-target toxicity in non-human primates with translational relevance
      ceiling_rule: strong liability signal; the ADC-specific severity is not established by non-ADC modality data or atlases alone
    WEAK:
      admissible_evidence_classes:
        - normal-tissue liability inferred only from RNA atlases without protein confirmation
        - rodent-only normal-tissue or toxicity data
      ceiling_rule: liability cannot be graded; hypothesis only
    evidence_ceiling: clinical (ADC-specific for DIRECT) or protein-level human normal-tissue expression in vital organs; RNA-only atlases do not reach it
    rule: the Module reproduces this mapping exactly; it does not redefine the grades, add rungs, or exceed the ceiling. A normalized-equality parity test binds this item to the frozen PR D contract.

  "06_direction_interpretation":
    strength_direction_rule: >-
      Strength is orthogonal to Direction (Blueprint v1.3). The Module proposes
      both; it never merges them and never emits a numeric score. Direction
      describes the evidence RELATIVE TO THE GATE QUESTION, not candidate
      desirability -- a TGT-05 POSITIVE / DIRECT is a bad candidate signal, but
      the Module does not flip Direction, and HOLD / KILL is the GateSet
      Decision policy's job (PR B), not the Module's.
    POSITIVE: at least one admissible normal-tissue on-target liability evidence class is present at a graded strength -- a target-level liability class exists
    NEGATIVE: >-
      reserved. Public-evidence v1 does NOT permit a safety-negative call from
      "no risk seen": HPA-negative, RNA-negative, IHC-negative, or one clinical
      program without reported toxicity do NOT produce NEGATIVE = safe. A
      NEGATIVE direction is essentially unreachable on the current public path.
    INCONCLUSIVE: graded evidence that neither establishes a liability class nor is the UNKNOWN state (e.g. only WEAK RNA-level signal with incomplete protein coverage)
    UNKNOWN: not enough admissible liability evidence, or normal-tissue vital-organ coverage is incomplete (frozen unknown_behavior)
    CONFLICTING: >-
      only when genuinely contradictory ADMISSIBLE target-attribution evidence
      is co-present (e.g. one primary source attributes a normal-tissue toxicity
      to the target and another equally admissible primary source refutes the
      target attribution for the same tissue). "one ADC has toxicity, another
      has no reported toxicity" is NOT contradictory evidence for the safety
      direction.
    absolute_note: Direction is about the evidence, not the candidate; the module never flips Direction on desirability grounds.

  "07_allowed_and_forbidden_inference":
    verbatim_from: gate_contracts.TGT-05.allowed_inference + forbidden_inference
    allowed:
      - the presence, and plausibility / severity signals, of a normal-tissue on-target liability class
    forbidden:
      - negative RNA / IHC / atlas evidence alone implies the absence of a normal-tissue liability, or safety (protein and atlas gaps are common; a negative atlas is not proof of safety)
      - tumor selectivity at the coverage level (TGT-02) implies normal-tissue safety
      - non-ADC modality toxicity severity transfers directly to an ADC therapeutic window
      - a product-specific therapeutic-window conclusion (this is a target-level gate)
    rule: the Module obeys this scientific boundary verbatim and produces no cross-Gate conclusion and no product-specific therapeutic-window conclusion. A normalized-equality parity test binds this item to the frozen PR D contract.

  "08_fatal_conditions":
    verbatim_from: gate_contracts.TGT-05.fatal_conditions
    potential_fatal_signal:
      - a convergent target-mediated on-target / off-tumor toxicity pattern across materially distinct ADC constructs against the same target (distinct antibodies / linkers / payloads / formats converging on the same target-driven normal-tissue toxicity) -- a potential target-intrinsic fatal signal. A single ADC construct's toxicity is DIRECT evidence of an ADC-relevant liability but is NOT target-wide fatal, since it may be linker / payload / format driven; normal-tissue expression and non-ADC modality toxicity are strong liability signals, not fatal on their own.
    single_product_vs_target_intrinsic_convergence:
      one_same_target_adc_with_explicit_target_mediated_toxicity: DIRECT liability evidence; NOT target-wide fatal
      human_protein_expression_in_a_vital_organ: INDIRECT_STRONG; NOT fatal
      same_target_non_adc_toxicity_car_t_tce_naked_ab: INDIRECT_STRONG; NOT fatal; severity does not transfer to an ADC
      translationally_relevant_same_target_nhp_toxicity: INDIRECT_STRONG; NOT fatal on its own
      two_or_more_materially_distinct_same_target_adc_constructs_with_convergent_target_mediated_normal_tissue_toxicity: potential target-intrinsic fatal signal
    convergence_audit_requirements:
      note: >-
        to avoid a machine misjudging convergence, every clinical ADC toxicity
        observation feeding the fatal-pattern check must carry an auditable
        record of the following. The module recognises a potential convergent
        pattern; it never performs a Candidate-level KILL.
      per_observation:
        - program_id
        - actual target identity
        - construct fingerprint (antibody / binder identity if disclosed; linker; payload; format / relevant construct distinction)
        - affected normal tissue / cell compartment
        - toxicity phenotype
        - observed severity FOR THIS PRODUCT (never elevated to a target-wide severity)
        - target-attribution basis
        - primary source
    human_review_reserved:
      - whether two constructs are "materially distinct"
      - whether an observed toxicity is truly target-mediated
    rule: >-
      the Module only recognises and reports this evidence pattern. It never
      performs a Candidate-level KILL -- that is the GateSet fatal_gate_policy's
      decision (PR B). It must NOT auto-declare a target-wide fatal signal merely
      because two ADCs show a grade >= X toxicity or the same adverse-event term.
      No numeric severity score. A normalized-equality parity test binds
      potential_fatal_signal to the frozen PR D contract.

  "09_evidence_source_plan":
    dominant_evidence_regime_frozen_contract: PUBLIC_HYBRID
    current_instantiation_regime: PUBLIC_ONLY
    experimental_sources: >-
      the frozen contract allows a hybrid path, but INST-CRC-REFRACTORY-ADC-TARGET-v1
      is PUBLIC_ONLY -- PR E3 designs the current public path only and connects
      no experiments.
    source_classes:
      direct_authority:
        - same-target ADC clinical on-target / off-tumor toxicity WITH target attribution, from a primary regulatory / trial / clinical publication / resolvable company primary disclosure
      indirect_strong:
        - same-target non-ADC clinical target-mediated toxicity (CAR-T / T-cell engager / naked antibody)
        - a validated human normal-tissue protein atlas covering vital organs
        - translationally relevant same-target non-human-primate toxicity
      weak_only:
        - RNA-only normal-tissue atlases
        - rodent-only expression / toxicity data
    source_authority_rules:
      - RNA-only evidence cannot become protein evidence
      - whole-tissue protein expression does not prove cell-surface accessibility
      - non-ADC modality severity does not transfer to an ADC
      - a negative atlas does not prove safety
      - a weak_only source class can never lift an assessment above the WEAK rung
    coverage_map:
      vital_organs:
        - central nervous system
        - cardiac
        - hepatic
        - pulmonary
        - hematopoietic
        - gastrointestinal
      rule: >-
        a liability-evidence assessment is tracked SEPARATELY from a
        vital-organ coverage-completeness assessment. Incomplete coverage ->
        UNKNOWN (item 15). No number of organs "counts as safe".
    no_universal_threshold: >-
      no organ count, no TPM / FPKM cutoff, no IHC score cutoff, no severity
      grade cutoff. Any threshold that has not been through calibration is
      forbidden in this PR.
    connect_provider_in_this_pr: false
    shared_infrastructure_note: >-
      literature / trial / atlas / patent retrieval, entity resolution, the
      provenance ledger and evidence serialization are shared infrastructure
      (CURRENT_SYSTEM v5 section 6.5). A future Module reuses them; it does not
      re-implement them per Gate.

  "10_input_contract":
    required_inputs:
      - candidate_id (CAND-L04-nnnnnn) and the candidate's CANONICAL target identity (the single authoritative target -- inherited from the MOD-TGT01 / PR E2 gene; no separate drift-prone target argument)
      - instantiation_id (INST-CRC-REFRACTORY-ADC-TARGET-v1) plus its context_id / context_version
      - the frozen TGT-05 gate_contract_ref and evidence_ladder_ref
      - run context (run_id, retrieval time window, evidence_regime = PUBLIC_ONLY)
      - existing evidence_refs for this (candidate, gate), if any
    forbidden: >-
      any implicit default scientific context. The Module must fail rather than
      assume an indication, modality or evidence regime not supplied by the
      Instantiation.

  "11_evidencepackage_output_contract":
    each_package:
      - is atomic and Gate-NEUTRAL -- one neutral empirical observation, no grade, no direction, no TGT-05 ceiling stamped onto it
      - carries full provenance from the resolved canonical SourceIndex record (SRC-nnnnnnnn, source_type, source_identifier, locator, retrieved_at)
      - carries candidate_refs and a measurement / claim block
      - carries interpretation_boundary (observation-level directly_supports / does_not_support / limitations / a neutral observation-level evidence_ceiling)
      - carries derivation (module_run_id, code_commit)
      - for a clinical ADC toxicity observation, carries the item-08 convergence-audit fields in study_context (program_id, actual target identity, construct fingerprint, affected normal tissue, toxicity phenotype, observed severity for THIS product, target-attribution basis)
    rules:
      - the Module references an existing EvidencePackage by evidence_id -- it reuses the EXACT canonical package, never copies or re-creates one (PR C / E1 item 11; PR E2 gene)
      - on reuse, every classification-driving observation field (target identity, evidence class, construct fingerprint, affected tissue, target-attribution basis, ...) must be present AND equal on the canonical package's study_context; a missing or drifted field is a HARD identity integrity failure (PR E2 gene)
      - forward status / superseded_by never appear on evidence.json (PR C -- they live only on the EvidenceIndexEntry)
    shape_ref: src/contracts/data_layout/evidence_package.schema.json + src/objects/decision_model.py EvidencePackage (PR A)

  "12_assessment_proposal_envelope_contract":
    the_module_emits: >-
      a non-canonical, module-local assessment PROPOSAL ENVELOPE. It is NOT a
      CandidateGateAssessment. Per PR A, a CandidateGateAssessment is the
      canonical matrix cell and CANONICAL_REVIEW_STATUS is HUMAN_APPROVED --
      constructing that object with review.status != HUMAN_APPROVED is rejected.
    the_proposal_envelope_carries:
      identity_pins_for_deterministic_canonicalisation:
        - candidate_id (CAND-L04-nnnnnn)
        - instantiation_id (INST-CRC-REFRACTORY-ADC-TARGET-v1)
        - context_id
        - context_version
        - gateset_id (ADC_TARGET_GATESET)
        - gateset_version
        - gate_id (TGT-05)
        - gate_version
      scientific_fields:
        - proposed_direction + proposed_strength (never a Decision, never a numeric score)
        - evidence_refs [{evidence_id, role}] referencing the EvidencePackages above (role in SUPPORTING / CONTRADICTING / CONTEXTUAL)
        - aggregation_rationale, critical_unknowns, evidence_ceiling
      machine_record:
        - the machine acceptance record (item 13)
    the_proposal_envelope_never_carries:
      - assessment_id / assessment_version (human canonicalisation assigns them)
      - review.status / review.reviewer / review.reviewed_at (human canonicalisation only)
      - any product-specific therapeutic-window conclusion
    rules:
      - a canonical CandidateGateAssessment (review.status = HUMAN_APPROVED) is constructed only after human approval (item 14), by the review surface, never by the Module
      - the proposed_direction x proposed_strength combination is checked against the PR A direction x strength matrix
      - PR E3 only DEFINES this envelope's field list; it adds no new core object and no runtime implementation
    shape_ref: >-
      src/contracts/data_layout/assessment.schema.json is the canonicalisation
      TARGET, not a machine-proposal schema. The proposal envelope carries that
      schema's identity pins and scientific fields for a deterministic
      canonicalisation and omits assessment_id / assessment_version / review.

  "13_machine_acceptance_criteria":
    a_proposal_envelope_and_its_packages_are_machine_acceptable_iff:
      - every EvidencePackage validates against evidence_package.schema.json (shape / ids / nested blocks / date patterns)
      - every provenance.source_id resolves to a canonical SourceIndex record whose metadata matches, and every evidence_ref.evidence_id resolves to a canonical EvidencePackage (PR C check_* functions; PR E2 gene)
      - every admissible evidence class used is in item 04's admissible list, and no item-04 not_admissible class is present
      - the proposed_strength does not exceed the ceiling of the highest ladder rung actually met (item 05)
      - the item-16 mandatory completion conditions are satisfied for the path taken (Path B / Path C sweeps complete)
      - dedup -- one SRC -> many EP is allowed; the same (source, claim) is not duplicated across packages
      - all required fields present; no numeric score anywhere; no biological threshold
      - no product-specific therapeutic-window conclusion appears anywhere in the proposal
    on_failure: >-
      the run is rejected with a machine reason and nothing enters the canonical
      record. A HARD identity / provenance integrity failure (candidate <->
      target misbinding, a claimed-resolved source missing from the canonical
      SourceIndex, a canonical-source metadata conflict, an incompatible
      canonical EvidencePackage) rejects the WHOLE run -- it is never degraded to
      an accepted UNKNOWN (PR E2 gene). UNKNOWN from genuinely incomplete
      coverage is NOT an integrity failure.

  "14_human_acceptance_and_review_surface":
    the_human_sees:
      - the proposed_direction + proposed_strength and the aggregation_rationale
      - each EvidencePackage's claim, source and interpretation_boundary (drill-down), including the item-08 convergence-audit fields for clinical ADC toxicity observations
      - the ladder rung each package maps to, and any critical_unknowns
      - the vital-organ coverage map and which organs are covered / uncovered
      - the machine acceptance record (item 13 pass / fail detail)
    human_only_judgements:
      - whether the aggregated direction / strength is scientifically correct for TGT-05
      - whether two ADC constructs are "materially distinct" and whether an observed normal-tissue toxicity is truly target-mediated (item 08)
      - whether a claimed "same target" call is right
      - final approval -- on HUMAN_APPROVED the review surface constructs the canonical CandidateGateAssessment (review.status = HUMAN_APPROVED) from the proposal envelope; it enters ASSESSMENTS/<cand>/vNNN.json and the MatrixView rebuilds (PR C). The Module never constructs that object.
    complexity_note: >-
      TGT-05's human-only judgement is materially heavier than TGT-01's --
      "materially distinct constructs", "truly target-mediated", and vital-organ
      coverage adequacy are all human calls the Module surfaces but does not make.

  "15_failure_unknown_and_conflict_behavior":
    retrieval_failure: report a machine failure reason; do not emit a partial proposal envelope as if complete
    insufficient_or_incomplete_coverage: propose INCONCLUSIVE or UNKNOWN per item 06; never PASS, never "safe", never NEGATIVE
    no_admissible_liability_evidence_and_incomplete_coverage: >-
      propose UNKNOWN. Verbatim from the frozen contract: "Incomplete
      normal-tissue coverage -> UNKNOWN, never auto-PASS." A negative RNA / IHC /
      atlas is not proof of safety.
    conflicting_evidence: propose CONFLICTING only with genuinely contradictory admissible target-attribution evidence (item 06), with non-empty key_supporting_evidence and key_contradicting_evidence
    experiment_required: >-
      if a key vital-organ coverage gap can only be closed by non-public data,
      set the critical_unknown resolution to EXPERIMENT_REQUIRED and stop -- do
      not keep searching weaker proxies
    absolute_rules:
      - UNKNOWN is never silently converted to PASS / HOLD / KILL (CURRENT_SYSTEM v5 section 6.4)
      - UNKNOWN from incomplete coverage is NOT an integrity failure (PR E2 gene)
      - absence of public risk evidence is not a safety-NEGATIVE and not a stop condition

  "16_stop_rule":
    principle: absence of public risk evidence is not a stop condition for safety; the fatal sweep is mandatory; the stop is asymmetric.
    path_a_potential_fatal_pattern_found:
      when:
        - two or more materially distinct same-target ADC constructs
        - convergent target-mediated normal-tissue toxicity
        - primary provenance / target-attribution auditable (item 08 fields present)
      then:
        - mark PUBLIC_FATAL_SIGNAL_ESTABLISHED
        - stop chasing weaker atlas / RNA evidence (a later RNA atlas cannot wash the pattern away)
        - hand off to the human review surface
    path_b_only_one_direct_adc_toxicity:
      then_must_complete_before_any_stop:
        - the same-target ADC construct inventory (active / approved AND discontinued / failed)
        - the toxicity / discontinuation / target-attribution sweep for those constructs
      rationale: a second independent construct can lift a DIRECT liability into a potential fatal pattern
    path_c_no_direct_clinical_liability:
      then_must_complete_before_any_stop:
        - the human protein vital-organ coverage sweep (item 09 coverage_map)
        - the non-ADC same-target toxicity sweep
        - the relevant same-target non-human-primate evidence sweep
        - the RNA-only supporting sweep
      if_unresolvable_by_public_sources: set the critical_unknown resolution to EXPERIMENT_REQUIRED (do not keep searching weaker proxies)
    rule: bounds the "infinite evidence gathering" failure mode without ever treating "no risk found" as a completed safety assessment

  "17_downstream_consumer_and_handoff":
    the_module_hands_off:
      - a set of EvidencePackages and one assessment proposal envelope, to the human review surface (item 14)
    once_human_approved_the_resulting_canonical_CandidateGateAssessment_is_consumed_by:
      - the MatrixView cell for (this candidate_id, TGT-05) (PR C)
      - the ADC_TARGET_GATESET decision layer (decision_rule / fatal_gate_policy / required_gate_policy / unknown_policy) which turns the eight TGT assessments into a Candidate-level Decision (PR B)
      - the next Gate in the fatal-first order (TGT-08) as context only -- never as a substitute for its own measurement
      - experimental validation, when a critical_unknown is EXPERIMENT_REQUIRED
    this_module_does_not:
      - construct a CandidateGateAssessment or emit a HUMAN_APPROVED record
      - produce a Candidate-level Decision or KILL
      - make a product-specific therapeutic-window conclusion
      - flip Direction based on candidate desirability
      - write to any other Gate's evidence index or assessment
