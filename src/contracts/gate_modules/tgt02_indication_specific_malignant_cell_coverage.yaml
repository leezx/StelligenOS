version: "0.1.0"
name: stelligenos-gate-module-construction-contract-tgt02
description: >-
  Runtime Migration PR E7. The frozen construction contract for MOD-TGT02, the
  single primary Evidence Production Module of Gate TGT-02 (Indication-Specific
  Malignant-Cell Coverage) under ADC_TARGET_GATESET@1.0 /
  INST-CRC-REFRACTORY-ADC-TARGET-v1. This PR delivers the contract + a
  human-readable construction drawing
  (docs/gate_modules/TGT-02_Indication_Specific_Malignant_Cell_Coverage.md) +
  validation / parity tests + a 17-item acceptance checklist ONLY. It ships no
  implementation. The Module is built in PR E8, and only after this contract is
  APPROVED (CURRENT_SYSTEM v5 section 6.4). TGT-02 needs its semantics frozen
  BEFORE any code because it slides very easily into two failure modes: (a)
  "one pretty cohort -> declare population-level coverage", and (b) confusing a
  scientific NEGATIVE ("the target is not adequately expressed on CRC malignant
  cells") with a KILL.

migration:
  pr: runtime_migration_pr_e7
  scope: tgt02_mod_tgt02_construction_contract_drawing_validation_and_acceptance_checklist_only
  spec_refs:
    - docs/architecture/CURRENT_SYSTEM_AND_MODULE_LOGIC_FOR_EXPERT_REVIEW.zh-CN.md (section 6.4 one Gate -> one primary Evidence Production Module + Module 权责边界; section 6.5 shared infrastructure; section 11.2 EVGAP-02 CRC linkage lock; section 16 B group question 23 -> PR E+)
    - src/contracts/crc_adc_target_gateset.yaml (PR D -- the frozen TGT-02 gate contract, Evidence Ladder, allowed/forbidden inference, unknown behavior, fatal_conditions and inference_guard -- inherited verbatim)
    - src/contracts/gate_modules/tgt01_adc_modality_precedent.yaml (PR E1 -- the approved 17-item construction template, reused here)
    - src/contracts/gate_modules/tgt05_normal_tissue_fatal_liability.yaml + tgt08_target_opportunity_competition_ip_whitespace.yaml (PR E3 / E5 -- the fatal-vs-scientific separation precedent, the reachable-NEGATIVE precedent, and the typed-completion / machine-local review-trigger precedent)
    - gate_modules/tgt01_adc_modality_precedent/ + gate_modules/tgt05_normal_tissue_fatal_liability/ + gate_modules/tgt08_target_opportunity_competition_ip_whitespace/ (PR E2 / E4 / E6 -- the runtime boundary genes this contract freezes for MOD-TGT02 -- canonical target identity, Gate-neutral EvidencePackage, exact canonical EP reuse, classification-driving parity, hard identity/provenance failure -> machine reject, non-canonical proposal envelope, E6 completion-audit snapshot parity)
    - src/contracts/data_layout/evidence_package.schema.json / assessment.schema.json (PR A shapes the Module must produce)
    - src/contracts/evidence_reference.yaml (PR C reusable-EvidencePackage reference layer + provenance walk)
    - src/contracts/gate_contracts.yaml (PR B -- assessment_rule / fatal_gate_policy are GateSet-level refs, not Module logic)
  boundary: >-
    design-before-execution. PR E7 delivers the contract, the drawing, the
    validation / parity tests and the acceptance checklist. It adds NO
    implementation, NO provider / adapter, NO GEO / HPA / CPTAC / scRNA / spatial
    retrieval, NO extractor / normalizer / runner / dry-run executor, NO
    EvidencePackage or proposal runtime, NO fatal detector runtime, NO external
    data, NO numeric or ranking score, NO cohort-size / percent-positive /
    H-score / heterogeneity cutoff, and NO new scientific ladder semantics. It
    does NOT create a generic GateModule framework, an abstract base class, or
    refactor MOD-TGT01 / MOD-TGT05 / MOD-TGT08. MIGRATION_PENDING remains.
  next: >-
    runtime_migration_pr_e8 implements MOD-TGT02 as a deterministic Gate-specific
    scientific core in gate_modules/tgt02_indication_specific_malignant_cell_coverage/
    and raises the TGT-02 gate_binding primary_module_version from "0.0.0" to
    "1.0.0". It may start only after this contract is APPROVED.
  order: >-
    fatal-first + cheap-first: TGT-01 -> TGT-05 -> TGT-08 -> TGT-02 -> TGT-03 ->
    TGT-04 -> TGT-06 -> TGT-07. TGT-01 calibrated the Module mechanics; TGT-05
    was the first fatal-first liability gate; TGT-08 was the external opportunity
    gate and the first reachable canonical NEGATIVE; TGT-02 is the first
    indication-specific malignant-cell coverage gate -- a bidirectional
    scientific coverage judgement whose NEGATIVE is a genuine scientific finding.

template_provenance:
  status: RECONSTRUCTED
  template_basis: >-
    approved E1 17-item construction template
    (src/contracts/gate_modules/tgt01_adc_modality_precedent.yaml), already
    validated by the merged PR E2 / E4 / E6 implementations. PR E7 reuses it and
    does not reinvent the template.
  blueprint_status: >-
    Blueprint v1.3 section H2.8 (Gate Module Acceptance Template, 17 items) is
    referenced by CURRENT_SYSTEM v5 but NOT present in this repository or the
    File Library.
  source:
    - "approved E1 17-item construction template (validated by the merged PR E2 / E4 / E6 implementations)"
    - CURRENT_SYSTEM v5 section 6.4 (one Gate -> one primary Module; the Module 权责边界 list) + section 11.2 (EVGAP-02 CRC linkage lock)
    - ADC_TARGET_GATESET@1.0 / TGT-02 frozen contract (src/contracts/crc_adc_target_gateset.yaml, PR D)
    - runtime migration PR A-E6 contracts (objects / Gate system / Matrix + provenance / CRC GateSet / MOD-TGT01 / MOD-TGT05 / MOD-TGT08)
  claim:
    not_claimed_verbatim_from_blueprint: true
    seventeen_item_template_reused_from_e1: true
    functionally_complete_and_consistent_with_prior_frozen_decisions: true

kernel_invariant: >-
  The kernel defines the contract; the Gate Module implements the contract.
  One-way dependency, exactly like extensions/ and MOD-TGT01 / MOD-TGT05 /
  MOD-TGT08: a future gate_modules/ implementation MAY import kernel objects /
  Gate identity / contracts; src/ MUST NEVER import gate_modules/. The Module
  may not modify the Gate id / name / candidate ownership, the gate_question,
  the Evidence Ladder, the evidence ceiling, or the fatal / unknown / conflict /
  inference semantics (CURRENT_SYSTEM v5 section 6.4). It may not reason across
  Gates, lower a measurement requirement, or turn UNKNOWN into PASS / HOLD /
  KILL. TGT-02-specific: MOD-TGT02 is a BIDIRECTIONAL scientific coverage gate.
  High-quality protein / malignant-cell-attributed evidence can establish
  malignant-cell target coverage (POSITIVE) OR its absence / rare-highly-
  heterogeneous state (NEGATIVE). But NEGATIVE is a Gate-relative scientific
  assessment; it is not a fatal flag and not a KILL. A cross-cohort protein-level
  pattern that meets the PR D fatal condition is surfaced at most as a
  machine-local fatal_review = POTENTIAL_FATAL_PATTERN; the GateSet
  fatal_gate_policy (PR B) decides the Candidate-level consequence. The Module
  never PASSES and never KILLs the target.

# The 17-item Gate Module Acceptance checklist (template reused from the approved
# PR E1 template -- see template_provenance). Each item the future MOD-TGT02
# implementation (PR E8) must satisfy before it can be accepted.
acceptance_checklist:

  "01_gate_identity_and_version":
    gate_id: TGT-02
    gate_version: "1.0"
    canonical_gateset_id: ADC_TARGET_GATESET
    gateset_version: "1.0"
    candidate_level: L04
    candidate_ownership: ADC_TARGET (L04)
    instantiation_binding: INST-CRC-REFRACTORY-ADC-TARGET-v1
    rule: the Module inherits this identity; it does not own, rename or redefine it

  "02_primary_module_identity_and_version":
    primary_module_id: MOD-TGT02
    deterministic_id_rule: "Data Layout Spec Appendix A: Module = MOD-<GATE without hyphen>"
    construction_contract_version: "0.1.0"
    module_implementation_version: "0.0.0"
    rule: >-
      exactly one primary Evidence Production Module per Gate. "0.0.0" means
      declared, not built (the PR D gate_binding slot). PR E8 builds it and
      raises the version to >= 1.0; PR E7 does not change the binding version.
      MOD-TGT02 does not own the Gate identity.

  "03_gate_question":
    verbatim_from: src/contracts/crc_adc_target_gateset.yaml gate_contracts.TGT-02.gate_question
    text: >-
      In refractory metastatic colorectal cancer, do malignant cells express the
      target at the protein level with adequate cohort-level consistency?
    rule: the Module quotes this verbatim and may not widen or narrow it
    tgt02_framing:
      answers: >-
        whether admissible public evidence establishes malignant-cell target
        coverage at the protein level, across an adequately powered CRC cohort,
        with malignant-cell attribution and cohort-level consistency
      does_not_answer:
        - whether expression persists after treatment or in metastatic sites (that is TGT-03)
        - whether the target is on the cell surface or at adequate density (that is TGT-04)
        - whether there is a favorable therapeutic index (that is TGT-05)
        - whether the candidate is desirable (Direction is about the evidence relative to the Gate question, not the candidate)

  "04_admissible_evidence_classes":
    verbatim_from: gate_contracts.TGT-02.evidence_required + evidence_ladder.*.admissible_evidence_classes
    evidence_required_from_pr_d:
      - protein expression (validated IHC / quantitative proteomics / validated multiplex IF) in annotated CRC malignant cells across a powered CRC cohort
      - single-cell or spatial transcriptomics resolving expression to the CRC malignant compartment
      - CRC tissue microarray scoring with malignant-cell attribution
      - matched normal-vs-tumor CRC comparison
    admissible:
      - protein expression (validated IHC / quantitative proteomics / validated multiplex IF) in annotated CRC malignant cells across a powered CRC cohort
      - single-cell or spatial transcriptomics resolving expression to the CRC malignant compartment
      - CRC tissue microarray scoring with malignant-cell attribution
      - matched normal-vs-tumor CRC comparison
      - protein-level target expression in annotated CRC malignant cells across an adequately powered CRC cohort with malignant-cell attribution
      - single-cell or spatial transcriptomic expression restricted to the CRC malignant compartment (not stroma or immune)
      - CRC tissue-microarray transcript-and-protein concordance with malignant-cell attribution
      - bulk CRC RNA expression without malignant-cell deconvolution
      - pan-cancer datasets not resolved to colorectal cancer
    not_admissible_into_this_gate:
      - ADC-modality precedent / addressability evidence (that is TGT-01)
      - normal-tissue liability / on-target off-tumor toxicity evidence (TGT-05)
      - treatment / metastatic persistence evidence (TGT-03)
      - surface availability / antigen density / localization / internalization evidence (TGT-04 / TGT-06)
      - shedding / soluble-antigen / sink evidence (TGT-07)
      - competitive landscape / IP-whitespace evidence (TGT-08)

  "05_evidence_ladder_and_evidence_ceiling":
    verbatim_from: gate_contracts.TGT-02.evidence_ladder + evidence_ceiling
    DIRECT:
      admissible_evidence_classes:
        - protein-level target expression in annotated CRC malignant cells across an adequately powered CRC cohort with malignant-cell attribution
      ceiling_rule: establishes indication-specific malignant-cell coverage at the protein level
    INDIRECT_STRONG:
      admissible_evidence_classes:
        - single-cell or spatial transcriptomic expression restricted to the CRC malignant compartment (not stroma or immune)
        - CRC tissue-microarray transcript-and-protein concordance with malignant-cell attribution
      ceiling_rule: strong support; protein-level confirmation is still required for a DIRECT call
    WEAK:
      admissible_evidence_classes:
        - bulk CRC RNA expression without malignant-cell deconvolution
        - pan-cancer datasets not resolved to colorectal cancer
      ceiling_rule: expression cannot be attributed to malignant cells; hypothesis only
    evidence_ceiling: protein-level malignant-cell expression across an adequately powered CRC cohort
    rule: >-
      the Module reproduces this mapping exactly; it does not redefine the
      grades, add rungs, or exceed the ceiling. A normalized-equality parity
      test binds this item to the frozen PR D contract. Transcript evidence
      never exceeds INDIRECT_STRONG; quantity (many strong transcript datasets)
      never raises the evidence-class ceiling to DIRECT.

  "06_direction_interpretation":
    strength_direction_rule: >-
      Strength is orthogonal to Direction (Blueprint v1.3). The Module proposes
      both; it never merges them and never emits a numeric or ranking score.
      Direction describes the evidence RELATIVE TO THE GATE QUESTION (adequate
      protein-level malignant-cell coverage in refractory mCRC), not candidate
      desirability. TGT-02 is a bidirectional scientific coverage gate.
    direction_definitions:
      POSITIVE: admissible evidence supports malignant-cell target coverage
      NEGATIVE: admissible evidence supports a lack of adequate malignant-cell target coverage (absent, or rare and highly heterogeneous)
      CONFLICTING: admissible observations make genuinely incompatible coverage claims and no auditable biological coverage pattern already resolves them
      INCONCLUSIVE: the admissible evidence does not resolve the Gate question
    strength_is_the_highest_qualifying_evidence_class: >-
      after the public CRC coverage landscape is complete (item 16), the overall
      Strength is the ceiling of the HIGHEST qualifying frozen evidence class
      actually met -- protein cohort DIRECT-class evidence -> DIRECT; else
      qualifying sc / spatial / TMA-concordance -> INDIRECT_STRONG; else
      INCONCLUSIVE / UNKNOWN. There is NO E6-style two-axis weaker-ceiling rule
      here: TGT-02 does not need an artificial two-axis score, because the
      Direct ladder itself already states that the protein cohort is DIRECT and
      that sc / spatial / TMA is a lower rung.
    rare_or_highly_heterogeneous_is_upstream_qualified: >-
      "absent" and "rare and highly heterogeneous" are CLASSIFICATION-DRIVING
      qualified factual states. MOD-TGT02 does NOT compute them from a
      percent-positive value, an H-score or a cohort n. They must arrive as an
      auditable upstream qualification (expression_pattern in {ABSENT,
      RARE_HIGHLY_HETEROGENEOUS} with expression_pattern_basis in
      {SOURCE_REPORTED, HUMAN_REVIEWED_NORMALIZATION}). The Module only consumes
      the qualified state; a missing or drifted qualification basis is a HARD
      integrity failure.
    frozen_truth_table:
      note: >-
        exactly ONE mapping -- E8 has no discretion. "qualifying" means the
        observation is protein-level / malignant-cell attributed / CRC-specific
        and part of a completed, audited CRC coverage landscape (item 16). A
        WEAK-only public landscape does not answer the Gate question.
      qualifying_protein_cohort_supports_broad_consistent_presence: POSITIVE / DIRECT
      qualifying_protein_cohort_supports_absent_expression: NEGATIVE / DIRECT
      qualifying_protein_cohort_supports_rare_highly_heterogeneous_coverage: NEGATIVE / DIRECT
      qualifying_sc_spatial_or_tma_concordance_supports_malignant_compartment_presence: POSITIVE / INDIRECT_STRONG
      qualifying_sc_spatial_or_tma_concordance_supports_absent_or_strongly_non_covered: NEGATIVE / INDIRECT_STRONG
      qualifying_landscape_with_incompatible_coverage_claims_and_no_resolving_pattern: CONFLICTING / <overall rung>
      qualifying_direct_authority_landscape_with_no_directional_resolution: INCONCLUSIVE / DIRECT
      qualifying_indirect_strong_landscape_with_no_directional_resolution: INCONCLUSIVE / INDIRECT_STRONG
      weak_only_public_evidence_or_incomplete_crc_coverage_search: INCONCLUSIVE / UNKNOWN
      never:
        - a strong CRC RNA signal by itself -> DIRECT (transcript is never protein-level)
        - stromal / immune / mixed-tissue expression -> malignant-cell coverage
        - a WEAK-only public landscape -> INCONCLUSIVE / WEAK (that is INCONCLUSIVE / UNKNOWN -- bulk RNA does not answer the CRC x malignant-compartment x cohort-level question)
        - a real biological heterogeneity that a valid audited multi-cohort finding characterizes as RARE_HIGHLY_HETEROGENEOUS -> CONFLICTING (that is NEGATIVE)
        - absence of expression evidence -> POSITIVE / adequate coverage
        - a favorable therapeutic index read from a matched normal-vs-tumor comparison (that is TGT-05)
    weak_vs_unknown: >-
      a WEAK observation (bulk CRC RNA without deconvolution; pan-cancer
      unresolved to CRC) is an admissible hypothesis / context observation and
      may enter the Evidence Library for human drill-down, but a WEAK-only public
      landscape yields INCONCLUSIVE / UNKNOWN, NOT INCONCLUSIVE / WEAK. Per PR A,
      INCONCLUSIVE / UNKNOWN carries ZERO evidence_refs; a graded INCONCLUSIVE
      (DIRECT / INDIRECT_STRONG) carries its CONTEXTUAL evidence_refs.
    graded_inconclusive_vs_unknown: >-
      graded INCONCLUSIVE means qualifying DIRECT- or INDIRECT_STRONG-quality
      evidence EXISTS and the landscape is complete, but after interpretation the
      coverage direction is MIXED / does not resolve presence vs inadequate
      coverage. UNKNOWN means the malignant-cell coverage question still cannot
      be answered (WEAK-only, or the mandatory CRC coverage search is
      incomplete). The two states are strictly distinct.
    conflicting_vs_qualified_heterogeneity: >-
      do NOT auto-equate real biological heterogeneity with a conflict.
      CONFLICTING requires admissible observations that make genuinely
      incompatible coverage claims (e.g. Cohort A protein says broad PRESENT,
      Cohort B protein says ABSENT) AND no valid cross-cohort characterization
      explains it. A valid audited multi-cohort finding that explicitly
      characterizes coverage as RARE_HIGHLY_HETEROGENEOUS is NEGATIVE, not
      CONFLICTING. Strength is not auto-degraded by a conflict.
    absolute_note: Direction is about the evidence relative to the Gate question, not the candidate; the Module never flips Direction on desirability grounds.

  "07_allowed_and_forbidden_inference":
    verbatim_from: gate_contracts.TGT-02.allowed_inference + forbidden_inference
    allowed:
      - the target is present on CRC malignant cells at the population level
    forbidden:
      - expression persists after treatment or in metastatic sites (that is TGT-03)
      - the target is on the cell surface or at adequate density (that is TGT-04)
      - a favorable therapeutic index (that is TGT-05)
    inference_guard:
      verbatim_from: gate_contracts.TGT-02.inference_guard
      text: >-
        The EVGAP-02 CRC linkage lock (v5 section 11.2) primarily contributes
        evidence here. Generic CRC linkage does NOT discharge TGT-03.
      rule: >-
        EVGAP-02 primarily contributes TGT-02; generic CRC linkage does NOT
        discharge TGT-03. The Module reproduces this guard verbatim and never
        lets a CRC-linkage observation stand in for TGT-03's own measurement.
    rule: the Module obeys this scientific boundary verbatim and produces no cross-Gate conclusion. A normalized-equality parity test binds this item to the frozen PR D contract.

  "08_fatal_conditions":
    verbatim_from: gate_contracts.TGT-02.fatal_conditions
    potential_fatal_signal:
      - protein-level evidence of absent, or rare and highly heterogeneous, target expression in CRC malignant cells across cohorts
    framing: >-
      a potential fatal signal that malignant-cell coverage for this target in
      refractory mCRC is inadequate for an ADC. A single negative protein cohort
      is a DIRECT NEGATIVE observation but is NOT a cross-cohort fatal pattern.
    single_cohort_vs_cross_cohort_pattern:
      one_protein_cohort_supporting_absent_or_rare_heterogeneous_coverage: DIRECT NEGATIVE evidence; NOT a cross-cohort fatal pattern
      transcript_only_negative_signal: at most INDIRECT_STRONG NEGATIVE; NOT fatal (protein-level confirmation is required)
      matched_normal_tumor_comparison: contextualises CRC malignant-cell expression only; never a fatal input on its own
      protein_level_negative_coverage_class_across_more_than_two_independent_cohorts: potential fatal pattern
    across_cohorts_is_plural_cohorts_logic_not_a_new_threshold: >-
      "across cohorts" is implemented as at least MORE THAN TWO independent
      cohort identities (distinct auditable cohort_ids). This is not a new
      biological threshold -- it is the logical realisation of the frozen word
      "cohorts" (plural, more than a single cohort). One primary observation
      that explicitly represents a declared multi-cohort analysis with more than
      two auditable cohort_ids is also admissible as cross-cohort support.
    machine_detection_criteria:
      - protein-level observations, each with CRC malignant-cell attribution
      - each with a QUALIFIED cohort adequacy status and an auditable cohort_adequacy_basis
      - each with a negative coverage class -- expression_pattern in {ABSENT, RARE_HIGHLY_HETEROGENEOUS} -- carrying an auditable expression_pattern_basis
      - a completed, audited CRC coverage landscape (item 16)
      - cross-cohort support -- more than two independent cohort identities, or one declared multi-cohort analysis with more than two auditable cohort_ids
    human_review_reserved:
      - whether a cohort's adequacy basis is scientifically convincing
      - whether the cohorts are genuinely independent / non-overlapping
      - whether the "rare and highly heterogeneous" characterisation is justified
      - whether assay / platform differences explain the apparent convergence
      - whether the cross-cohort negative pattern actually satisfies the GateSet fatal policy
    machine_output_is_only_a_potential_pattern: >-
      the Module may emit at most a machine-local fatal_review with status
      POTENTIAL_FATAL_PATTERN (see item 12). It NEVER emits
      PUBLIC_FATAL_SIGNAL_ESTABLISHED, a canonical fatal flag, a KILL, a HOLD or
      a Decision. PR D's fatal_gate_policy_ref is an independent GateSet-level
      policy reference; the Candidate-level consequence is decided by human
      review + that policy (PR B), never by the Module.
    rule: >-
      the Module only recognises and reports this evidence pattern. It never
      performs a Candidate-level KILL. It must NOT auto-declare a fatal signal
      merely because a percent-positive value, an H-score or a cohort n crosses
      some line -- no numeric threshold, no percent-positive cutoff, no H-score
      cutoff, no heterogeneity score. A normalized-equality parity test binds
      potential_fatal_signal to the frozen PR D contract.

  "09_evidence_source_plan":
    dominant_evidence_regime_frozen_contract: PUBLIC_HYBRID
    current_instantiation_regime: PUBLIC_ONLY
    experimental_sources: >-
      the frozen contract allows a hybrid path, but INST-CRC-REFRACTORY-ADC-TARGET-v1
      is PUBLIC_ONLY -- PR E7 designs the current public path only and connects
      no experiments.
    source_classes:
      direct_authority:
        - validated CRC IHC / quantitative proteomics / validated multiplex IF in annotated malignant cells across an adequately powered CRC cohort, from a primary publication / repository record with malignant-cell attribution
      indirect_strong:
        - single-cell or spatial transcriptomics with the CRC malignant compartment resolved (not stroma or immune)
        - CRC tissue-microarray transcript-and-protein concordance with malignant-cell attribution
      weak_only:
        - bulk CRC RNA without malignant-cell deconvolution
        - pan-cancer datasets not resolved to colorectal cancer
    source_authority_rules:
      - transcript evidence can support malignant-compartment expression, but it CANNOT establish protein-level malignant-cell coverage -- transcript never becomes protein
      - bulk CRC RNA and pan-cancer data can never become malignant-cell attributed
      - stromal expression, immune-cell expression and unresolved mixed-tissue expression are NOT CRC malignant-cell expression -- they may be a contextual observation but they do NOT discharge TGT-02
      - a matched normal-vs-tumor comparison contextualises CRC malignant-cell expression only; it is never "normal low + tumor high -> favorable therapeutic index" (that is TGT-05)
      - a weak_only source class can never lift an assessment above INCONCLUSIVE / UNKNOWN
      - the number of qualifying transcript datasets never raises the evidence-class ceiling above INDIRECT_STRONG
    crc_cohort_coverage_landscape:
      declared_mandatory_search_components:
        - protein cohort search
        - malignant-compartment single-cell / spatial search
        - CRC tissue-microarray transcript-and-protein concordance search
        - matched normal-vs-tumor CRC comparison search
      rule: >-
        a malignant-cell coverage assessment is tracked SEPARATELY from a
        CRC coverage-landscape-completeness assessment. Incomplete mandatory
        components -> INCONCLUSIVE / UNKNOWN (item 15). No single positive or
        negative cohort "counts as" a population-level answer; the coverage
        landscape must be completed and audited first (item 16). PR E8 carries a
        module-local typed CrcCohortCoverageCompletion record for this -- a
        run-level machine record, NOT a seventh core object.
    no_universal_threshold: >-
      no cohort-size cutoff, no percent-positive cutoff, no H-score cutoff, no
      heterogeneity score, no ranking. Any threshold that has not been through
      calibration is forbidden in this and every subsequent PR for this Module.
    connect_provider_in_this_pr: false
    shared_infrastructure_note: >-
      literature / repository / atlas retrieval, entity resolution, the
      provenance ledger and evidence serialization are shared infrastructure
      (CURRENT_SYSTEM v5 section 6.5). A future Module reuses them; it does not
      re-implement them per Gate.

  "10_input_contract":
    required_inputs:
      - candidate_id (CAND-L04-nnnnnn) and the candidate's CANONICAL target identity (the single authoritative target -- inherited from the MOD-TGT01 / PR E2 gene; no separate drift-prone target argument)
      - instantiation_id (INST-CRC-REFRACTORY-ADC-TARGET-v1) plus its context_id / context_version
      - the frozen TGT-02 gate_contract_ref and evidence_ladder_ref, and the Gate / GateSet version
      - run context (run_id, code_commit, retrieval time window / landscape_as_of, evidence_regime = PUBLIC_ONLY)
      - the declared CRC coverage search scope for this run
      - existing evidence_refs for this (candidate, gate), if any
    forbidden: >-
      any implicit default scientific context. The Module must fail rather than
      assume an indication, modality, cohort or evidence regime not supplied by
      the Instantiation. There is no second drift-prone target argument.

  "11_evidencepackage_output_contract":
    each_package:
      - is atomic and Gate-NEUTRAL -- one neutral empirical observation, no grade, no direction, no TGT-02 ceiling, no pass / fail stamped onto it
      - carries full provenance from the resolved canonical SourceIndex record (SRC-nnnnnnnn, source_type, source_identifier, locator, retrieved_at)
      - carries candidate_refs and a measurement / claim block
      - carries interpretation_boundary (observation-level directly_supports / does_not_support / limitations / a neutral observation-level evidence_ceiling)
      - carries derivation (module_run_id, code_commit)
      - carries the classification-driving observation fields in study_context (observation_kind, molecular_layer, assay_method, cohort_id / cohort_ids, crc_specific, malignant_cell_attribution + malignant_attribution_basis, cohort_adequacy_status + cohort_adequacy_basis, expression_pattern + expression_pattern_basis, context_key, landscape_as_of)
      - for a SEARCH_COMPLETION_AUDIT observation, additionally carries a structured snapshot of the CrcCohortCoverageCompletion it certifies (search_scope, sources_searched, landscape_as_of, per-component completion states, unresolved_items, qualifying_protein_cohort_ids, qualifying_indirect_cohort_ids) -- the E6 completion-audit snapshot-parity gene
    neutral_wording:
      may_say: "Cohort_A annotated malignant epithelial cells showed TARGET_A protein staining pattern X"
      may_not_say:
        - TARGET_A passes TGT-02
        - TARGET_A has adequate ADC / malignant-cell coverage
        - TARGET_A coverage is fatal
        - TARGET_A should be killed
        - any TGT-03 / TGT-04 / TGT-05 conclusion
    rules:
      - the Module references an existing EvidencePackage by evidence_id -- it reuses the EXACT canonical package, never copies or re-creates one (PR C / E1 item 11; PR E2 / E6 gene)
      - on reuse, every classification / absence driving field for that observation kind (target identity, observation_kind, molecular_layer, cohort ids, malignant_cell_attribution + basis, cohort_adequacy_status + basis, expression_pattern + basis, and for an audit EP the completion snapshot) must be present AND equal on the canonical package's study_context; a missing or drifted field is a HARD identity integrity failure (PR E2 / E6 gene)
      - forward status / superseded_by never appear on evidence.json (PR C -- they live only on the EvidenceIndexEntry)
    shape_ref: src/contracts/data_layout/evidence_package.schema.json + src/objects/decision_model.py EvidencePackage (PR A)

  "12_assessment_proposal_envelope_contract":
    the_module_emits: >-
      a non-canonical, module-local assessment PROPOSAL ENVELOPE. It is NOT a
      CandidateGateAssessment. Per PR A, a CandidateGateAssessment is the
      canonical matrix cell and CANONICAL_REVIEW_STATUS is HUMAN_APPROVED --
      constructing that object with review.status != HUMAN_APPROVED is rejected.
    the_proposal_envelope_carries:
      identity_pins_for_deterministic_canonicalisation:
        - candidate_id (CAND-L04-nnnnnn)
        - instantiation_id (INST-CRC-REFRACTORY-ADC-TARGET-v1)
        - context_id
        - context_version
        - gateset_id (ADC_TARGET_GATESET)
        - gateset_version
        - gate_id (TGT-02)
        - gate_version
      scientific_fields:
        - proposed_direction + proposed_strength (never a Decision, never a numeric or ranking score)
        - evidence_refs [{evidence_id, role}] referencing the EvidencePackages above (role in SUPPORTING / CONTRADICTING / CONTEXTUAL)
        - aggregation_rationale, critical_unknowns, evidence_ceiling
      machine_record:
        - the machine acceptance record (item 13)
    fatal_review:
      what_it_is: >-
        a NON-CANONICAL, module-local, machine-generated human-review aid on the
        run result -- NOT a field of the proposal envelope, NOT a
        CandidateGateAssessment field, NOT a new core object, NOT a change to the
        PR A / assessment.schema.json shape. It is where the structured
        potential-fatal-pattern signal lives so E8 never has to hide it in
        free-text rationale or expand a canonical contract.
      fields:
        - required (bool)
        - status (POTENTIAL_FATAL_PATTERN when required; otherwise empty)
        - evidence_ids ([EP-nnnnnnnn] of the contributing protein-level negative-coverage observations)
        - cohort_ids ([the > 2 independent CRC cohort identities])
        - coverage_class ([the expression_pattern per contributing observation -- ABSENT / RARE_HIGHLY_HETEROGENEOUS])
        - cohort_adequacy_basis_refs ([the disclosed cohort_adequacy_basis per observation])
        - expression_pattern_basis_refs ([the disclosed expression_pattern_basis per observation])
        - landscape_as_of, crc_coverage_search_scope
      machine_may_emit: POTENTIAL_FATAL_PATTERN
      machine_never_emits: PUBLIC_FATAL_SIGNAL_ESTABLISHED / a canonical fatal flag / KILL / HOLD / Decision
      required_is_true_iff: >-
        the machine has protein-level CRC malignant-cell-attributed observations
        across more than two independent cohort identities (or one declared
        multi-cohort analysis with more than two auditable cohort_ids), each with
        a QUALIFIED cohort_adequacy_status + auditable cohort_adequacy_basis and a
        negative coverage class (ABSENT / RARE_HIGHLY_HETEROGENEOUS) with an
        auditable expression_pattern_basis, on a completed audited CRC coverage
        landscape. A single negative cohort gives required = false.
      only_actionable_on_an_accepted_run: >-
        the raw detector may compute the candidate pattern internally, but a
        fatal_review is an actionable handoff ONLY on an accepted run
        (PR E6 gene). If the run fails machine acceptance the surfaced
        fatal_review is empty / not required.
      human_review_decides: >-
        whether the cohorts are genuinely independent / adequate, whether the
        rare-highly-heterogeneous characterisation is justified, and whether the
        cross-cohort negative pattern satisfies the GateSet fatal_gate_policy.
        Only then can the GateSet fatal_gate_policy / a human Decision act on the
        Candidate-level consequence. The Module never performs a Candidate-level
        KILL.
    the_proposal_envelope_never_carries:
      - assessment_id / assessment_version (human canonicalisation assigns them)
      - review.status / review.reviewer / review.reviewed_at (human canonicalisation only)
      - any TGT-03 / TGT-04 / TGT-05 conclusion
      - a fatal flag (the potential-fatal-pattern signal lives in the module-local fatal_review record, not the proposal envelope)
    rules:
      - a canonical CandidateGateAssessment (review.status = HUMAN_APPROVED) is constructed only after human approval (item 14), by the review surface, never by the Module
      - the proposed_direction x proposed_strength combination is checked against the frozen item-06 truth table and the PR A direction x strength matrix
      - PR E7 only DEFINES this envelope's field list and the fatal_review record's field list; it adds no new core object and no runtime implementation
    shape_ref: >-
      src/contracts/data_layout/assessment.schema.json is the canonicalisation
      TARGET, not a machine-proposal schema. The proposal envelope carries that
      schema's identity pins and scientific fields for a deterministic
      canonicalisation and omits assessment_id / assessment_version / review.

  "13_machine_acceptance_criteria":
    a_proposal_envelope_and_its_packages_are_machine_acceptable_iff:
      - every EvidencePackage validates against evidence_package.schema.json (shape / ids / nested blocks / date patterns)
      - the candidate's canonical target identity matches every observation's target_identity; a mismatch is a HARD misbinding failure
      - every provenance.source_id resolves to a canonical SourceIndex record whose metadata matches, and every evidence_ref.evidence_id resolves to a canonical EvidencePackage (PR C check_* functions; PR E2 gene)
      - exact canonical EP reuse parity passes -- no missing / drifted classification-driving field on a reused package (PR E2 / E6 gene)
      - the completion <-> SEARCH_COMPLETION_AUDIT snapshot parity passes -- the audit EP that names the CrcCohortCoverageCompletion carries a structured snapshot equal to that typed completion (search_scope, sources_searched, landscape_as_of, per-component completion states, unresolved_items, qualifying cohort ids); a missing / drifted snapshot is a HARD integrity failure (PR E6 gene)
      - every admissible evidence class used is in item 04's admissible list, and no item-04 not_admissible class is present
      - transcript-level evidence never proposes above INDIRECT_STRONG; bulk CRC RNA / pan-cancer never becomes malignant-cell attributed; protein without malignant-cell attribution never reaches DIRECT
      - every QUALIFIED cohort_adequacy_status carries an auditable cohort_adequacy_basis, and every ABSENT / RARE_HIGHLY_HETEROGENEOUS expression_pattern carries an auditable expression_pattern_basis; a missing / drifted qualification basis is a HARD integrity failure
      - the mandatory CRC coverage landscape is complete for the path taken (item 16); the Module did not grade early on a single positive or negative cohort
      - proposed_direction x proposed_strength is exactly the item-06 frozen truth table result for the evidence actually held; WEAK-only public evidence -> INCONCLUSIVE / UNKNOWN (never INCONCLUSIVE / WEAK); INCONCLUSIVE / UNKNOWN carries zero evidence_refs; a graded INCONCLUSIVE carries CONTEXTUAL evidence_refs
      - if the module-local fatal_review record has required = true, its status is POTENTIAL_FATAL_PATTERN (never PUBLIC_FATAL_SIGNAL_ESTABLISHED), it carries > 2 independent cohort_ids with cohort_adequacy_basis_refs and expression_pattern_basis_refs, and it is surfaced only on an accepted run
      - fatal_review is not a field of the proposal envelope
      - dedup -- one SRC -> many EP is allowed; the same (source, claim) is not duplicated across packages
      - all required fields present; no numeric or ranking score anywhere; no cohort-size / percent-positive / H-score / heterogeneity threshold
      - no TGT-03 persistence conclusion, no TGT-04 surface / density conclusion, no TGT-05 therapeutic-index conclusion, and no PUBLIC_FATAL_SIGNAL_ESTABLISHED / KILL / HOLD / Decision appears anywhere in the proposal or the fatal_review record
    on_failure: >-
      the run is rejected with a machine reason and nothing enters the canonical
      record. A HARD identity / provenance / completion-consistency /
      classification-qualification integrity failure (candidate <-> target
      misbinding, a claimed-resolved source missing from the canonical
      SourceIndex, a canonical-source metadata conflict, an incompatible
      canonical EvidencePackage, a completion-audit snapshot drift, a missing /
      drifted qualification basis) rejects the WHOLE run -- it is never degraded
      to an accepted UNKNOWN (PR E2 / E6 gene). UNKNOWN from a genuinely
      incomplete public CRC coverage search is NOT an integrity failure.

  "14_human_acceptance_and_review_surface":
    the_human_sees:
      - the proposed_direction + proposed_strength and the aggregation_rationale
      - each EvidencePackage's claim, source and interpretation_boundary (drill-down) -- per-cohort evidence, assay / molecular layer, malignant-cell attribution basis, cohort adequacy basis, expression-pattern basis
      - the ladder rung each package maps to, and any critical_unknowns
      - the CrcCohortCoverageCompletion snapshot -- which mandatory components are complete / incomplete and the qualifying cohort ids
      - the module-local fatal_review record (item 12) -- status POTENTIAL_FATAL_PATTERN, the contributing evidence_ids / cohort_ids / coverage_class / cohort_adequacy_basis_refs / expression_pattern_basis_refs
      - the machine acceptance record (item 13 pass / fail detail)
    human_only_judgements:
      - whether the aggregated direction / strength is scientifically correct for TGT-02
      - whether a cohort is genuinely adequately powered and whether the malignant-cell attribution is convincing
      - whether a source-level "rare and highly heterogeneous" interpretation is justified
      - whether the cohorts are genuinely independent / non-overlapping
      - whether a cross-cohort negative pattern satisfies the GateSet fatal policy -- i.e. whether the fatal_review POTENTIAL_FATAL_PATTERN is a real fatal signal
      - final approval -- on HUMAN_APPROVED the review surface constructs the canonical CandidateGateAssessment (review.status = HUMAN_APPROVED) from the proposal envelope; it enters ASSESSMENTS/<cand>/vNNN.json and the MatrixView rebuilds (PR C). The Module never constructs that object.
    complexity_note: >-
      TGT-02's human-only judgement covers cohort adequacy, malignant-cell
      attribution convincingness, rare-highly-heterogeneous justification, cohort
      independence and fatal-policy satisfaction -- all human calls the Module
      surfaces but does not make.

  "15_failure_unknown_and_conflict_behavior":
    retrieval_failure: report a machine failure reason; do not emit a partial proposal envelope as if complete
    direction_and_strength_follow_the_item_06_frozen_truth_table: >-
      qualifying protein-cohort evidence -> POSITIVE / DIRECT or NEGATIVE / DIRECT
      per the qualified expression_pattern; qualifying sc / spatial / TMA
      concordance -> POSITIVE or NEGATIVE at INDIRECT_STRONG; qualifying
      high-quality but nondirectional evidence -> graded INCONCLUSIVE at that
      rung.
    weak_only_bulk_or_pan_cancer: >-
      propose INCONCLUSIVE / UNKNOWN (never INCONCLUSIVE / WEAK). Verbatim from
      the frozen contract: "Only bulk RNA available -> UNKNOWN, not a pass." The
      UNKNOWN proposal carries zero evidence_refs.
    incomplete_crc_coverage_search: >-
      while the target-specific CRC coverage search has started but a mandatory
      declared component is not complete -> INCONCLUSIVE / UNKNOWN. Do not grade
      early on a pretty intermediate result -- that is what the
      CrcCohortCoverageCompletion state is for.
    conflicting_evidence: >-
      propose CONFLICTING only with admissible observations that make genuinely
      incompatible coverage claims AND no auditable biological coverage pattern
      already resolves them (item 06), with non-empty key_supporting_evidence and
      key_contradicting_evidence. A qualified rare-highly-heterogeneous
      multi-cohort pattern is NEGATIVE, not automatically CONFLICTING.
    experiment_required: >-
      TGT-02 can and should use EXPERIMENT_REQUIRED, but only when the enumerated
      public CRC coverage source space is completed / exhausted AND the
      unresolved Gate question requires a NEW malignant-cell-resolved protein or
      adequately powered cohort measurement. Examples -- (a) public sc / spatial
      consistently supports malignant-cell expression but no adequate protein
      cohort exists -> POSITIVE / INDIRECT_STRONG + critical_unknown
      "protein-level malignant-cell cohort confirmation" = EXPERIMENT_REQUIRED;
      (b) only bulk RNA exists and the public source space is exhausted ->
      INCONCLUSIVE / UNKNOWN + critical_unknown = EXPERIMENT_REQUIRED. But a
      known public dataset that has not been fetched, or an incomplete public
      cohort search, is PUBLIC_RESOLVABLE; a source that exists but whose access /
      annotation currently prevents resolution is CURRENTLY_UNRESOLVABLE. Once
      EXPERIMENT_REQUIRED is reached the public Module stops chasing weaker proxy
      evidence.
    absolute_rules:
      - UNKNOWN is never silently converted to PASS / HOLD / KILL (CURRENT_SYSTEM v5 section 6.4)
      - UNKNOWN from an incomplete public CRC coverage search is NOT an integrity failure (PR E2 / E6 gene)
      - absence of expression evidence is not a POSITIVE / adequate-coverage call
      - a scientific NEGATIVE is never a fatal flag and never a KILL

  "16_stop_rule":
    principle: >-
      the mandatory public CRC coverage landscape is completed and audited BEFORE
      any graded Direction; a single positive or negative cohort is never a
      completed population-level answer; the stop is bounded.
    normal_stop_requires_all_of:
      - the mandatory public CRC cohort coverage landscape is complete (item 09 declared_mandatory_search_components) and audited
      - the highest available qualifying evidence class is determined
      - remaining public evidence cannot change Direction or Strength
    exhaustion_stop:
      - the enumerated public CRC coverage source space is exhausted
      - the residual critical_unknown is classified -- PUBLIC_RESOLVABLE / EXPERIMENT_REQUIRED / CURRENTLY_UNRESOLVABLE -- and the run stops
    potential_fatal_trigger:
      - a machine-detected cross-cohort protein-level negative-coverage pattern (item 08) may stop the chase for weaker bulk / pan-cancer proxy evidence, but ONLY AFTER the necessary cohort coverage completeness is satisfied
      - the Module never stops on the first negative cohort
    rule: bounds the "infinite evidence gathering" failure mode without ever treating a single positive or negative cohort as a completed population-level assessment

  "17_downstream_consumer_and_handoff":
    the_module_hands_off:
      - a set of EvidencePackages and one assessment proposal envelope, to the human review surface (item 14)
      - independently, the module-local fatal_review record (item 12), for human Gate review and the GateSet fatal policy
    once_human_approved_the_resulting_canonical_CandidateGateAssessment_is_consumed_by:
      - the MatrixView cell for (this candidate_id, TGT-02) (PR C)
      - the ADC_TARGET_GATESET decision layer (decision_rule / fatal_gate_policy / required_gate_policy / unknown_policy) which turns the eight TGT assessments into a Candidate-level Decision (PR B)
      - the next Gate in the fatal-first order (TGT-03) as context only -- never as a substitute for its own measurement, and never via generic CRC linkage (item 07 inference_guard)
      - experimental validation, when a critical_unknown is EXPERIMENT_REQUIRED
    this_module_does_not:
      - construct a CandidateGateAssessment or emit a HUMAN_APPROVED record
      - produce a Candidate-level Decision or KILL
      - emit PUBLIC_FATAL_SIGNAL_ESTABLISHED -- the machine emits at most a fatal_review POTENTIAL_FATAL_PATTERN, and only on an accepted run
      - make a TGT-03 persistence, TGT-04 surface / density, or TGT-05 therapeutic-index conclusion
      - let generic CRC linkage discharge TGT-03
      - flip Direction based on candidate desirability
      - grade a Direction before the mandatory CRC coverage landscape is complete
      - write to any other Gate's evidence index or assessment
      - modify the Matrix (a rebuildable projection; PR C)

deferred_to_pr_e8_plus:
  - the new top-level gate_modules/tgt02_indication_specific_malignant_cell_coverage/ implementation (providers, adapters, extractor, normalizer, runner, EvidencePackage writer, assessment proposer, the CrcCohortCoverageCompletion typed record, the fatal_review detector) and the primary_module_version bump to "1.0.0"
  - connecting any retrieval provider or dataset (GEO / HPA / CPTAC / single-cell / spatial / TMA repositories)
  - the other four TGT primary Modules (TGT-03 -> TGT-04 -> TGT-06 -> TGT-07)

