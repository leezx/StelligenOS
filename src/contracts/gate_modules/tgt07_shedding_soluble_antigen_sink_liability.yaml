version: "0.1.0"
name: stelligenos-gate-module-construction-contract-tgt07
description: >-
  Runtime Migration PR E15. The frozen construction contract for MOD-TGT07, the
  single primary Evidence Production Module of Gate TGT-07 (Shedding /
  Soluble-Antigen / Sink Liability) under ADC_TARGET_GATESET@1.0 /
  INST-CRC-REFRACTORY-ADC-TARGET-v1. This PR delivers the contract + a
  human-readable construction drawing
  (docs/gate_modules/TGT-07_Shedding_Soluble_Antigen_Sink_Liability.md) +
  validation / parity tests + a 17-item acceptance checklist ONLY. It ships no
  implementation. The Module is built in PR E16, and only after this contract is
  APPROVED (CURRENT_SYSTEM v5 section 6.4). TGT-07 is the LAST primary Module in
  the fatal-first order and needs its semantics frozen BEFORE any code because it
  slides very easily into four failure modes: (a) "a measured circulating
  soluble-antigen concentration -> assume a material antigen sink", (b) turning a
  concentration value, including a low or below-assay-limit value, into a
  universal "material-sink concentration" threshold, (c) treating a same-target
  therapeutic with no reported PK sink as canonical NEGATIVE / DIRECT evidence
  that the intended ADC has no sink, and (d) reading soluble-antigen materiality
  as a target-intrinsic constant rather than an exposure / affinity / format
  dependent property of a specific sink-exposure context.

headline_conclusions:  # ChatGPT AI审核方案, frozen verbatim, before code
  - >-
    A measurable soluble form is not the same thing as a material antigen sink.
    Quantified circulating soluble target, documented sheddase processing or a
    validated secreted isoform may support the presence of a soluble-antigen
    sink-liability class at INDIRECT_STRONG, but materiality requires DIRECT
    evidence from a documented same-target PK / PD sink effect or a qualified
    quantitative TMDD analysis; a concentration value, including a low or
    below-assay-limit value, is never converted by the Module into a universal
    material-sink threshold.
  - >-
    Soluble-antigen materiality is exposure-context dependent. DIRECT
    observations are bound to an auditable local sink-exposure context; one clean
    DIRECT material-sink context is sufficient for POSITIVE / DIRECT, while a
    canonical NEGATIVE / DIRECT requires a qualified intended-ADC TMDD analysis
    demonstrating no material soluble sink. Opposite DIRECT conclusions are
    CONFLICTING only when they refer to the same sink-exposure context; the
    machine has no conflict resolver in v1.
  - >-
    The TGT-07 potential-fatal signal is a strict subset of POSITIVE / DIRECT,
    not a convergence rule. One qualifying DIRECT observation may surface
    POTENTIAL_FATAL_PATTERN when soluble antigen is documented or quantitatively
    modelled to materially compromise the clinically achievable exposure of a
    target-directed antibody. Clinical and TMDD evidence are alternative
    qualified source paths; the machine never decides fatality, KILL, HOLD,
    therapeutic efficacy or the Candidate-level consequence.

core_chain: >-
  qualified soluble-antigen evidence context x sink-exposure context identity x
  analysis validation x audited soluble-antigen-evidence-search completion ->
  Gate-neutral empirical soluble-antigen / shedding / PK observations -> frozen
  rung -> a HIGHEST-QUALIFYING-RUNG grading authority under an EXPOSURE-CONTEXT
  aggregation truth table (one CLEAN material-sink DIRECT sink-exposure context
  is POSITIVE / DIRECT; a qualifying INDIRECT_STRONG soluble-antigen landscape
  with no DIRECT is POSITIVE / INDIRECT_STRONG; a single DIRECT-quality analysis
  whose sink_materiality_outcome is MIXED_OR_UNRESOLVED is INCONCLUSIVE / DIRECT;
  a below-assay-limit quantitation is CONTEXTUAL and propagates no Direction) ->
  aggregate sink-liability Direction x Strength -> optional single-observation
  fatal_review (one qualifying DIRECT observation documenting or quantitatively
  modelling a material clinically-achievable-exposure compromise) -> human review
  / GateSet policy. It never becomes: a measured circulating soluble-antigen
  concentration -> a material antigen sink; a below-assay-limit value -> proof of
  no soluble form; absence of a predicted cleavage site -> no shedding; a
  same-target therapeutic with no reported PK sink -> NEGATIVE / DIRECT; a
  documented or modelled sink -> a KILL.

