    validation / parity tests and the acceptance checklist. It adds NO
    implementation, NO provider / adapter, NO absolute-quantitation flow / QIFIKIT
    / mass-cytometry / surfaceomics / membranous-IHC / subcellular-localization
    retrieval, NO extractor / normalizer / runner / dry-run executor, NO
    EvidencePackage or proposal runtime, NO fatal detector runtime, NO external
    data, NO numeric or ranking score, NO antigen-density cutoff or "adequate
    density range", NO molecules-per-cell / ABC / percent-positive / H-score
    threshold, and NO new scientific ladder semantics. It does NOT create a
    generic GateModule framework, an abstract base class, or refactor MOD-TGT01 /
