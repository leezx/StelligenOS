version: "0.1.0"
name: stelligenos-gate-module-construction-contract-tgt04
description: >-
  Runtime Migration PR E11. The frozen construction contract for MOD-TGT04, the
  single primary Evidence Production Module of Gate TGT-04 (Tumor Surface
  Availability / Density Plausibility) under ADC_TARGET_GATESET@1.0 /
  INST-CRC-REFRACTORY-ADC-TARGET-v1. This PR delivers the contract + a
  human-readable construction drawing
  (docs/gate_modules/TGT-04_Tumor_Surface_Availability_Density_Plausibility.md) +
  validation / parity tests + a 17-item acceptance checklist ONLY. It ships no
  implementation. The Module is built in PR E12, and only after this contract is
  APPROVED (CURRENT_SYSTEM v5 section 6.4). TGT-04 needs its semantics frozen
  BEFORE any code because it slides very easily into three failure modes: (a)
  "surface localization (membranous IHC / surfaceomics) -> assume adequate
  antigen density", (b) "a measured molecules-per-cell number -> compare it to an
  invented universal ADC-effective density range", and (c) confusing a
  low-but-present surface antigen with a negligible / undetectable one, or with a
  KILL.

headline_conclusions:  # ChatGPT AI审核方案, frozen verbatim, before code
  - >-
    Surface localization is not antigen density. INDIRECT_STRONG localization
    evidence may establish that the antigen is on the membrane, but only
    quantitative DIRECT evidence can answer the TGT-04 density-plausibility
    question.
  - >-
    Quantitative values are evidence, not thresholds. MOD-TGT04 may preserve
    measured antigen-density values and units, but it never derives a universal
    ADC-effective density cutoff; density plausibility must arrive as an auditable
    upstream qualification.
  - >-
    Reproducible quantitative NEGLIGIBLE_OR_UNDETECTABLE surface antigen may
    surface only POTENTIAL_FATAL_PATTERN; low-but-present antigen is not
    automatically negative or fatal, and the Module never decides fatality or ADC
    efficacy.

core_chain: >-
  qualified CRC surface context x measurement layer x malignant-cell attribution
  x audited surface-availability-search completion -> Gate-neutral empirical
  surface observations -> frozen rung -> a SINGLE-TIER grading authority (only a
  qualifying DIRECT quantitative antigen-density observation grants a graded
  Direction; a localization-only completed landscape stays INCONCLUSIVE / UNKNOWN)
  -> aggregate density-plausibility Direction x Strength -> optional
  reproducible-negligible-antigen fatal_review -> human review / GateSet policy.
  It never becomes: surface localization -> assumed density; a measured
  molecules-per-cell value -> a universal ADC-effective range; a low-but-present
  antigen -> assumed inadequate / fatal; RNA expression -> assumed surface
  protein; a NEGATIVE density call -> a KILL.

