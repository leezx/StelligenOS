  scope: tgt04_mod_tgt04_construction_contract_drawing_validation_and_acceptance_checklist_only
  spec_refs:
    - docs/architecture/CURRENT_SYSTEM_AND_MODULE_LOGIC_FOR_EXPERT_REVIEW.zh-CN.md (section 6.4 one Gate -> one primary Evidence Production Module + Module 权责边界; section 6.5 shared infrastructure; section 11.2 EVGAP-01 surface-localization lock; section 16 B group question 23 -> PR E+)
    - src/contracts/crc_adc_target_gateset.yaml (PR D -- the frozen TGT-04 gate contract, Evidence Ladder, allowed/forbidden inference, unknown behavior, fatal_conditions and inference_guard -- inherited verbatim)
    - src/contracts/gate_modules/tgt01_adc_modality_precedent.yaml (PR E1 -- the approved 17-item construction template, reused here)
