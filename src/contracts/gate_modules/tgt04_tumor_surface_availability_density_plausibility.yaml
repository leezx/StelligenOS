    - src/contracts/gate_modules/tgt05_normal_tissue_fatal_liability.yaml + tgt08_target_opportunity_competition_ip_whitespace.yaml (PR E3 / E5 -- the fatal-vs-scientific separation precedent)
    - gate_modules/tgt01_adc_modality_precedent/ + gate_modules/tgt02_indication_specific_malignant_cell_coverage/ + gate_modules/tgt03_treatment_metastatic_persistence/ + gate_modules/tgt05_normal_tissue_fatal_liability/ + gate_modules/tgt08_target_opportunity_competition_ip_whitespace/ (PR E2 / E8 / E10 / E4 / E6 -- the runtime boundary genes this contract freezes for MOD-TGT04, incl. the five E10-review corrections -- an explicitly qualified surface context for a rung; an auditable local surface-context identity that is a separate namespace from the canonical Instantiation context_id; every qualified upstream factual state carries an auditable basis; a CLOSED measurement_validation_status enum plus a non-empty factual assay_method for DIRECT; a kind / fact-specific non-inflated study_context)
