# JSON Schema (draft 2020-12) for 15_CONTEXTS/CTX-*/vNNN.yaml
# See docs/protocols/STELLIGENOS_DATA_LAYOUT_SPEC.v1.0.md sec.2b
# Context is a scope declaration, reusable and auditable like a Candidate.
# It carries no verdict: no direction / strength / decision / candidate_id.
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "stelligenos/data_layout/context.schema.yaml"
title: "StelligenOS Context (canonical vNNN.yaml)"
type: object
required:
  - context_id
  - context_version
  - canonical_name
  - dimensions
  - status
  - created_at
properties:
  context_id:
    type: string
    pattern: "^CTX-[A-Z0-9-]+$"
  context_version:
    type: integer
    minimum: 1
  canonical_name:
    type: string
    minLength: 1
  dimensions:
    type: object
    description: "indication / disease_stage / line_of_therapy / molecular_subtype / patient_territory / treatment_history / anatomical_site / model_or_system, etc. Values may be null."
    minProperties: 1
    additionalProperties:
      type: ["string", "null"]
  status:
    type: string
    enum: [ACTIVE, HOLD, RETIRED]
  created_at:
    type: string
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
  provenance_ref:
    type: string
    pattern: "^external:.+"
  superseded_by:
    type: integer
    minimum: 1
not:
  anyOf:
    - required: [direction]
    - required: [strength]
    - required: [decision]
    - required: [candidate_id]
    - required: [score]
additionalProperties: false
