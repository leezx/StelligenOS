policy_id: external:gateset/ADC_TARGET_GATESET/unknown_policy@v2
policy_version: v2
owner_gateset_id: ADC_TARGET_GATESET
owner_gateset_version: "2.0"
status: CONTRACT_ONLY_PENDING_REVIEW
scope: >-
  Distinguish an unmeasured Gate or bounded scientific uncertainty from
  acquisition, identity and source-integrity failures. Never turn absent
  evidence into a favorable assessment or Candidate GO.
precedence_after_fatal_review:
  no_decision:
    - no_HUMAN_APPROVED_assessment_exists_to_anchor_triggered_by_and_missingness_reason
  hard_reject:
    - target_or_candidate_identity_conflict
    - source_integrity_failure
    - failed_required_source_search_misrepresented_as_absence
    - EvidencePackage_reference_missing_or_field_drift
    - policy_ref_version_hash_or_approval_mismatch
    - mixed_v1_v2_assessment_snapshot
    - assessment_not_HUMAN_APPROVED
  more_evidence:
    - required_gate_not_evaluated
    - required_gate_INCONCLUSIVE/UNKNOWN_with_public_resolvable_or_experiment_required_unknown
    - TGT-05_critical_normal_cell_coverage_not_measured
  hold:
    - qualified_CONFLICTING_assessment_unresolved
    - serious_same_target_ADC_event_with_attribution_pending
    - TGT-05_or_TGT-07_material_risk_with_unresolved_consequence_or_exposure
    - unresolved_critical_unknown_marked_CURRENTLY_UNRESOLVABLE
  not_applicable: >-
    A Gate can use NOT_APPLICABLE only when its own approved contract and human
    review justify it; it cannot stand in for missing evidence in a required Gate.
outputs:
  MORE_EVIDENCE: specific missing source, coverage or experiment and accountable follow-up in a pinned approved assessment's Decision.triggered_by.reason
  HOLD: named unresolved conflict or risk and a condition that could change the decision in a pinned approved assessment's Decision.triggered_by.reason
prohibitions:
  - NONE_DOCUMENTED_is_not_safety
  - RNA_or_ordinary_IHC_negative_is_not_GO
  - no_policy_fallback_to_v1
  - no_canonical_Decision_on_hard_reject
