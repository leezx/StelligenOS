version: "0.1.0"
name: stelligenos-evidence-reference-contracts
description: >-
  Runtime contract registry for Runtime Migration PR C: the Candidate x Gate
  Matrix as a derived view, and the reusable-EvidencePackage reference layer
  (per-gate evidence index, global evidence index, global source index) with the
  end-to-end provenance walk that ties a Matrix cell back to its original source.
  Architecture contracts only: no data, no persistence, no runtime business
  logic, no decision engine. Nothing here re-opens the PR A decision-layer
  objects; the Matrix is a projection of them and the reference layer points at
  them.
migration:
  pr: runtime_migration_pr_c
  scope: matrix_view_and_reusable_evidence_reference_registry_and_provenance_walk
  spec_refs:
    - docs/architecture/CURRENT_SYSTEM_AND_MODULE_LOGIC_FOR_EXPERT_REVIEW.zh-CN.md (section 2.1 matrix; section 9 reusable EP library; section 13 runtime flow; section 16 B group question 23 -> PR C)
    - docs/architecture/contract.zh-CN.md (section 3.4)
    - docs/protocols/STELLIGENOS_DATA_LAYOUT_SPEC.v1.0.md (section 4 matrix; sections 11-14 evidence / source index; section 0.4 immutable record / no forward pointer)
  parity:
    MatrixView:
      kind: derived_view_header_parity
      against: src/contracts/data_layout/csv_headers.yaml (matrix_adc_target, assessments_long, decisions)
      note: >-
        MatrixView is a rebuildable projection, NOT a seventh decision-layer
        object and NOT a canonical persistence record. It has no id. Its wide
        header is (candidate_id, name) + the member gate ids + (decision); its
        long header is csv_headers.yaml assessments_long verbatim. It is
        losslessly rebuildable from every Candidate's ASSESSMENTS/<cand>/latest.json
        plus DECISIONS/DEC-*.json and is never hand-edited (Data Layout Spec
        section 4.2). Appendix B of that spec deliberately gives the Matrix no
        JSON Schema; PR C adds none and edits nothing under
        src/contracts/data_layout/.
    EvidenceIndexEntry:
      kind: derived_index_header_parity
      against: src/contracts/data_layout/csv_headers.yaml (library_evidence_index)
      note: >-
        One row of 30_EVIDENCE_LIBRARY/evidence_index.csv. This mutable/derived
        index is the ONLY place the forward status / superseded_by lives (Data
        Layout Spec section 0.4 / section 14). The canonical record
        (EvidencePackage evidence.json, PR A) carries neither and may carry only
        a backward supersedes_evidence_id. Field order matches the frozen header
        exactly.
    SourceIndexEntry:
      kind: derived_index_header_parity
      against: src/contracts/data_layout/csv_headers.yaml (library_source_index)
      note: >-
        One row of 30_EVIDENCE_LIBRARY/source_index.csv. One SRC-* can back many
        EP-*; an EvidencePackage references source_id only and never re-embeds
        citation metadata (Data Layout Spec section 14).
    GateEvidenceIndexEntry:
      kind: derived_index_header_parity
      against: src/contracts/data_layout/csv_headers.yaml (gate_evidence_index)
      note: >-
        One row of TGT-NN/CURRENT/evidence_index.csv -- a reference, not a copy;
        the EvidencePackage body lives only under 30_EVIDENCE_LIBRARY/PACKAGES/
        (Data Layout Spec section 13). The owning gate_id is folder-implicit on
        disk and is carried by the GateEvidenceIndex container, not by the row.
  reusable_evidence_reference:
    mechanism: evidence_refs
    note: >-
      PR A's CandidateGateAssessment.evidence_refs (a list of {evidence_id,
      role}) IS the executable typed form of Blueprint v1.3's reusable
      evidence_package_ids concept. The same EvidencePackage is referenced by
      many assessments and may take a different role on a different Gate; it is
      never copied. PR C adds the index layer around that mechanism and does not
      rename it or edit decision_objects.yaml / decision_model.py.
    pr_a_contract_untouched: true
  provenance_walk:
    chain:
      - MatrixView cell (candidate_id x member gate_id)
      - CandidateGateAssessment ASSESSMENTS/<cand>/latest.json (PR A)
      - evidence_refs[].evidence_id
      - EvidencePackage.provenance.source_id (PR A)
      - SourceIndexEntry.source_id
      - SourceIndexEntry.external_ref (external: scheme)
    supersession_lineage:
      evidence_package: backward supersedes_evidence_id on the new EP + forward status / superseded_by on EvidenceIndexEntry
      decision: backward supersedes_decision_id on the new Decision (PR B)
      candidate: parent_candidate_id on the Candidate (PR A)
    invariant: >-
      Every Matrix cell that is not UNKNOWN / NOT_APPLICABLE / NOT_EVALUATED
      must be traceable to at least one auditable EvidencePackage, and every
      EvidencePackage to its original source. PR C enforces this as referential
      integrity across the reference rows (check functions in
      src/objects/evidence_reference_model.py); it computes no direction,
      strength or decision.
  immutable_record_boundary:
    rule: >-
      Runtime MUST NOT accept a forward superseded_by or status on any canonical
      record (EvidencePackage evidence.json, Decision DEC-*.json, Context
      vNNN.yaml, Assessment vNNN.json). Those forward fields live ONLY on the
      derived index entry (EvidenceIndexEntry). A replacing record may carry a
      backward supersedes_* pointer. This closes Data Layout Spec section 0.4
      on the runtime side; it relaxes nothing and edits no frozen schema.
    forward_pointer_home: EvidenceIndexEntry.status + EvidenceIndexEntry.superseded_by
  deferred:
    crc_adc_target_gateset_v1: PR D
    per_gate_primary_modules: "PR E+"
    decision_engine: >-
      No evaluate_decision() and no matrix-rebuild engine in this repo. Rebuilding
      the Matrix from latest.json + DEC-*.json is Module / runtime work; PR C
      freezes only the view shape and the reference-layer object shapes.
  open_questions:
    evidence_independence_definition: >-
      CURRENT_SYSTEM v5 section 16 B group question 6 -- whether evidence
      independence is defined by primary source, dataset lineage or experiment
      batch. Deferred to science review. It does not block PR C structure: the
      SRC-* dedup layer (one source, many EP) is agnostic to how independence is
      ultimately defined.

repository_policy:
  instances_external_only: true
  persistence_in_repository: forbidden
  database: forbidden
  cache: forbidden
  result_files: forbidden
  decision_engine_in_repository: forbidden

vocabularies:
  evidence_index_status: [ACTIVE, SUPERSEDED, RETRACTED]
  evidence_ref_roles: [SUPPORTING, CONTRADICTING, CONTEXTUAL]
  source_type_values: [PMID, PMC, DOI, NCT, GEO, PATENT, REGULATORY, COMPANY_DISCLOSURE, DATASET, OTHER]
  matrix_cell_regex: "^((POSITIVE|NEGATIVE|CONFLICTING|INCONCLUSIVE)/(DIRECT|INDIRECT_STRONG|WEAK)|UNKNOWN|NOT_APPLICABLE|NOT_EVALUATED)$"
  matrix_wide_fixed_columns: [candidate_id, name]
  matrix_wide_trailing_column: decision
  matrix_long_columns: [candidate_id, gate_id, direction, strength, assessment_id, assessment_version, evidence_count, review_status, last_updated_at]
  decisions_view_columns: [decision_id, candidate_id, gateset_id, gateset_version, decision, triggered_by_gates, review_status, decided_at]

contracts:
  MatrixView:
    contract_id: MatrixView@0.1.0
    role: >-
      The Candidate x Gate Matrix for one Instantiation, as a derived,
      rebuildable projection: rows are Candidates, columns are the member Gates
      of the canonical GateSet, cells are the frozen wide-view state strings, and
      the trailing decision column is filled from DEC-*.json.
    required_fields:
      - instantiation_id
      - gateset_id
      - candidate_level
      - member_gate_ids
      - rows
    field_kinds:
      instantiation_id: identifier
      gateset_id: identifier
      candidate_level: controlled_text
      member_gate_ids: string_list
      rows: matrix_row_list
    row_fields:
      - candidate_id
      - name
      - cells
      - decision
    id_patterns:
      instantiation_id: "^INST-[A-Z0-9-]+-v[0-9]+$"
      gateset_id: "^[A-Z0-9_]+_GATESET$"
      candidate_id: "^CAND-L[0-9]{2}-[0-9]{6}$"
    allowed_values:
      candidate_level: [L00, L01, L02, L03, L04, L05, L06, L07, L08, L09, L10, L11, L12, L13, L14]
    invariants:
      - matrix_view_instances_must_be_external
      - matrix_view_is_a_rebuildable_projection_not_a_persisted_object_and_has_no_id
      - gateset_id_must_be_the_canonical_gateset_for_candidate_level
      - member_gate_ids_must_be_unique_and_non_empty
      - every_row_has_exactly_one_cell_per_member_gate
      - cells_use_only_the_frozen_wide_view_state_strings_no_numeric_score
      - decision_column_is_a_decision_value_or_NOT_EVALUATED
      - matrix_is_never_hand_edited_it_is_rebuilt_from_latest_json_and_dec_json

  EvidenceIndexEntry:
    contract_id: EvidenceIndexEntry@0.1.0
    role: >-
      One row of the global 30_EVIDENCE_LIBRARY/evidence_index.csv. The
      mutable/derived summary of every EvidencePackage and the only place the
      forward status / superseded_by lives.
    required_fields:
      - evidence_id
      - schema_version
      - claim_short
      - measurement_type
      - primary_source_id
      - candidate_refs
      - created_at
      - status
    optional_fields:
      - superseded_by
    csv_columns:
      - evidence_id
      - schema_version
      - claim_short
      - measurement_type
      - primary_source_id
      - candidate_refs
      - created_at
      - status
      - superseded_by
    field_kinds:
      evidence_id: identifier
      schema_version: positive_integer
      claim_short: controlled_text
      measurement_type: controlled_text
      primary_source_id: identifier
      candidate_refs: identifier_list
      created_at: iso_date_prefix
      status: controlled_text
      superseded_by: identifier_or_empty
    allowed_values:
      status: [ACTIVE, SUPERSEDED, RETRACTED]
    id_patterns:
      evidence_id: "^EP-[0-9]{8}$"
      primary_source_id: "^SRC-[0-9]{8}$"
      candidate_refs: "^CAND-L[0-9]{2}-[0-9]{6}$"
      superseded_by: "^EP-[0-9]{8}$"
    container: EvidenceLibraryIndex (entries must have unique evidence_id; every superseded_by resolves within the index and forms no cycle)
    invariants:
      - evidence_index_entry_instances_must_be_external
      - forward_status_and_superseded_by_live_only_here_not_on_evidence_json
      - status_SUPERSEDED_iff_superseded_by_is_set
      - status_ACTIVE_requires_empty_superseded_by
      - superseded_by_is_not_self
      - candidate_refs_may_be_empty_and_each_entry_is_a_CAND_id

  SourceIndexEntry:
    contract_id: SourceIndexEntry@0.1.0
    role: >-
      One row of the global 30_EVIDENCE_LIBRARY/source_index.csv. One source can
      back many EvidencePackages; the EP references source_id only.
    required_fields:
      - source_id
      - source_type
      - external_id
      - title
      - year
      - external_ref
    field_kinds:
      source_id: identifier
      source_type: controlled_text
      external_id: controlled_text
      title: free_text
      year: four_digit_year_or_empty
      external_ref: external_reference
    allowed_values:
      source_type: [PMID, PMC, DOI, NCT, GEO, PATENT, REGULATORY, COMPANY_DISCLOSURE, DATASET, OTHER]
    id_patterns:
      source_id: "^SRC-[0-9]{8}$"
    container: SourceIndex (entries must have unique source_id)
    invariants:
      - source_index_entry_instances_must_be_external
      - one_source_many_evidence_packages
      - external_ref_uses_the_external_scheme

  GateEvidenceIndexEntry:
    contract_id: GateEvidenceIndexEntry@0.1.0
    role: >-
      One row of a per-gate TGT-NN/CURRENT/evidence_index.csv -- a reference to a
      library EvidencePackage, never a copy.
    required_fields:
      - evidence_id
      - candidate_id
      - role
      - assessment_id
    field_kinds:
      evidence_id: identifier
      candidate_id: identifier
      role: controlled_text
      assessment_id: identifier
    allowed_values:
      role: [SUPPORTING, CONTRADICTING, CONTEXTUAL]
    id_patterns:
      evidence_id: "^EP-[0-9]{8}$"
      candidate_id: "^CAND-L[0-9]{2}-[0-9]{6}$"
      assessment_id: "^ASMT-[0-9]{6}$"
    container: GateEvidenceIndex (folder-implicit gate_id + entries)
    invariants:
      - gate_evidence_index_entry_instances_must_be_external
      - it_is_a_reference_the_evidence_package_body_lives_only_in_the_library
      - role_is_assessment_relative_and_may_differ_for_the_same_EP_on_another_gate
