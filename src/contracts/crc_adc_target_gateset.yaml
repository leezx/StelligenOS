  # the AI审核方案 conversation. All eight: candidate_level L04, gateset_id
  # ADC_TARGET_GATESET, gate_version "1.0".
  - gate_id: TGT-01
    name: ADC Modality Precedent
    dominant_evidence_regime: PUBLIC_PRIMARY
  - gate_id: TGT-02
    name: Indication-Specific Malignant-Cell Coverage
    dominant_evidence_regime: PUBLIC_HYBRID
  - gate_id: TGT-03
    name: Treatment / Metastatic Persistence
    dominant_evidence_regime: PUBLIC_HYBRID
  - gate_id: TGT-04
    name: Tumor Surface Availability / Density Plausibility
    dominant_evidence_regime: PUBLIC_HYBRID
  - gate_id: TGT-05
    name: Normal-Tissue Fatal Liability
    dominant_evidence_regime: PUBLIC_HYBRID
  - gate_id: TGT-06
    name: Internalization / Trafficking Addressability
    dominant_evidence_regime: PUBLIC_HYBRID
  - gate_id: TGT-07
    name: Shedding / Soluble-Antigen / Sink Liability
    dominant_evidence_regime: PUBLIC_HYBRID
  - gate_id: TGT-08
    name: Target Opportunity / Competition / IP Whitespace
    dominant_evidence_regime: PUBLIC_PRIMARY

