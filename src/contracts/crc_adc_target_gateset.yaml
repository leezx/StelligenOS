version: "0.1.0"
name: stelligenos-crc-adc-target-gateset
description: >-
  Runtime Migration PR D. The first machine-readable, context-specific
  specialization of the canonical ADC_TARGET_GATESET (L04): the frozen
  TGT-01..TGT-08 gate roster, eight concrete Evidence Ladders (evidence-class
  semantics, ceilings and inference boundaries -- no invented numeric
  thresholds), the ADC_TARGET_GATESET@1.0 GateSet, and the CRC refractory-mCRC
  Instantiation plus its context-specific gateset_binding / gate_binding records
  (the physical shape frozen by src/contracts/data_layout/gate_binding.schema.yaml).
  Architecture + scientific contracts only: no data, no persistence, no
  evaluator, no Evidence Production Module.
migration:
  pr: runtime_migration_pr_d
  scope: crc_adc_target_gateset_v1_roster_gate_contracts_ladders_gateset_and_binding
  spec_refs:
    - docs/architecture/CURRENT_SYSTEM_AND_MODULE_LOGIC_FOR_EXPERT_REVIEW.zh-CN.md (section 6.4 first construction instance + the eight TGT gate names / L04 ownership; section 11.2 EVGAP -> Gate evidence-contribution mapping; section 16 B group question 21; section 16 B group question 23 -> PR D)
    - docs/architecture/contract.zh-CN.md (section 3.4)
    - docs/protocols/STELLIGENOS_DATA_LAYOUT_SPEC.v1.0.md (section 6 gate_binding; section 7.3 gateset_binding)
    - src/contracts/data_layout/gate_binding.schema.yaml (v1.0 / APPROVED -- PR D binding records are parity-checked against it)
  normative_basis: >-
    CURRENT_SYSTEM v5 section 6.4 is the frozen normative basis for the
    TGT-01..TGT-08 ids, scientific names, L04 ownership and the "Module may not
    rename / merge / split / reassign a Gate" rule. v5 section 6.4 points the
    full canonical Gate skeleton to the EXTERNAL document
    StelligenOS_Candidate_Levels_and_GateSets_Blueprint.v0.1 section H2.4, which
    is not in this repository, and no frozen repository document pins a
    per-Gate machine gate_version. PR D therefore establishes the first
    machine-readable runtime realization of this roster.
  gate_version_provenance: >-
    PR D initializes the canonical runtime Gate version lineage at "1.0" for all
    eight TGT gates. This is NOT claimed to be copied from a pre-existing
    per-Gate version in Blueprint prose; it is the first machine version.
  scientific_review: >-
    The eight Evidence Ladders in this file are a concrete PROPOSAL. The
    scientific review is performed on this PR (#104) in the AI审核方案
    conversation: REQUEST_CHANGES until the evidence-class semantics, ceilings
    and inference boundaries are scientifically acceptable, then APPROVE, then
    merge == v1.0 frozen ladders. This mirrors PR A / B / C: code makes the
    proposal, the PR review is the freeze mechanism.
  boundary: >-
    PR D freezes evidence-class semantics / ceilings / inference boundaries. It
    does NOT invent quantitative biological thresholds (molecules/cell cutoffs,
    patient-fraction thresholds, normal-tissue tolerance numbers) -- those need
    real scientific calibration and belong to the per-Gate Modules and their
    construction drawings, not to a migration contract.
  deferred:
    per_gate_primary_modules: >-
      PR E+. PR D freezes only the "one Gate -> one primary Evidence Production
      Module" binding slot: each gate_binding record declares the deterministic
      primary_module_id (MOD-TGT0n, per Data Layout Spec Appendix A) with
      primary_module_version "0.0.0" (declared, not built). No Module code and
      no Module contract is created here. TGT-01..TGT-08 primary Modules are
      PR E+ (v5 section 16 question 23).
    quantitative_ladder_calibration: PR E+ (per-Gate Module construction drawings)
    epitope_layer_and_beyond: "PR E+"
    assessment_and_decision_evaluators: not_in_this_repo

program_label:
  label: CRC-ADC-TARGET-GATESET-v1
  rule: >-
    "CRC-ADC-TARGET-GATESET-v1" is a program / specialization label ONLY. It is
    never a gateset_id. The canonical gateset_id is always ADC_TARGET_GATESET
    (one of the fifteen canonical ids; L04). The CRC specialization is expressed
    by an Instantiation (INST-CRC-REFRACTORY-ADC-TARGET-v1) plus context-specific
    gateset_binding / gate_binding records over the SAME canonical
    ADC_TARGET_GATESET@1.0. This is exactly the physical structure frozen by
    Data Layout Spec v1.0 and the identity rule frozen by PR B.
  never_a_gateset_id: true

