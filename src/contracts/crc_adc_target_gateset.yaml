primary_module_binding:
  rule: >-
    Each gate declares exactly one primary Evidence Production Module slot, keyed
    by the deterministic id MOD-TGT0n. In PR D every primary_module_version is
    "0.0.0" (declared, not built). PR E+ builds the Module and raises its version
    to >= 1.0. A Module may not choose a different id, and may not modify the
    Gate id / name / candidate ownership, the gate_question, the Evidence Ladder,
    the evidence ceiling, or the fatal / unknown / conflict semantics (v5
    section 6.4).
  unbuilt_version: "0.0.0"

repository_policy:
  instances_external_only: true
  persistence_in_repository: forbidden
  database: forbidden
  cache: forbidden
  result_files: forbidden
  evaluator_in_repository: forbidden
  evidence_production_module_in_repository: forbidden
