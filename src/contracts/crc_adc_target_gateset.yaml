  evidence_regime: PUBLIC_ONLY
  status: ACTIVE
  version: 1
  created_at: "2026-08-28"

# Concrete PROPOSAL for scientific review on this PR. Each ladder: three rungs
# (DIRECT / INDIRECT_STRONG / WEAK) as evidence classes, per-rung ceiling_rule,
# an overall evidence_ceiling, explicit allowed / forbidden inference, an
# unknown_behavior and potential fatal_conditions. No numeric thresholds.
gate_contracts:

  TGT-01:
    gate_question: >-
      Is there prior precedent that this target (or a biologically adjacent
      target in its lineage) is addressable by the ADC modality?
    evidence_required:
      - clinical-stage or approved ADC against the same target antigen
      - discontinued / failed ADC programs against the same target and the disclosed reason
      - ADC against a structurally or biologically adjacent target in the same lineage
      - preclinical ADC constructs, patents or disclosures naming the target
    evidence_ladder:
      DIRECT:
        admissible_evidence_classes:
          - approved ADC against the same target antigen with disclosed clinical activity
          - late-clinical (phase 2 or 3) ADC against the same target antigen with disclosed clinical activity
        ceiling_rule: establishes ADC-modality precedent for this specific target
      INDIRECT_STRONG:
        admissible_evidence_classes:
          - early-clinical (phase 1) ADC against the same target antigen
        ceiling_rule: supports precedent; does not by itself establish a de-risked target
      WEAK:
        admissible_evidence_classes:
          - approved or clinical-stage ADC against a biologically adjacent target in the same lineage (a class-level signal only; the success of an adjacent-target ADC does not de-risk this target)
          - preclinical-only ADC constructs against the target
          - patents or company disclosures naming the target with no clinical data
        ceiling_rule: hypothesis-generating only; no precedent claim for this target
    evidence_ceiling: clinical-stage ADC precedent against the same target antigen
    allowed_inference:
      - ADC-modality feasibility for this target or its immediate lineage
    forbidden_inference:
      - efficacy in refractory mCRC
      - normal-tissue safety or a favorable therapeutic index
      - adequate surface density or internalization for this target
    unknown_behavior: >-
      No ADC program identified against the target or an adjacent target -> UNKNOWN,
      not KILL. A novel target is not disqualified by absence of precedent.
    fatal_conditions:
      - a target-attributable pattern of failure -- two or more independent same-target ADC programs discontinued for a consistent on-target / target-mediated toxicity or an intrinsically unachievable therapeutic window (a single product's failure, which may be driven by linker / payload / format, is not sufficient)

  TGT-02:
    gate_question: >-
      In refractory metastatic colorectal cancer, do malignant cells express the
      target at the protein level with adequate cohort-level consistency?
    evidence_required:
      - protein expression (validated IHC / quantitative proteomics / validated multiplex IF) in annotated CRC malignant cells across a powered CRC cohort
      - single-cell or spatial transcriptomics resolving expression to the CRC malignant compartment
      - CRC tissue microarray scoring with malignant-cell attribution
      - matched normal-vs-tumor CRC comparison
    evidence_ladder:
      DIRECT:
        admissible_evidence_classes:
          - protein-level target expression in annotated CRC malignant cells across an adequately powered CRC cohort with malignant-cell attribution
        ceiling_rule: establishes indication-specific malignant-cell coverage at the protein level
      INDIRECT_STRONG:
        admissible_evidence_classes:
          - single-cell or spatial transcriptomic expression restricted to the CRC malignant compartment (not stroma or immune)
          - CRC tissue-microarray transcript-and-protein concordance with malignant-cell attribution
        ceiling_rule: strong support; protein-level confirmation is still required for a DIRECT call
      WEAK:
        admissible_evidence_classes:
          - bulk CRC RNA expression without malignant-cell deconvolution
          - pan-cancer datasets not resolved to colorectal cancer
        ceiling_rule: expression cannot be attributed to malignant cells; hypothesis only
    evidence_ceiling: protein-level malignant-cell expression across an adequately powered CRC cohort
    allowed_inference:
      - the target is present on CRC malignant cells at the population level
    forbidden_inference:
      - expression persists after treatment or in metastatic sites (that is TGT-03)
      - the target is on the cell surface or at adequate density (that is TGT-04)
      - a favorable therapeutic index (that is TGT-05)
    unknown_behavior: >-
      Only bulk RNA available -> UNKNOWN, not a pass.
    fatal_conditions:
      - protein-level evidence of absent, or rare and highly heterogeneous, target expression in CRC malignant cells across cohorts
    inference_guard: >-
      The EVGAP-02 CRC linkage lock (v5 section 11.2) primarily contributes
      evidence here. Generic CRC linkage does NOT discharge TGT-03.

  TGT-03:
    gate_question: >-
      Does target expression persist in the actual clinical setting: refractory /
      prior-treated and/or metastatic CRC (including colorectal liver metastases)?
    evidence_required:
      - paired pre-/post-treatment CRC biopsies with target scoring
      - refractory or chemotherapy-exposed CRC cohort expression
      - metastatic CRC lesion expression (liver / CRLM / lung / peritoneal)
      - target expression in a validated CRC treatment-resistance model
    evidence_ladder:
      DIRECT:
        admissible_evidence_classes:
          - protein-level target retention in refractory or prior-treated CRC with malignant-cell attribution
          - protein-level target expression in metastatic CRC lesions (matched or cohort-level) with malignant-cell attribution
        ceiling_rule: establishes persistence in the intended treatment / metastatic context
      INDIRECT_STRONG:
        admissible_evidence_classes:
          - transcriptomic persistence in the treated or metastatic CRC malignant compartment
          - persistence demonstrated in a well-validated CRC treatment-resistance model
        ceiling_rule: strong support; protein confirmation in the clinical context is required for DIRECT
      WEAK:
        admissible_evidence_classes:
          - persistence inferred only from treatment-naive primary CRC expression
          - treated / metastatic persistence data from a different tumor type
        ceiling_rule: no persistence claim; hypothesis only
    evidence_ceiling: protein-level target retention in refractory / prior-treated and/or metastatic CRC with malignant-cell attribution
    allowed_inference:
      - the target remains available in the actual refractory mCRC patient population
    forbidden_inference:
      - baseline malignant-cell coverage (TGT-02) substitutes for demonstrated persistence
      - surface density (TGT-04) from persistence evidence
    unknown_behavior: >-
      Only treatment-naive primary CRC data -> UNKNOWN.
    fatal_conditions:
      - reproducible protein-level near-loss or marked loss of the target under treatment or in metastatic CRC, resulting in loss of meaningful target availability in the intended refractory / metastatic context (transient or minor down-regulation is not sufficient)
    inference_guard: >-
      Generic EVGAP-02 CRC linkage does NOT support TGT-03 (v5 section 11.2).
      TGT-03 requires independent treatment/metastasis-context evidence
      (refractory / treated / paired pre-post / metastatic / CRLM / resistance
      context). An EVGAP-02 EvidencePackage contributes here only if its source
      and context explicitly qualify.

  TGT-04:
    gate_question: >-
      Is the target present on the cell surface of CRC malignant cells at a
      density plausibly adequate for ADC payload delivery?
    evidence_required:
      - quantitative cell-surface antigen density on CRC malignant cells or well-matched CRC models (absolute-quantitation flow / QIFIKIT / mass cytometry / quantitative surfaceomics)
      - validated membranous IHC with membranous-pattern scoring on CRC malignant cells
      - cell-surface proteomics showing plasma-membrane enrichment (surface biotinylation / plasma-membrane fractionation)
      - subcellular localization evidence for the target
    evidence_ladder:
      DIRECT:
        admissible_evidence_classes:
          - quantitative cell-surface antigen density measurement on CRC malignant cells or well-matched CRC models
        ceiling_rule: establishes surface-density plausibility for an ADC
      INDIRECT_STRONG:
        admissible_evidence_classes:
          - validated membranous IHC with a membranous staining pattern on CRC malignant cells
          - cell-surface proteomics showing plasma-membrane enrichment of the target on CRC malignant cells
        ceiling_rule: supports surface LOCALIZATION; does NOT discharge the quantitative antigen-density requirement
      WEAK:
        admissible_evidence_classes:
          - surface localization asserted from sequence topology / signal-peptide / GO-term prediction
          - surface evidence from non-CRC cell lines only
          - bulk or RNA-only expression used as a surface proxy
        ceiling_rule: no surface-availability claim; hypothesis only
    evidence_ceiling: quantitative cell-surface antigen density on CRC malignant cells; surface localization alone does not reach it
    allowed_inference:
      - the antigen is on the cell surface (from INDIRECT_STRONG)
      - adequate surface-density plausibility (from DIRECT only)
    forbidden_inference:
      - surface localization implies adequate antigen density
      - density plausibility implies ADC efficacy
      - RNA expression implies surface protein
    unknown_behavior: >-
      Only localization or RNA evidence available -> strength stays UNKNOWN on
      the density question; it is not upgraded.
    fatal_conditions:
      - reproducible quantitative evidence of negligible or undetectable cell-surface antigen on CRC malignant cells -- the absence of a targetable surface antigen. This is NOT a comparison against a putative universal "clinically effective antigen-density range" (no such reliable cross-target range exists; adequacy depends on payload potency, bystander effect, internalization, epitope and DAR).
    inference_guard: >-
      The EVGAP-01 surface-localization lock (v5 section 11.2) contributes
      surface-localization evidence to TGT-04 but CANNOT alone discharge the
      antigen-density requirement: surface localization is not quantitative
      antigen density (the typical evidence ceiling for this gate).

  TGT-05:
    gate_question: >-
      Is there evidence of accessible normal-human-tissue expression, or observed
      target-mediated toxicity, that creates a potentially material
      on-target / off-tumor liability for ADC development? (fatal-first gate --
      a target-level public-evidence gate, not a product-specific
      therapeutic-window judgement)
    evidence_required:
      - human normal-tissue protein expression atlases (immunohistochemistry atlases / mass-spec proteomics) with vital-organ coverage
      - normal-tissue single-cell expression
      - clinical on-target / off-tumor toxicity for the same target from an ADC
      - clinical on-target / off-tumor toxicity for the same target from a non-ADC targeted modality (CAR-T / T-cell engager / naked antibody)
      - vital-organ expression (central nervous system, cardiac, hepatic, pulmonary, hematopoietic, gastrointestinal)
    evidence_ladder:
      DIRECT:
        admissible_evidence_classes:
          - clinical on-target / off-tumor toxicity attributable to this target from an ADC against the same target
        ceiling_rule: establishes an ADC-relevant normal-tissue liability class, including observed severity for that ADC
      INDIRECT_STRONG:
        admissible_evidence_classes:
          - clinical on-target / off-tumor toxicity for the same target from a non-ADC targeted modality (CAR-T / T-cell engager / naked antibody) -- shows the target is biologically accessible in normal tissue; the toxicity mechanism, exposure and severity do not transfer one-to-one to an ADC therapeutic window
          - protein-level normal-tissue expression in vital organs from validated human atlases
          - same-target on-target toxicity in non-human primates with translational relevance
        ceiling_rule: strong liability signal; the ADC-specific severity is not established by non-ADC modality data or atlases alone
      WEAK:
        admissible_evidence_classes:
          - normal-tissue liability inferred only from RNA atlases without protein confirmation
          - rodent-only normal-tissue or toxicity data
        ceiling_rule: liability cannot be graded; hypothesis only
    evidence_ceiling: clinical (ADC-specific for DIRECT) or protein-level human normal-tissue expression in vital organs; RNA-only atlases do not reach it
    allowed_inference:
      - the presence, and plausibility / severity signals, of a normal-tissue on-target liability class
    forbidden_inference:
      - negative RNA / IHC / atlas evidence alone implies the absence of a normal-tissue liability, or safety (protein and atlas gaps are common; a negative atlas is not proof of safety)
      - tumor selectivity at the coverage level (TGT-02) implies normal-tissue safety
      - non-ADC modality toxicity severity transfers directly to an ADC therapeutic window
      - a product-specific therapeutic-window conclusion (this is a target-level gate)
    unknown_behavior: >-
      Incomplete normal-tissue coverage -> UNKNOWN, never auto-PASS (v5 section
      6.4: an unmeasured gate must not be turned into PASS / HOLD / KILL).
    fatal_conditions:
      - a convergent target-mediated on-target / off-tumor toxicity pattern across materially distinct ADC constructs against the same target (distinct antibodies / linkers / payloads / formats converging on the same target-driven normal-tissue toxicity) -- a potential target-intrinsic fatal signal. A single ADC construct's toxicity is DIRECT evidence of an ADC-relevant liability but is NOT target-wide fatal, since it may be linker / payload / format driven; normal-tissue expression and non-ADC modality toxicity are strong liability signals, not fatal on their own.

  TGT-06:
    gate_question: >-
      Upon antibody binding, is the target-antibody complex internalized and
      trafficked to a compartment compatible with payload release?
    evidence_required:
      - antibody-induced internalization assays for the target (live-cell imaging / pH-sensitive dye / surface-decay flow)
      - lysosomal co-localization or trafficking studies for the target
      - receptor recycling-versus-degradation data
      - internalization demonstrated by a successful ADC against the same target
    evidence_ladder:
      DIRECT:
        admissible_evidence_classes:
          - existence proof that at least one tested antibody / epitope configuration against the target achieves antibody-induced internalization with lysosomal delivery in a disease-relevant context
        ceiling_rule: establishes that the target is addressable by an internalizing-payload ADC via at least one antibody / epitope configuration; internalization efficiency is configuration-specific, not target-intrinsic
      INDIRECT_STRONG:
        admissible_evidence_classes:
          - constitutive endocytosis or established internalizing-receptor biology for the target
          - antibody-induced internalization shown for the target with some antibody / epitope configuration in a non-CRC context
          - functional ADC delivery precedent (a successful same-target ADC) -- supports addressability but does not, by itself, prove the trafficking mechanism
        ceiling_rule: strong support; a demonstrated antibody-induced internalizing configuration in a disease-relevant model is required for DIRECT
      WEAK:
        admissible_evidence_classes:
          - internalization assumed from receptor-family membership
          - internalization inferred from surface localization alone
        ceiling_rule: no trafficking claim; hypothesis only
    evidence_ceiling: antibody-induced internalization with lysosomal delivery for the target via at least one antibody / epitope configuration
    allowed_inference:
      - at least one antibody / epitope configuration can internalize the target-antibody complex (payload-class dependent). Internalization is antibody x epitope x affinity x conjugation x context dependent and is not a target-intrinsic constant
    forbidden_inference:
      - surface expression implies internalization
      - internalization implies efficacy or adequate payload release for a given linker / payload
      - a single non-internalizing antibody / epitope configuration implies the target is non-internalizing
    unknown_behavior: >-
      No internalization data for any configuration -> UNKNOWN.
    fatal_conditions:
      - evidence across multiple independent antibody / epitope configurations that the target-antibody complex fails productive internalization or trafficking, i.e. surface-static receptor biology (a potential fatal for internalizing-payload ADCs; a single configuration's failure is not sufficient, and non-internalizing-payload strategies are outside this gate's fatal call)

  TGT-07:
    gate_question: >-
      Is there a circulating soluble form of the target (shed ectodomain or
      secreted isoform) that acts as an antigen sink or alters PK / biodistribution?
    evidence_required:
      - serum or plasma soluble-antigen measurements in CRC patients and in healthy donors
      - documented sheddase (ADAM / MMP) processing of the target
      - secreted splice isoforms of the target
      - clinical PK impact of soluble antigen for a targeted therapeutic against the same target
    evidence_ladder:
      DIRECT:
        admissible_evidence_classes:
          - a documented antigen-sink effect on a target-directed therapeutic's pharmacokinetics or pharmacodynamics attributable to soluble antigen
          - quantitative circulating soluble-target data combined with an exposure / affinity / turnover (target-mediated drug disposition) analysis demonstrating a material sink
        ceiling_rule: establishes the soluble-antigen sink-liability class
      INDIRECT_STRONG:
        admissible_evidence_classes:
          - quantified circulating soluble target in CRC patients without an exposure / target-mediated-disposition analysis -- shows a soluble form exists at measurable levels; whether it is a material sink depends on concentration, turnover, ADC dose / exposure, binding affinity and complex clearance
          - documented sheddase-substrate status for the target
          - a validated secreted isoform of the target
        ceiling_rule: strong support; a documented PK/PD sink effect or a target-mediated-disposition analysis is required for DIRECT
      WEAK:
        admissible_evidence_classes:
          - shedding inferred only from a predicted cleavage site
          - shedding inferred only from family analogy
        ceiling_rule: no sink-liability claim; hypothesis only
    evidence_ceiling: a documented antigen-sink PK/PD effect, or quantitative soluble-target data plus a target-mediated-disposition analysis, for the same target
    allowed_inference:
      - the presence, and materiality signals, of a soluble-antigen sink-liability class
    forbidden_inference:
      - a measured circulating soluble-antigen concentration, by itself, establishes a material antigen sink
      - absence of a predicted cleavage site implies no shedding
      - membrane expression implies no soluble form
    unknown_behavior: >-
      No soluble-antigen data -> UNKNOWN.
    fatal_conditions:
      - circulating soluble antigen demonstrated, or quantitatively modelled from an exposure / affinity / turnover analysis, to materially compromise the clinically achievable exposure of a target-directed antibody

  TGT-08:
    gate_question: >-
      Is there a differentiated opportunity for this target in refractory mCRC:
      unmet need, competitive landscape, and IP whitespace signals?
    evidence_required:
      - refractory mCRC standard-of-care and outcomes
      - competitor ADC and other targeted programs against the target (trial registries, regulatory filings, company disclosures, pipeline databases)
      - patent landscape for the target and for ADC compositions against it
      - approved or failed programs against the target and the disclosed reasons
    evidence_ladder:
      DIRECT:
        admissible_evidence_classes:
          - current competitive and clinical landscape for the target in mCRC from trial registries / regulatory sources / company disclosures, together with a composition-level patent-landscape review
        ceiling_rule: establishes the current opportunity / competition / IP-whitespace picture
      INDIRECT_STRONG:
        admissible_evidence_classes:
          - pipeline-database competitor summaries for the target
          - a target-level (not composition-level) patent search
        ceiling_rule: strong support; primary-source disclosures plus a composition-level review are required for DIRECT
      WEAK:
        admissible_evidence_classes:
          - opportunity asserted from indication-level unmet need alone, with no target-specific competitive or IP read
        ceiling_rule: no opportunity / whitespace claim; hypothesis only
    evidence_ceiling: primary-source competitive and regulatory landscape for the target in mCRC plus a composition-level patent-landscape review
    allowed_inference:
      - the relative attractiveness and crowding of the target opportunity
      - IP whitespace signals for the target and ADC compositions (dense claim coverage or apparent congestion feeds a NEGATIVE target-opportunity assessment, not a KILL)
    forbidden_inference:
      - scientific de-risking (TGT-01 through TGT-07) from a favorable commercial picture
      - a freedom-to-operate opinion or a "no viable design-around" conclusion (this gate surfaces IP whitespace signals only; a composition-level FTO judgement is not possible at the L04 target stage, before any epitope / antibody / linker / payload / DAR is chosen)
    unknown_behavior: >-
      Incomplete landscape -> UNKNOWN.
    fatal_conditions:
      - a dominant, well-protected competitor ADC already approved or in registrational trials for the same target in mCRC with no differentiation path (a commercial / strategic potential fatal signal decided on the sponsor axis per v5 section 7, not a canonical scientific KILL)

# One context-specific binding record per gate, plus the gateset binding. Shape
# is parity-checked against the frozen gate_binding.schema.yaml (oneOf
# gate_binding / gateset_binding).
context_specific_bindings:
  gateset_binding:
    gateset_id: ADC_TARGET_GATESET
    gateset_version: "1.0"
    instantiation_id: INST-CRC-REFRACTORY-ADC-TARGET-v1
    gates:
      - { gate_id: TGT-01, gate_version: "1.0" }
      - { gate_id: TGT-02, gate_version: "1.0" }
      - { gate_id: TGT-03, gate_version: "1.0" }
      - { gate_id: TGT-04, gate_version: "1.0" }
      - { gate_id: TGT-05, gate_version: "1.0" }
      - { gate_id: TGT-06, gate_version: "1.0" }
      - { gate_id: TGT-07, gate_version: "1.0" }
      - { gate_id: TGT-08, gate_version: "1.0" }
