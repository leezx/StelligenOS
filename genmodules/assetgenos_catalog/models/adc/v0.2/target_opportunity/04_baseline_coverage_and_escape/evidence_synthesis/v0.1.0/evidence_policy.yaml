reference:
  reference_id: ADC_baseline_coverage_escape_evidence
  reference_version: 0.1.0
  evidence_cutoff: "2026-07-29"
  score_semantics: >-
    residual_disease_risk is an uncalibrated baseline risk index. The common
    Gate score is one minus that risk; neither is a probability.
  confidence_cap: 0.55

evidence_contract:
  evidence_type: baseline_coverage_escape_evidence_v1
  policy_ref: ADC_baseline_coverage_escape_evidence@0.1.0
  required_top_level_fields:
  - policy_ref
  - evidence_as_of
  - indication
  - locked_endpoint
  - population_id
  - target
  - measurements

risk_components:
  baseline_target_negative_fraction:
    weight: 0.20
    mandatory: true
    denominator_semantics: endpoint_driving_population_cells
  causal_population_uncovered_fraction:
    weight: 0.20
    mandatory: true
    denominator_semantics: endpoint_driving_population_cells
  antigen_low_escape_risk:
    weight: 0.10
    mandatory: false
    denominator_semantics: endpoint_driving_population_cells
  target_loss_risk:
    weight: 0.10
    mandatory: false
    denominator_semantics: prespecified_baseline_target_variable_subclones
  lineage_switch_risk:
    weight: 0.10
    mandatory: false
    denominator_semantics: prespecified_baseline_lineage_plastic_population
  spatial_escape_risk:
    weight: 0.10
    mandatory: false
    denominator_semantics: evaluable_multiregion_tumor_compartments
  metastatic_escape_risk:
    weight: 0.10
    mandatory: false
    denominator_semantics: evaluable_paired_or_multisite_metastatic_compartments
  payload_resistance_overlap:
    weight: 0.10
    mandatory: false
    denominator_semantics: endpoint_driving_population_cells_with_declared_payload_resistance_state

scoring:
  minimum_known_weight: 0.60
  fraction_count_conflict_tolerance: 0.02
  upstream_consistency_tolerance: 0.05
  missing_behavior: residual_disease_risk_null_and_common_score_neutral
  status_behavior: formal_candidate_outputs_remain_uncertain_until_external_validation

measurement_contract:
  required_fields:
  - value_or_counts
  - assay_or_readout
  - cohort_or_model
  - sampling_scope
  - evidence_timing
  - denominator_semantics
  - source_ids
  rules:
  - evidence_timing must be pretreatment_baseline; treatment-induced transitions belong to T5.
  - Single-region or single-lesion sampling cannot support spatial or metastatic escape risk.
  - Bulk averages cannot establish cellular target-negative or antigen-low fractions.
  - Payload overlap requires a declared payload class and resistance-state definition; otherwise it remains null.
  - T2 target-negative measurements anchor the first two components and material conflicts become null.
  - High residual risk lowers the common Gate score because the Gate pass direction is favorable coverage.

method_sources:
- source_id: TRACERX_EVOLUTION_2023
  citation: Frankell AM et al. The evolution of lung cancer and impact of subclonal selection in TRACERx. Nature. 2023;616:525-533.
  url: https://www.nature.com/articles/s41586-023-05783-5
  use: Multiregion baseline heterogeneity and subclonal selection relate to relapse patterns.
- source_id: TRACERX_TRANSCRIPTOME_2023
  citation: Al Bakir M et al. The evolution of non-small cell lung cancer metastases in TRACERx. Nature. 2023;616:534-542.
  url: https://www.nature.com/articles/s41586-023-05729-x
  use: Metastatic divergence, polyclonal dissemination, and sampling depth motivate separate metastatic escape.
- source_id: TRACERX_EXPRESSION_2019
  citation: Biswas D et al. A clonal expression biomarker associates with lung cancer mortality. Nat Med. 2019;25:1540-1548.
  url: https://www.nature.com/articles/s41591-019-0595-z
  use: Transcriptomic heterogeneity can confound expression biomarkers and single-region sampling.
- source_id: LGR5_DEPLETION_2017
  citation: de Sousa e Melo F et al. A distinct role for Lgr5+ stem cells in primary and metastatic colon cancer. Nature. 2017;543:676-680.
  url: https://www.nature.com/articles/nature21713
  use: Target-negative cells can maintain tumors and replenish a depleted target-positive pool.
- source_id: LGR5_PLASTICITY_2017
  citation: Shimokawa M et al. Visualization and targeting of LGR5+ human colon cancer stem cells. Nature. 2017;545:187-192.
  url: https://www.nature.com/articles/nature22081
  use: Lineage/state plasticity can regenerate a target-positive population after ablation.
- source_id: EGFR_SCLC_SWITCH_2015
  citation: Niederst MJ et al. RB loss in resistant EGFR mutant lung adenocarcinomas that transform to small-cell lung cancer. Nat Commun. 2015;6:6377.
  url: https://www.nature.com/articles/ncomms7377
  use: Lineage transformation can retain the original driver while losing target expression and dependence.

boundaries:
- T2 owns target-to-population mapping; T4 audits uncovered baseline disease and escape reservoirs.
- T3 owns selective-depletion causality; its score is dependency context, not a T4 risk component.
- T4 uses pretreatment baseline evidence; treatment-induced state and ecological responses belong to T5.
- Payload overlap is conditional on a declared payload class and does not select a payload.
- Surface accessibility, delivery, bystander effects, exposure, and clinical safety belong to other Gates.
