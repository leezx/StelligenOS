model:
  model_id: net_endpoint_benefit_integrator_v1
  model_family: adc.v0_2.target_opportunity.net_endpoint_benefit.deterministic_integrator
  model_version: 0.1.0
  gate_id: net_endpoint_benefit
  implementation: net_endpoint_benefit_deterministic_integrator
  status: active_challenger
  runtime:
    model_name: Net Endpoint Benefit Deterministic Integrator v1
    model_type: rule_based
    provider: ADC_net_endpoint_benefit_integrator
    input_schema: GateInputEnvelope@2.0.0
    output_schema: GateModelOutput@2.0.0
    cost_tier: medium
    limitations:
    - Requires complete usable T3/T4/T5 outputs and independent exact-endpoint alignment evidence.
    - Upstream indices are uncalibrated and are integrated without claiming clinical effect size.
    - Confidence fields never contribute to benefit.
    - Safety, delivery, therapeutic index, and product feasibility are outside T6.
    calibration_status: uncalibrated_net_benefit_index
    training_data_version: ADC_net_endpoint_benefit_integrator@0.1.0
    prompt_version: null
    enabled: true
    weight: 1.0
    default_confidence_cap: 0.55
  contract_refs:
    gate: components/gates/adc/v0.2/target_opportunity/06_net_endpoint_benefit/v0.2.0/gate.yaml
    input: components/contracts/gate_input.v2.yaml
    output: components/contracts/model_output.v2.yaml
  question_template: >-
    Given usable T3 causality, T4 residual escape, T5 induced response, and
    independent evidence tied to the exact locked endpoint, what transparent
    non-duplicative biological net endpoint benefit remains?
  evidence_policy:
    may_use:
    - Usable T3, T4, and T5 GateResults.
    - Exact Candidate identity and locked endpoint.
    - Independent endpoint-alignment evidence bound to the integration policy.
    must_not_invent:
    - endpoint translation or clinical effect
    - survival benefit, safety, delivery, or therapeutic index
    - missing upstream values or confidence-derived benefit
  fallback_policy:
    mode: neutral_common_score_with_nullable_domain_outputs
    confidence_cap: 0.55
    complete_when_evidence_missing: true
    nullable_domain_fields_when_unknown: true
  version_roadmap:
  - stage: v0.1
    target: Transparent deterministic integration with anti-double-counting and exact endpoint alignment
  - stage: v0.2
    target: Versioned endpoint-translation adapters and dependency provenance checks
  - stage: v0.3
    target: Correlated-error, sensitivity, transport, and threshold analysis
  - stage: v1
    target: Independent blinded endpoint and translational validation
  - stage: v2
    target: Prospective outcome calibration, drift monitoring, and governed stable promotion
  model_card:
    standard_ref: ModelLifecycleStandard@1.0.0
    summary: Deterministic T6 integrator with explicit direction, provenance, anti-double-counting, endpoint-alignment, and confidence-isolation rules.
    intended_use:
    - Integrate T3 benefit, T4 escape, T5 rebound, and exact endpoint translation.
    - Expose every component and formula term for audit.
    decision_role: Exploratory biological endpoint-benefit synthesis; not clinical efficacy prediction.
    method_summary: Report raw causal depletion, adjust it once for residual escape, combine four non-duplicative positive components, apply one rebound aggregate, and keep confidence separate.
    input_requirements:
    - Complete usable T3/T4/T5 results.
    - Exact endpoint-alignment bundle.
    output_interpretation: net_endpoint_benefit is an uncalibrated index; confidence is separate and capped.
    evidence_boundary:
    - T3 owns causality.
    - T4 owns baseline escape.
    - T5 owns induced response.
    - T6 owns net endpoint integration.
    - Downstream Gates own realization and safety.
    known_failure_modes:
    - Correlated upstream errors.
    - Proxy endpoint mismatch.
    - Hidden double counting in source studies.
    - Model-system transport failure.
    prohibited_uses:
    - Using confidence as benefit.
    - Treating shrinkage or viability as survival.
    - Claiming clinical efficacy, safety, or therapeutic index.
    - Treating the index as a probability.
  lifecycle:
    standard_ref: ModelLifecycleStandard@1.0.0
    artifact_stage: formal_candidate
    release_kind: first_formal
    released_at: '2026-07-30T05:45:00Z'
    record_root: components/model_governance/net_endpoint_benefit_integrator_v1/v0.1.0
    change_summary:
    - Added deterministic endpoint-benefit integration and exact endpoint evidence contract.
    - Added confidence isolation and one-time escape/rebound adjustments.
    - Excluded raw causal depletion from positive weighting to prevent double counting with escape-adjusted causal benefit.
