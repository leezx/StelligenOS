gate:
  gate_id: intervention_causality
  gate_family: adc.v0_2.target_opportunity.intervention_causality
  gate_version: 0.2.0
  sequence: 3
  name: Intervention Causality
  purpose: Test whether selective depletion of the target-positive population is expected to change the locked endpoint.
  runtime:
    required: true
    hard_gate: true
    applicable_modalities:
    - ADC
    required_inputs:
    - target_opportunity
    - upstream_gate_results
    outputs:
    - depletion_endpoint_effect
    - expected_initial_response
    - expected_durable_response
    - necessity_of_target_population
    - sufficiency_of_target_population_depletion
    - redundancy_risk
    - population_replenishment_risk
    - causal_intervention_confidence
    pass_rule: score >= 0.65 with adequate evidence and no propagated hard failure
    fail_rule: score < 0.30 with direct or high-confidence evidence
    uncertainty_rule: missing, inferred, stale, or non-version-bound evidence keeps the Gate in exploration mode
    cost_tier: medium
    default_model_ids:
    - intervention_causality_llm_v0_2
    thresholds:
      pass: 0.65
      fail: 0.3
    missing_data_policy: exploration_only
    gate_group: target_opportunity
    group_code: T
    priority: P1
    dependencies:
    - endpoint_driving_population
    - target_population_mapping
    output_defaults:
      depletion_endpoint_effect: null
      expected_initial_response: null
      expected_durable_response: null
      necessity_of_target_population: null
      sufficiency_of_target_population_depletion: null
      redundancy_risk: null
      population_replenishment_risk: null
      causal_intervention_confidence: null
  input_contract:
    envelope_schema: GateInputEnvelope@2.0.0
    candidate_fields:
      target_gene:
        type: string
        description: Canonical target gene.
        required: true
      target_protein:
        type: string
        description: Canonical target protein.
        required: true
      indication:
        type: string
        description: Candidate-level indication retained for backward compatibility.
        required: true
      biological_hypothesis:
        type: string
        description: Immutable candidate hypothesis.
        required: true
    context_fields:
      target_opportunity:
        type: TargetOpportunityContext
        description: 'Version-bound v0.2 input object: target_opportunity.'
        required: true
        nullable: false
      upstream_gate_results:
        type: map[gate_id,GateResult]
        description: 'Version-bound v0.2 input object: upstream_gate_results.'
        required: true
        nullable: false
  output_contract:
    envelope_schema: GateModelOutput@2.0.0
    common_contract_ref: components/contracts/model_output.v2.yaml
    domain_fields:
      depletion_endpoint_effect:
        type: number[0,1]
        description: 'Frozen intervention_causality@0.2.0 output field: depletion_endpoint_effect.'
        required: true
        nullable: true
      expected_initial_response:
        type: string_or_structured_object
        description: 'Frozen intervention_causality@0.2.0 output field: expected_initial_response.'
        required: true
        nullable: true
      expected_durable_response:
        type: string_or_structured_object
        description: 'Frozen intervention_causality@0.2.0 output field: expected_durable_response.'
        required: true
        nullable: true
      necessity_of_target_population:
        type: string_or_structured_object
        description: 'Frozen intervention_causality@0.2.0 output field: necessity_of_target_population.'
        required: true
        nullable: true
      sufficiency_of_target_population_depletion:
        type: string_or_structured_object
        description: 'Frozen intervention_causality@0.2.0 output field: sufficiency_of_target_population_depletion.'
        required: true
        nullable: true
      redundancy_risk:
        type: number[0,1]
        description: 'Frozen intervention_causality@0.2.0 output field: redundancy_risk.'
        required: true
        nullable: true
      population_replenishment_risk:
        type: number[0,1]
        description: 'Frozen intervention_causality@0.2.0 output field: population_replenishment_risk.'
        required: true
        nullable: true
      causal_intervention_confidence:
        type: number[0,1]
        description: 'Frozen intervention_causality@0.2.0 output field: causal_intervention_confidence.'
        required: true
        nullable: true
  variation_policy:
    frozen_across_profiles:
    - Gate responsibility
    - input object names
    - output field names and direction
    - hard-failure propagation semantics
    profiles_may_override:
    - indication vocabulary
    - biomarker vocabulary
    - evidence adapters
    - thresholds
    - selected Model version
