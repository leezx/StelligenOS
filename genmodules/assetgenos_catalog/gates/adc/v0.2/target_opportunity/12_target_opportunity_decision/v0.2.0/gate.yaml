gate:
  gate_id: target_opportunity_decision
  gate_family: adc.v0_2.target_opportunity.target_opportunity_decision
  gate_version: 0.2.0
  sequence: 12
  name: Target Opportunity Decision
  purpose: Conjunctively determine whether both the Biology Chain and target-level Delivery Chain are sufficiently established
    for product realization.
  runtime:
    required: true
    hard_gate: true
    applicable_modalities:
    - ADC
    required_inputs:
    - target_opportunity
    - upstream_gate_results
    outputs:
    - biology_chain_score
    - delivery_eligibility_score
    - opportunity_bottleneck_score
    - hard_failures
    - hard_unknowns
    - target_opportunity_status
    - target_opportunity_confidence
    - next_resolution_action
    pass_rule: score >= 0.65 with adequate evidence and no propagated hard failure
    fail_rule: score < 0.30 with direct or high-confidence evidence
    uncertainty_rule: missing, inferred, stale, or non-version-bound evidence keeps the Gate in exploration mode
    cost_tier: medium
    default_model_ids:
    - target_opportunity_decision_llm_v0_2
    thresholds:
      pass: 0.65
      fail: 0.3
    missing_data_policy: exploration_only
    gate_group: target_opportunity
    group_code: T
    priority: P1
    dependencies:
    - clinical_context_endpoint
    - endpoint_driving_population
    - target_population_mapping
    - intervention_causality
    - baseline_coverage_and_escape
    - treatment_induced_state_response
    - net_endpoint_benefit
    - tumor_cell_surface_availability
    - intratumoral_antigen_accessibility
    - antibody_dependent_internalization
    - antibody_epitope_realizability
    - on_target_therapeutic_index
    output_defaults:
      biology_chain_score: null
      delivery_eligibility_score: null
      opportunity_bottleneck_score: null
      hard_failures: []
      hard_unknowns: []
      target_opportunity_status: exploration_only
      target_opportunity_confidence: null
      next_resolution_action: null
  input_contract:
    envelope_schema: GateInputEnvelope@2.0.0
    candidate_fields:
      target_gene:
        type: string
        description: Canonical target gene.
        required: true
      target_protein:
        type: string
        description: Canonical target protein.
        required: true
      indication:
        type: string
        description: Candidate-level indication retained for backward compatibility.
        required: true
      biological_hypothesis:
        type: string
        description: Immutable candidate hypothesis.
        required: true
    context_fields:
      target_opportunity:
        type: TargetOpportunityContext
        description: 'Version-bound v0.2 input object: target_opportunity.'
        required: true
        nullable: false
      upstream_gate_results:
        type: map[gate_id,GateResult]
        description: 'Version-bound v0.2 input object: upstream_gate_results.'
        required: true
        nullable: false
  output_contract:
    envelope_schema: GateModelOutput@2.0.0
    common_contract_ref: components/contracts/model_output.v2.yaml
    domain_fields:
      biology_chain_score:
        type: number[0,1]
        description: 'Frozen target_opportunity_decision@0.2.0 output field: biology_chain_score.'
        required: true
        nullable: true
      delivery_eligibility_score:
        type: number[0,1]
        description: 'Frozen target_opportunity_decision@0.2.0 output field: delivery_eligibility_score.'
        required: true
        nullable: true
      opportunity_bottleneck_score:
        type: number[0,1]
        description: 'Frozen target_opportunity_decision@0.2.0 output field: opportunity_bottleneck_score.'
        required: true
        nullable: true
      hard_failures:
        type: list[object]
        description: 'Frozen target_opportunity_decision@0.2.0 output field: hard_failures.'
        required: true
        nullable: true
      hard_unknowns:
        type: list[object]
        description: 'Frozen target_opportunity_decision@0.2.0 output field: hard_unknowns.'
        required: true
        nullable: true
      target_opportunity_status:
        type: string_or_structured_object
        description: 'Frozen target_opportunity_decision@0.2.0 output field: target_opportunity_status.'
        required: true
        nullable: true
      target_opportunity_confidence:
        type: number[0,1]
        description: 'Frozen target_opportunity_decision@0.2.0 output field: target_opportunity_confidence.'
        required: true
        nullable: true
      next_resolution_action:
        type: string_or_structured_object
        description: 'Frozen target_opportunity_decision@0.2.0 output field: next_resolution_action.'
        required: true
        nullable: true
  variation_policy:
    frozen_across_profiles:
    - Gate responsibility
    - input object names
    - output field names and direction
    - hard-failure propagation semantics
    profiles_may_override:
    - indication vocabulary
    - biomarker vocabulary
    - evidence adapters
    - thresholds
    - selected Model version
