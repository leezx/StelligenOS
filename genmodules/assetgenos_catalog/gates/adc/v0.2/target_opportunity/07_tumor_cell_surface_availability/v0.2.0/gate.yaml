gate:
  gate_id: tumor_cell_surface_availability
  gate_family: adc.v0_2.target_opportunity.tumor_cell_surface_availability
  gate_version: 0.2.0
  sequence: 7
  name: Tumor-Cell Surface Availability
  purpose: Establish sufficient, persistent, antibody-bindable protein antigen on the real target tumor cells.
  runtime:
    required: true
    hard_gate: true
    applicable_modalities:
    - ADC
    required_inputs:
    - target_opportunity
    - upstream_gate_results
    outputs:
    - protein_surface_presence
    - surface_antigen_density
    - surface_positive_fraction
    - extracellular_domain_availability
    - isoform_surface_fraction
    - cell_state_specific_surface_expression
    - treatment_stability
    - surface_availability_confidence
    pass_rule: score >= 0.65 with adequate evidence and no propagated hard failure
    fail_rule: score < 0.30 with direct or high-confidence evidence
    uncertainty_rule: missing, inferred, stale, or non-version-bound evidence keeps the Gate in exploration mode
    cost_tier: medium
    default_model_ids:
    - tumor_cell_surface_availability_llm_v0_2
    thresholds:
      pass: 0.65
      fail: 0.3
    missing_data_policy: exploration_only
    gate_group: target_opportunity
    group_code: T
    priority: P1
    dependencies:
    - target_population_mapping
    output_defaults:
      protein_surface_presence: null
      surface_antigen_density: null
      surface_positive_fraction: null
      extracellular_domain_availability: null
      isoform_surface_fraction: null
      cell_state_specific_surface_expression: null
      treatment_stability: null
      surface_availability_confidence: null
  input_contract:
    envelope_schema: GateInputEnvelope@2.0.0
    candidate_fields:
      target_gene:
        type: string
        description: Canonical target gene.
        required: true
      target_protein:
        type: string
        description: Canonical target protein.
        required: true
      indication:
        type: string
        description: Candidate-level indication retained for backward compatibility.
        required: true
      biological_hypothesis:
        type: string
        description: Immutable candidate hypothesis.
        required: true
    context_fields:
      target_opportunity:
        type: TargetOpportunityContext
        description: 'Version-bound v0.2 input object: target_opportunity.'
        required: true
        nullable: false
      upstream_gate_results:
        type: map[gate_id,GateResult]
        description: 'Version-bound v0.2 input object: upstream_gate_results.'
        required: true
        nullable: false
  output_contract:
    envelope_schema: GateModelOutput@2.0.0
    common_contract_ref: components/contracts/model_output.v2.yaml
    domain_fields:
      protein_surface_presence:
        type: string_or_structured_object
        description: 'Frozen tumor_cell_surface_availability@0.2.0 output field: protein_surface_presence.'
        required: true
        nullable: true
      surface_antigen_density:
        type: string_or_structured_object
        description: 'Frozen tumor_cell_surface_availability@0.2.0 output field: surface_antigen_density.'
        required: true
        nullable: true
      surface_positive_fraction:
        type: number[0,1]
        description: 'Frozen tumor_cell_surface_availability@0.2.0 output field: surface_positive_fraction.'
        required: true
        nullable: true
      extracellular_domain_availability:
        type: string_or_structured_object
        description: 'Frozen tumor_cell_surface_availability@0.2.0 output field: extracellular_domain_availability.'
        required: true
        nullable: true
      isoform_surface_fraction:
        type: number[0,1]
        description: 'Frozen tumor_cell_surface_availability@0.2.0 output field: isoform_surface_fraction.'
        required: true
        nullable: true
      cell_state_specific_surface_expression:
        type: string_or_structured_object
        description: 'Frozen tumor_cell_surface_availability@0.2.0 output field: cell_state_specific_surface_expression.'
        required: true
        nullable: true
      treatment_stability:
        type: number[0,1]
        description: 'Frozen tumor_cell_surface_availability@0.2.0 output field: treatment_stability.'
        required: true
        nullable: true
      surface_availability_confidence:
        type: number[0,1]
        description: 'Frozen tumor_cell_surface_availability@0.2.0 output field: surface_availability_confidence.'
        required: true
        nullable: true
  variation_policy:
    frozen_across_profiles:
    - Gate responsibility
    - input object names
    - output field names and direction
    - hard-failure propagation semantics
    profiles_may_override:
    - indication vocabulary
    - biomarker vocabulary
    - evidence adapters
    - thresholds
    - selected Model version
