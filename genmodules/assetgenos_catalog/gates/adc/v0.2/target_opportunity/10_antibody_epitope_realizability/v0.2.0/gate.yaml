gate:
  gate_id: antibody_epitope_realizability
  gate_family: adc.v0_2.target_opportunity.antibody_epitope_realizability
  gate_version: 0.2.0
  sequence: 10
  name: Antibody and Epitope Realizability
  purpose: Determine whether an epitope and antibody solution can satisfy surface binding, trafficking, selectivity, cross-reactivity,
    affinity-window, and developability requirements.
  runtime:
    required: true
    hard_gate: false
    applicable_modalities:
    - ADC
    required_inputs:
    - target_opportunity
    - upstream_gate_results
    outputs:
    - epitope_space
    - functional_epitope_availability
    - internalizing_epitope_probability
    - epitope_conservation
    - glycan_interference
    - isoform_discrimination
    - species_cross_reactivity
    - affinity_window_feasibility
    - antibody_developability
    pass_rule: score >= 0.65 with adequate evidence and no propagated hard failure
    fail_rule: score < 0.30 with direct or high-confidence evidence
    uncertainty_rule: missing, inferred, stale, or non-version-bound evidence keeps the Gate in exploration mode
    cost_tier: medium
    default_model_ids:
    - antibody_epitope_realizability_llm_v0_2
    thresholds:
      pass: 0.65
      fail: 0.3
    missing_data_policy: exploration_only
    gate_group: target_opportunity
    group_code: T
    priority: P1
    dependencies:
    - tumor_cell_surface_availability
    - antibody_dependent_internalization
    output_defaults:
      epitope_space: null
      functional_epitope_availability: null
      internalizing_epitope_probability: null
      epitope_conservation: null
      glycan_interference: null
      isoform_discrimination: null
      species_cross_reactivity: null
      affinity_window_feasibility: null
      antibody_developability: null
  input_contract:
    envelope_schema: GateInputEnvelope@2.0.0
    candidate_fields:
      target_gene:
        type: string
        description: Canonical target gene.
        required: true
      target_protein:
        type: string
        description: Canonical target protein.
        required: true
      indication:
        type: string
        description: Candidate-level indication retained for backward compatibility.
        required: true
      biological_hypothesis:
        type: string
        description: Immutable candidate hypothesis.
        required: true
    context_fields:
      target_opportunity:
        type: TargetOpportunityContext
        description: 'Version-bound v0.2 input object: target_opportunity.'
        required: true
        nullable: false
      upstream_gate_results:
        type: map[gate_id,GateResult]
        description: 'Version-bound v0.2 input object: upstream_gate_results.'
        required: true
        nullable: false
  output_contract:
    envelope_schema: GateModelOutput@2.0.0
    common_contract_ref: components/contracts/model_output.v2.yaml
    domain_fields:
      epitope_space:
        type: string_or_structured_object
        description: 'Frozen antibody_epitope_realizability@0.2.0 output field: epitope_space.'
        required: true
        nullable: true
      functional_epitope_availability:
        type: string_or_structured_object
        description: 'Frozen antibody_epitope_realizability@0.2.0 output field: functional_epitope_availability.'
        required: true
        nullable: true
      internalizing_epitope_probability:
        type: number[0,1]
        description: 'Frozen antibody_epitope_realizability@0.2.0 output field: internalizing_epitope_probability.'
        required: true
        nullable: true
      epitope_conservation:
        type: string_or_structured_object
        description: 'Frozen antibody_epitope_realizability@0.2.0 output field: epitope_conservation.'
        required: true
        nullable: true
      glycan_interference:
        type: string_or_structured_object
        description: 'Frozen antibody_epitope_realizability@0.2.0 output field: glycan_interference.'
        required: true
        nullable: true
      isoform_discrimination:
        type: string_or_structured_object
        description: 'Frozen antibody_epitope_realizability@0.2.0 output field: isoform_discrimination.'
        required: true
        nullable: true
      species_cross_reactivity:
        type: number[0,1]
        description: 'Frozen antibody_epitope_realizability@0.2.0 output field: species_cross_reactivity.'
        required: true
        nullable: true
      affinity_window_feasibility:
        type: number[0,1]
        description: 'Frozen antibody_epitope_realizability@0.2.0 output field: affinity_window_feasibility.'
        required: true
        nullable: true
      antibody_developability:
        type: string_or_structured_object
        description: 'Frozen antibody_epitope_realizability@0.2.0 output field: antibody_developability.'
        required: true
        nullable: true
  variation_policy:
    frozen_across_profiles:
    - Gate responsibility
    - input object names
    - output field names and direction
    - hard-failure propagation semantics
    profiles_may_override:
    - indication vocabulary
    - biomarker vocabulary
    - evidence adapters
    - thresholds
    - selected Model version
