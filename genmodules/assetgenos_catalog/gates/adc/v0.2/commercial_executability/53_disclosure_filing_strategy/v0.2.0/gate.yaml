gate:
  gate_id: disclosure_filing_strategy
  gate_family: adc.v0_2.commercial_executability.disclosure_filing_strategy
  gate_version: 0.2.0
  sequence: 53
  name: Disclosure Timing and Filing Strategy
  purpose: Control public disclosure, filing deadlines, provisional/PCT/jurisdiction/continuation strategy, confidentiality,
    publication holds, and inventorship review.
  runtime:
    required: true
    hard_gate: true
    applicable_modalities:
    - ADC
    required_inputs:
    - target_opportunity
    - adc_product_candidate
    - commercial_execution_context
    - upstream_gate_results
    outputs:
    - public_disclosure_risk
    - critical_filing_deadline
    - provisional_strategy
    - PCT_strategy
    - jurisdiction_strategy
    - continuation_strategy
    - publication_hold_requirements
    - confidentiality_requirements
    - inventorship_review_required
    pass_rule: score >= 0.65 with adequate evidence and no propagated hard failure
    fail_rule: score < 0.30 with direct or high-confidence evidence
    uncertainty_rule: missing, inferred, stale, or non-version-bound evidence keeps the Gate in exploration mode
    cost_tier: high
    default_model_ids:
    - disclosure_filing_strategy_llm_v0_2
    thresholds:
      pass: 0.65
      fail: 0.3
    missing_data_policy: exploration_only
    gate_group: commercial_executability
    group_code: C
    priority: P3
    dependencies:
    - own_ip_inventive_concept
    - claim_architecture_patent_estate
    output_defaults:
      public_disclosure_risk: null
      critical_filing_deadline: null
      provisional_strategy: null
      PCT_strategy: null
      jurisdiction_strategy: null
      continuation_strategy: null
      publication_hold_requirements: []
      confidentiality_requirements: []
      inventorship_review_required: null
  input_contract:
    envelope_schema: GateInputEnvelope@2.0.0
    candidate_fields:
      target_gene:
        type: string
        description: Canonical target gene.
        required: true
      target_protein:
        type: string
        description: Canonical target protein.
        required: true
      indication:
        type: string
        description: Candidate-level indication retained for backward compatibility.
        required: true
      biological_hypothesis:
        type: string
        description: Immutable candidate hypothesis.
        required: true
    context_fields:
      target_opportunity:
        type: TargetOpportunityContext
        description: 'Version-bound v0.2 input object: target_opportunity.'
        required: true
        nullable: false
      adc_product_candidate:
        type: ADCProductContext
        description: 'Version-bound v0.2 input object: adc_product_candidate.'
        required: true
        nullable: false
      commercial_execution_context:
        type: CommercialExecutionContext
        description: 'Version-bound v0.2 input object: commercial_execution_context.'
        required: true
        nullable: false
      upstream_gate_results:
        type: map[gate_id,GateResult]
        description: 'Version-bound v0.2 input object: upstream_gate_results.'
        required: true
        nullable: false
  output_contract:
    envelope_schema: GateModelOutput@2.0.0
    common_contract_ref: components/contracts/model_output.v2.yaml
    domain_fields:
      public_disclosure_risk:
        type: number[0,1]
        description: 'Frozen disclosure_filing_strategy@0.2.0 output field: public_disclosure_risk.'
        required: true
        nullable: true
      critical_filing_deadline:
        type: string_or_structured_object
        description: 'Frozen disclosure_filing_strategy@0.2.0 output field: critical_filing_deadline.'
        required: true
        nullable: true
      provisional_strategy:
        type: string_or_structured_object
        description: 'Frozen disclosure_filing_strategy@0.2.0 output field: provisional_strategy.'
        required: true
        nullable: true
      PCT_strategy:
        type: string_or_structured_object
        description: 'Frozen disclosure_filing_strategy@0.2.0 output field: PCT_strategy.'
        required: true
        nullable: true
      jurisdiction_strategy:
        type: string_or_structured_object
        description: 'Frozen disclosure_filing_strategy@0.2.0 output field: jurisdiction_strategy.'
        required: true
        nullable: true
      continuation_strategy:
        type: string_or_structured_object
        description: 'Frozen disclosure_filing_strategy@0.2.0 output field: continuation_strategy.'
        required: true
        nullable: true
      publication_hold_requirements:
        type: list[object]
        description: 'Frozen disclosure_filing_strategy@0.2.0 output field: publication_hold_requirements.'
        required: true
        nullable: true
      confidentiality_requirements:
        type: list[object]
        description: 'Frozen disclosure_filing_strategy@0.2.0 output field: confidentiality_requirements.'
        required: true
        nullable: true
      inventorship_review_required:
        type: boolean
        description: 'Frozen disclosure_filing_strategy@0.2.0 output field: inventorship_review_required.'
        required: true
        nullable: true
  variation_policy:
    frozen_across_profiles:
    - Gate responsibility
    - input object names
    - output field names and direction
    - hard-failure propagation semantics
    profiles_may_override:
    - indication vocabulary
    - biomarker vocabulary
    - evidence adapters
    - thresholds
    - selected Model version
