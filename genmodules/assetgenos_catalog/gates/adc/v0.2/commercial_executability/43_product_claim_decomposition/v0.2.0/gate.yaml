gate:
  gate_id: product_claim_decomposition
  gate_family: adc.v0_2.commercial_executability.product_claim_decomposition
  gate_version: 0.2.0
  sequence: 43
  name: Product Claim Decomposition
  purpose: Decompose the exact intended product, use, jurisdiction, and commercial acts into essential, replaceable, performance-critical,
    and claim-sensitive elements.
  runtime:
    required: true
    hard_gate: true
    applicable_modalities:
    - ADC
    required_inputs:
    - target_opportunity
    - adc_product_candidate
    - commercial_execution_context
    - upstream_gate_results
    outputs:
    - product_elements
    - essential_elements
    - replaceable_elements
    - performance_critical_elements
    - claim_sensitive_elements
    - jurisdiction_scope
    - planned_commercial_acts
    - claim_decomposition_completeness
    pass_rule: score >= 0.65 with adequate evidence and no propagated hard failure
    fail_rule: score < 0.30 with direct or high-confidence evidence
    uncertainty_rule: missing, inferred, stale, or non-version-bound evidence keeps the Gate in exploration mode
    cost_tier: low
    default_model_ids:
    - product_claim_decomposition_llm_v0_2
    thresholds:
      pass: 0.65
      fail: 0.3
    missing_data_policy: exploration_only
    gate_group: commercial_executability
    group_code: C
    priority: P0
    dependencies:
    - commercial_opportunity_threshold
    output_defaults:
      product_elements: []
      essential_elements: []
      replaceable_elements: []
      performance_critical_elements: []
      claim_sensitive_elements: []
      jurisdiction_scope: null
      planned_commercial_acts: null
      claim_decomposition_completeness: null
  input_contract:
    envelope_schema: GateInputEnvelope@2.0.0
    candidate_fields:
      target_gene:
        type: string
        description: Canonical target gene.
        required: true
      target_protein:
        type: string
        description: Canonical target protein.
        required: true
      indication:
        type: string
        description: Candidate-level indication retained for backward compatibility.
        required: true
      biological_hypothesis:
        type: string
        description: Immutable candidate hypothesis.
        required: true
    context_fields:
      target_opportunity:
        type: TargetOpportunityContext
        description: 'Version-bound v0.2 input object: target_opportunity.'
        required: true
        nullable: false
      adc_product_candidate:
        type: ADCProductContext
        description: 'Version-bound v0.2 input object: adc_product_candidate.'
        required: true
        nullable: false
      commercial_execution_context:
        type: CommercialExecutionContext
        description: 'Version-bound v0.2 input object: commercial_execution_context.'
        required: true
        nullable: false
      upstream_gate_results:
        type: map[gate_id,GateResult]
        description: 'Version-bound v0.2 input object: upstream_gate_results.'
        required: true
        nullable: false
  output_contract:
    envelope_schema: GateModelOutput@2.0.0
    common_contract_ref: components/contracts/model_output.v2.yaml
    domain_fields:
      product_elements:
        type: list[object]
        description: 'Frozen product_claim_decomposition@0.2.0 output field: product_elements.'
        required: true
        nullable: true
      essential_elements:
        type: list[object]
        description: 'Frozen product_claim_decomposition@0.2.0 output field: essential_elements.'
        required: true
        nullable: true
      replaceable_elements:
        type: list[object]
        description: 'Frozen product_claim_decomposition@0.2.0 output field: replaceable_elements.'
        required: true
        nullable: true
      performance_critical_elements:
        type: list[object]
        description: 'Frozen product_claim_decomposition@0.2.0 output field: performance_critical_elements.'
        required: true
        nullable: true
      claim_sensitive_elements:
        type: list[object]
        description: 'Frozen product_claim_decomposition@0.2.0 output field: claim_sensitive_elements.'
        required: true
        nullable: true
      jurisdiction_scope:
        type: string_or_structured_object
        description: 'Frozen product_claim_decomposition@0.2.0 output field: jurisdiction_scope.'
        required: true
        nullable: true
      planned_commercial_acts:
        type: string_or_structured_object
        description: 'Frozen product_claim_decomposition@0.2.0 output field: planned_commercial_acts.'
        required: true
        nullable: true
      claim_decomposition_completeness:
        type: number[0,1]
        description: 'Frozen product_claim_decomposition@0.2.0 output field: claim_decomposition_completeness.'
        required: true
        nullable: true
  variation_policy:
    frozen_across_profiles:
    - Gate responsibility
    - input object names
    - output field names and direction
    - hard-failure propagation semantics
    profiles_may_override:
    - indication vocabulary
    - biomarker vocabulary
    - evidence adapters
    - thresholds
    - selected Model version
