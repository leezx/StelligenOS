gate:
  gate_id: fto_product_configuration
  gate_family: adc.v0_2.commercial_executability.fto_product_configuration
  gate_version: 0.2.0
  sequence: 49
  name: FTO-Cleared Product Configuration
  purpose: Freeze the exact dated sequence-epitope-linker-payload-conjugation-indication-jurisdiction configuration after
    design-around or license, while preserving formal legal-opinion status.
  runtime:
    required: true
    hard_gate: true
    applicable_modalities:
    - ADC
    required_inputs:
    - target_opportunity
    - adc_product_candidate
    - commercial_execution_context
    - upstream_gate_results
    outputs:
    - FTO_product_version
    - cleared_product_elements
    - licensed_elements
    - owned_elements
    - public_domain_elements
    - design_around_elements
    - unresolved_elements
    - jurisdictions_cleared
    - jurisdictions_excluded
    - FTO_confidence
    - formal_opinion_status
    pass_rule: score >= 0.65 with adequate evidence and no propagated hard failure
    fail_rule: score < 0.30 with direct or high-confidence evidence
    uncertainty_rule: missing, inferred, stale, or non-version-bound evidence keeps the Gate in exploration mode
    cost_tier: high
    default_model_ids:
    - fto_product_configuration_llm_v0_2
    thresholds:
      pass: 0.65
      fail: 0.3
    missing_data_policy: exploration_only
    gate_group: commercial_executability
    group_code: C
    priority: P3
    dependencies:
    - access_strategy
    output_defaults:
      FTO_product_version: null
      cleared_product_elements: []
      licensed_elements: []
      owned_elements: []
      public_domain_elements: []
      design_around_elements: []
      unresolved_elements: []
      jurisdictions_cleared: []
      jurisdictions_excluded: []
      FTO_confidence: null
      formal_opinion_status: not_provided
  input_contract:
    envelope_schema: GateInputEnvelope@2.0.0
    candidate_fields:
      target_gene:
        type: string
        description: Canonical target gene.
        required: true
      target_protein:
        type: string
        description: Canonical target protein.
        required: true
      indication:
        type: string
        description: Candidate-level indication retained for backward compatibility.
        required: true
      biological_hypothesis:
        type: string
        description: Immutable candidate hypothesis.
        required: true
    context_fields:
      target_opportunity:
        type: TargetOpportunityContext
        description: 'Version-bound v0.2 input object: target_opportunity.'
        required: true
        nullable: false
      adc_product_candidate:
        type: ADCProductContext
        description: 'Version-bound v0.2 input object: adc_product_candidate.'
        required: true
        nullable: false
      commercial_execution_context:
        type: CommercialExecutionContext
        description: 'Version-bound v0.2 input object: commercial_execution_context.'
        required: true
        nullable: false
      upstream_gate_results:
        type: map[gate_id,GateResult]
        description: 'Version-bound v0.2 input object: upstream_gate_results.'
        required: true
        nullable: false
  output_contract:
    envelope_schema: GateModelOutput@2.0.0
    common_contract_ref: components/contracts/model_output.v2.yaml
    domain_fields:
      FTO_product_version:
        type: string_or_structured_object
        description: 'Frozen fto_product_configuration@0.2.0 output field: FTO_product_version.'
        required: true
        nullable: true
      cleared_product_elements:
        type: list[object]
        description: 'Frozen fto_product_configuration@0.2.0 output field: cleared_product_elements.'
        required: true
        nullable: true
      licensed_elements:
        type: list[object]
        description: 'Frozen fto_product_configuration@0.2.0 output field: licensed_elements.'
        required: true
        nullable: true
      owned_elements:
        type: list[object]
        description: 'Frozen fto_product_configuration@0.2.0 output field: owned_elements.'
        required: true
        nullable: true
      public_domain_elements:
        type: list[object]
        description: 'Frozen fto_product_configuration@0.2.0 output field: public_domain_elements.'
        required: true
        nullable: true
      design_around_elements:
        type: list[object]
        description: 'Frozen fto_product_configuration@0.2.0 output field: design_around_elements.'
        required: true
        nullable: true
      unresolved_elements:
        type: list[object]
        description: 'Frozen fto_product_configuration@0.2.0 output field: unresolved_elements.'
        required: true
        nullable: true
      jurisdictions_cleared:
        type: list[object]
        description: 'Frozen fto_product_configuration@0.2.0 output field: jurisdictions_cleared.'
        required: true
        nullable: true
      jurisdictions_excluded:
        type: list[object]
        description: 'Frozen fto_product_configuration@0.2.0 output field: jurisdictions_excluded.'
        required: true
        nullable: true
      FTO_confidence:
        type: number[0,1]
        description: 'Frozen fto_product_configuration@0.2.0 output field: FTO_confidence.'
        required: true
        nullable: true
      formal_opinion_status:
        type: string_or_structured_object
        description: 'Frozen fto_product_configuration@0.2.0 output field: formal_opinion_status.'
        required: true
        nullable: true
  variation_policy:
    frozen_across_profiles:
    - Gate responsibility
    - input object names
    - output field names and direction
    - hard-failure propagation semantics
    profiles_may_override:
    - indication vocabulary
    - biomarker vocabulary
    - evidence adapters
    - thresholds
    - selected Model version
