gate:
  gate_id: integrated_pk_stability_exposure
  gate_family: adc.v0_2.product_realization.integrated_pk_stability_exposure
  gate_version: 0.2.0
  sequence: 32
  name: Integrated PK, Stability and Exposure
  purpose: Integrate intact ADC, total antibody, free payload, deconjugation, clearance, sinks, distribution, exposure, catabolites,
    and species differences.
  runtime:
    required: true
    hard_gate: false
    applicable_modalities:
    - ADC
    required_inputs:
    - target_opportunity
    - adc_product_candidate
    - upstream_gate_results
    outputs:
    - intact_ADC_stability
    - deconjugation_rate
    - predicted_clearance
    - target_mediated_clearance
    - soluble_antigen_sink
    - tumor_exposure
    - normal_tissue_exposure
    - free_payload_exposure
    - active_catabolite_exposure
    - PK_confidence
    pass_rule: score >= 0.65 with adequate evidence and no propagated hard failure
    fail_rule: score < 0.30 with direct or high-confidence evidence
    uncertainty_rule: missing, inferred, stale, or non-version-bound evidence keeps the Gate in exploration mode
    cost_tier: medium_high
    default_model_ids:
    - integrated_pk_stability_exposure_llm_v0_2
    thresholds:
      pass: 0.65
      fail: 0.3
    missing_data_policy: exploration_only
    gate_group: product_realization
    group_code: P
    priority: P2
    dependencies:
    - conjugation_platform_site
    - dar_molecular_property_balance
    - linker_release_match
    output_defaults:
      intact_ADC_stability: null
      deconjugation_rate: null
      predicted_clearance: null
      target_mediated_clearance: null
      soluble_antigen_sink: null
      tumor_exposure: null
      normal_tissue_exposure: null
      free_payload_exposure: null
      active_catabolite_exposure: null
      PK_confidence: null
  input_contract:
    envelope_schema: GateInputEnvelope@2.0.0
    candidate_fields:
      target_gene:
        type: string
        description: Canonical target gene.
        required: true
      target_protein:
        type: string
        description: Canonical target protein.
        required: true
      indication:
        type: string
        description: Candidate-level indication retained for backward compatibility.
        required: true
      biological_hypothesis:
        type: string
        description: Immutable candidate hypothesis.
        required: true
    context_fields:
      target_opportunity:
        type: TargetOpportunityContext
        description: 'Version-bound v0.2 input object: target_opportunity.'
        required: true
        nullable: false
      adc_product_candidate:
        type: ADCProductContext
        description: 'Version-bound v0.2 input object: adc_product_candidate.'
        required: true
        nullable: false
      upstream_gate_results:
        type: map[gate_id,GateResult]
        description: 'Version-bound v0.2 input object: upstream_gate_results.'
        required: true
        nullable: false
  output_contract:
    envelope_schema: GateModelOutput@2.0.0
    common_contract_ref: components/contracts/model_output.v2.yaml
    domain_fields:
      intact_ADC_stability:
        type: number[0,1]
        description: 'Frozen integrated_pk_stability_exposure@0.2.0 output field: intact_ADC_stability.'
        required: true
        nullable: true
      deconjugation_rate:
        type: string_or_structured_object
        description: 'Frozen integrated_pk_stability_exposure@0.2.0 output field: deconjugation_rate.'
        required: true
        nullable: true
      predicted_clearance:
        type: string_or_structured_object
        description: 'Frozen integrated_pk_stability_exposure@0.2.0 output field: predicted_clearance.'
        required: true
        nullable: true
      target_mediated_clearance:
        type: string_or_structured_object
        description: 'Frozen integrated_pk_stability_exposure@0.2.0 output field: target_mediated_clearance.'
        required: true
        nullable: true
      soluble_antigen_sink:
        type: string_or_structured_object
        description: 'Frozen integrated_pk_stability_exposure@0.2.0 output field: soluble_antigen_sink.'
        required: true
        nullable: true
      tumor_exposure:
        type: number[0,1]
        description: 'Frozen integrated_pk_stability_exposure@0.2.0 output field: tumor_exposure.'
        required: true
        nullable: true
      normal_tissue_exposure:
        type: number[0,1]
        description: 'Frozen integrated_pk_stability_exposure@0.2.0 output field: normal_tissue_exposure.'
        required: true
        nullable: true
      free_payload_exposure:
        type: number[0,1]
        description: 'Frozen integrated_pk_stability_exposure@0.2.0 output field: free_payload_exposure.'
        required: true
        nullable: true
      active_catabolite_exposure:
        type: number[0,1]
        description: 'Frozen integrated_pk_stability_exposure@0.2.0 output field: active_catabolite_exposure.'
        required: true
        nullable: true
      PK_confidence:
        type: number[0,1]
        description: 'Frozen integrated_pk_stability_exposure@0.2.0 output field: PK_confidence.'
        required: true
        nullable: true
  variation_policy:
    frozen_across_profiles:
    - Gate responsibility
    - input object names
    - output field names and direction
    - hard-failure propagation semantics
    profiles_may_override:
    - indication vocabulary
    - biomarker vocabulary
    - evidence adapters
    - thresholds
    - selected Model version
