gate:
  gate_id: product_design_objective
  gate_family: adc.v0_2.product_realization.product_design_objective
  gate_version: 0.2.0
  sequence: 20
  name: Product Design Objective Lock
  purpose: Freeze the desired product profile from the target opportunity, required killing depth, coverage, bystander need,
    mechanism, exposure, and safety constraints.
  runtime:
    required: true
    hard_gate: true
    applicable_modalities:
    - ADC
    required_inputs:
    - target_opportunity
    - adc_product_candidate
    - upstream_gate_results
    outputs:
    - required_killing_depth
    - required_target_coverage
    - required_bystander_effect
    - required_payload_mechanism
    - required_internalization_efficiency
    - required_exposure_duration
    - acceptable_normal_tissue_risk
    - desired_product_profile
    pass_rule: score >= 0.65 with adequate evidence and no propagated hard failure
    fail_rule: score < 0.30 with direct or high-confidence evidence
    uncertainty_rule: missing, inferred, stale, or non-version-bound evidence keeps the Gate in exploration mode
    cost_tier: medium
    default_model_ids:
    - product_design_objective_llm_v0_2
    thresholds:
      pass: 0.65
      fail: 0.3
    missing_data_policy: exploration_only
    gate_group: product_realization
    group_code: P
    priority: P1
    dependencies:
    - target_opportunity_decision
    output_defaults:
      required_killing_depth: null
      required_target_coverage: null
      required_bystander_effect: null
      required_payload_mechanism: null
      required_internalization_efficiency: null
      required_exposure_duration: null
      acceptable_normal_tissue_risk: null
      desired_product_profile: null
  input_contract:
    envelope_schema: GateInputEnvelope@2.0.0
    candidate_fields:
      target_gene:
        type: string
        description: Canonical target gene.
        required: true
      target_protein:
        type: string
        description: Canonical target protein.
        required: true
      indication:
        type: string
        description: Candidate-level indication retained for backward compatibility.
        required: true
      biological_hypothesis:
        type: string
        description: Immutable candidate hypothesis.
        required: true
    context_fields:
      target_opportunity:
        type: TargetOpportunityContext
        description: 'Version-bound v0.2 input object: target_opportunity.'
        required: true
        nullable: false
      adc_product_candidate:
        type: ADCProductContext
        description: 'Version-bound v0.2 input object: adc_product_candidate.'
        required: true
        nullable: false
      upstream_gate_results:
        type: map[gate_id,GateResult]
        description: 'Version-bound v0.2 input object: upstream_gate_results.'
        required: true
        nullable: false
  output_contract:
    envelope_schema: GateModelOutput@2.0.0
    common_contract_ref: components/contracts/model_output.v2.yaml
    domain_fields:
      required_killing_depth:
        type: string_or_structured_object
        description: 'Frozen product_design_objective@0.2.0 output field: required_killing_depth.'
        required: true
        nullable: true
      required_target_coverage:
        type: number[0,1]
        description: 'Frozen product_design_objective@0.2.0 output field: required_target_coverage.'
        required: true
        nullable: true
      required_bystander_effect:
        type: number[0,1]
        description: 'Frozen product_design_objective@0.2.0 output field: required_bystander_effect.'
        required: true
        nullable: true
      required_payload_mechanism:
        type: string_or_structured_object
        description: 'Frozen product_design_objective@0.2.0 output field: required_payload_mechanism.'
        required: true
        nullable: true
      required_internalization_efficiency:
        type: string_or_structured_object
        description: 'Frozen product_design_objective@0.2.0 output field: required_internalization_efficiency.'
        required: true
        nullable: true
      required_exposure_duration:
        type: number[0,1]
        description: 'Frozen product_design_objective@0.2.0 output field: required_exposure_duration.'
        required: true
        nullable: true
      acceptable_normal_tissue_risk:
        type: number[0,1]
        description: 'Frozen product_design_objective@0.2.0 output field: acceptable_normal_tissue_risk.'
        required: true
        nullable: true
      desired_product_profile:
        type: string_or_structured_object
        description: 'Frozen product_design_objective@0.2.0 output field: desired_product_profile.'
        required: true
        nullable: true
  variation_policy:
    frozen_across_profiles:
    - Gate responsibility
    - input object names
    - output field names and direction
    - hard-failure propagation semantics
    profiles_may_override:
    - indication vocabulary
    - biomarker vocabulary
    - evidence adapters
    - thresholds
    - selected Model version
