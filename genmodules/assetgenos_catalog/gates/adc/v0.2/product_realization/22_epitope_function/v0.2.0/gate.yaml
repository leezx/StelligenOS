gate:
  gate_id: epitope_function
  gate_family: adc.v0_2.product_realization.epitope_function
  gate_version: 0.2.0
  sequence: 22
  name: Epitope Functional Behavior
  purpose: Evaluate how antibody occupation of each epitope changes internalization, clustering, lysosomal routing, recycling,
    shedding, signaling, and pH behavior.
  runtime:
    required: true
    hard_gate: true
    applicable_modalities:
    - ADC
    required_inputs:
    - target_opportunity
    - adc_product_candidate
    - upstream_gate_results
    outputs:
    - binding_induced_internalization
    - receptor_clustering_effect
    - lysosomal_routing_effect
    - recycling_effect
    - shedding_effect
    - agonism_risk
    - antagonism_potential
    - receptor_stabilization_risk
    - pH_release_opportunity
    pass_rule: score >= 0.65 with adequate evidence and no propagated hard failure
    fail_rule: score < 0.30 with direct or high-confidence evidence
    uncertainty_rule: missing, inferred, stale, or non-version-bound evidence keeps the Gate in exploration mode
    cost_tier: medium_high
    default_model_ids:
    - epitope_function_llm_v0_2
    thresholds:
      pass: 0.65
      fail: 0.3
    missing_data_policy: exploration_only
    gate_group: product_realization
    group_code: P
    priority: P2
    dependencies:
    - epitope_landscape
    output_defaults:
      binding_induced_internalization: null
      receptor_clustering_effect: null
      lysosomal_routing_effect: null
      recycling_effect: null
      shedding_effect: null
      agonism_risk: null
      antagonism_potential: null
      receptor_stabilization_risk: null
      pH_release_opportunity: null
  input_contract:
    envelope_schema: GateInputEnvelope@2.0.0
    candidate_fields:
      target_gene:
        type: string
        description: Canonical target gene.
        required: true
      target_protein:
        type: string
        description: Canonical target protein.
        required: true
      indication:
        type: string
        description: Candidate-level indication retained for backward compatibility.
        required: true
      biological_hypothesis:
        type: string
        description: Immutable candidate hypothesis.
        required: true
    context_fields:
      target_opportunity:
        type: TargetOpportunityContext
        description: 'Version-bound v0.2 input object: target_opportunity.'
        required: true
        nullable: false
      adc_product_candidate:
        type: ADCProductContext
        description: 'Version-bound v0.2 input object: adc_product_candidate.'
        required: true
        nullable: false
      upstream_gate_results:
        type: map[gate_id,GateResult]
        description: 'Version-bound v0.2 input object: upstream_gate_results.'
        required: true
        nullable: false
  output_contract:
    envelope_schema: GateModelOutput@2.0.0
    common_contract_ref: components/contracts/model_output.v2.yaml
    domain_fields:
      binding_induced_internalization:
        type: string_or_structured_object
        description: 'Frozen epitope_function@0.2.0 output field: binding_induced_internalization.'
        required: true
        nullable: true
      receptor_clustering_effect:
        type: number[0,1]
        description: 'Frozen epitope_function@0.2.0 output field: receptor_clustering_effect.'
        required: true
        nullable: true
      lysosomal_routing_effect:
        type: number[0,1]
        description: 'Frozen epitope_function@0.2.0 output field: lysosomal_routing_effect.'
        required: true
        nullable: true
      recycling_effect:
        type: number[0,1]
        description: 'Frozen epitope_function@0.2.0 output field: recycling_effect.'
        required: true
        nullable: true
      shedding_effect:
        type: number[0,1]
        description: 'Frozen epitope_function@0.2.0 output field: shedding_effect.'
        required: true
        nullable: true
      agonism_risk:
        type: number[0,1]
        description: 'Frozen epitope_function@0.2.0 output field: agonism_risk.'
        required: true
        nullable: true
      antagonism_potential:
        type: number[0,1]
        description: 'Frozen epitope_function@0.2.0 output field: antagonism_potential.'
        required: true
        nullable: true
      receptor_stabilization_risk:
        type: number[0,1]
        description: 'Frozen epitope_function@0.2.0 output field: receptor_stabilization_risk.'
        required: true
        nullable: true
      pH_release_opportunity:
        type: string_or_structured_object
        description: 'Frozen epitope_function@0.2.0 output field: pH_release_opportunity.'
        required: true
        nullable: true
  variation_policy:
    frozen_across_profiles:
    - Gate responsibility
    - input object names
    - output field names and direction
    - hard-failure propagation semantics
    profiles_may_override:
    - indication vocabulary
    - biomarker vocabulary
    - evidence adapters
    - thresholds
    - selected Model version
