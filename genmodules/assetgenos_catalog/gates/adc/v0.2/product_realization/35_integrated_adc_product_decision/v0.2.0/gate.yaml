gate:
  gate_id: integrated_adc_product_decision
  gate_family: adc.v0_2.product_realization.integrated_adc_product_decision
  gate_version: 0.2.0
  sequence: 35
  name: Integrated ADC Product Decision
  purpose: Conjunctively select viable construct families using productive delivery, state killing, heterogeneity coverage,
    PK/stability, therapeutic index, manufacturability, and biomarker readiness.
  runtime:
    required: true
    hard_gate: true
    applicable_modalities:
    - ADC
    required_inputs:
    - target_opportunity
    - adc_product_candidate
    - upstream_gate_results
    outputs:
    - productive_delivery_score
    - cell_state_killing_score
    - heterogeneity_coverage_score
    - PK_stability_score
    - therapeutic_index_score
    - manufacturability_score
    - biomarker_readiness_score
    - product_bottleneck_score
    - product_confidence
    - fatal_product_risks
    - fatal_product_risk_severity
    - optimal_construct_family
    - next_design_iteration
    pass_rule: score >= 0.65 with adequate evidence and no propagated hard failure
    fail_rule: score < 0.30 with direct or high-confidence evidence
    uncertainty_rule: missing, inferred, stale, or non-version-bound evidence keeps the Gate in exploration mode
    cost_tier: high
    default_model_ids:
    - integrated_adc_product_decision_llm_v0_2
    thresholds:
      pass: 0.65
      fail: 0.3
    missing_data_policy: exploration_only
    gate_group: product_realization
    group_code: P
    priority: P3
    dependencies:
    - product_design_objective
    - epitope_landscape
    - epitope_function
    - binding_geometry_kinetics
    - antibody_format_fc_design
    - antibody_sequence_developability
    - productive_internalization_trafficking
    - conjugation_platform_site
    - dar_molecular_property_balance
    - payload_cell_state_match
    - linker_release_match
    - bystander_tumor_coverage
    - integrated_pk_stability_exposure
    - construct_therapeutic_index
    - biomarker_clinical_assay_codesign
    output_defaults:
      productive_delivery_score: null
      cell_state_killing_score: null
      heterogeneity_coverage_score: null
      PK_stability_score: null
      therapeutic_index_score: null
      manufacturability_score: null
      biomarker_readiness_score: null
      product_bottleneck_score: null
      product_confidence: null
      fatal_product_risks: []
      fatal_product_risk_severity: null
      optimal_construct_family: null
      next_design_iteration: null
  input_contract:
    envelope_schema: GateInputEnvelope@2.0.0
    candidate_fields:
      target_gene:
        type: string
        description: Canonical target gene.
        required: true
      target_protein:
        type: string
        description: Canonical target protein.
        required: true
      indication:
        type: string
        description: Candidate-level indication retained for backward compatibility.
        required: true
      biological_hypothesis:
        type: string
        description: Immutable candidate hypothesis.
        required: true
    context_fields:
      target_opportunity:
        type: TargetOpportunityContext
        description: 'Version-bound v0.2 input object: target_opportunity.'
        required: true
        nullable: false
      adc_product_candidate:
        type: ADCProductContext
        description: 'Version-bound v0.2 input object: adc_product_candidate.'
        required: true
        nullable: false
      upstream_gate_results:
        type: map[gate_id,GateResult]
        description: 'Version-bound v0.2 input object: upstream_gate_results.'
        required: true
        nullable: false
  output_contract:
    envelope_schema: GateModelOutput@2.0.0
    common_contract_ref: components/contracts/model_output.v2.yaml
    domain_fields:
      productive_delivery_score:
        type: number[0,1]
        description: 'Frozen integrated_adc_product_decision@0.2.0 output field: productive_delivery_score.'
        required: true
        nullable: true
      cell_state_killing_score:
        type: number[0,1]
        description: 'Frozen integrated_adc_product_decision@0.2.0 output field: cell_state_killing_score.'
        required: true
        nullable: true
      heterogeneity_coverage_score:
        type: number[0,1]
        description: 'Frozen integrated_adc_product_decision@0.2.0 output field: heterogeneity_coverage_score.'
        required: true
        nullable: true
      PK_stability_score:
        type: number[0,1]
        description: 'Frozen integrated_adc_product_decision@0.2.0 output field: PK_stability_score.'
        required: true
        nullable: true
      therapeutic_index_score:
        type: number[0,1]
        description: 'Frozen integrated_adc_product_decision@0.2.0 output field: therapeutic_index_score.'
        required: true
        nullable: true
      manufacturability_score:
        type: number[0,1]
        description: 'Frozen integrated_adc_product_decision@0.2.0 output field: manufacturability_score.'
        required: true
        nullable: true
      biomarker_readiness_score:
        type: number[0,1]
        description: 'Frozen integrated_adc_product_decision@0.2.0 output field: biomarker_readiness_score.'
        required: true
        nullable: true
      product_bottleneck_score:
        type: number[0,1]
        description: 'Frozen integrated_adc_product_decision@0.2.0 output field: product_bottleneck_score.'
        required: true
        nullable: true
      product_confidence:
        type: number[0,1]
        description: 'Frozen integrated_adc_product_decision@0.2.0 output field: product_confidence.'
        required: true
        nullable: true
      fatal_product_risks:
        type: list[object]
        description: 'Frozen integrated_adc_product_decision@0.2.0 output field: fatal_product_risks.'
        required: true
        nullable: true
      fatal_product_risk_severity:
        type: number[0,1]
        description: 'Frozen integrated_adc_product_decision@0.2.0 output field: fatal_product_risk_severity.'
        required: true
        nullable: true
      optimal_construct_family:
        type: string_or_structured_object
        description: 'Frozen integrated_adc_product_decision@0.2.0 output field: optimal_construct_family.'
        required: true
        nullable: true
      next_design_iteration:
        type: string_or_structured_object
        description: 'Frozen integrated_adc_product_decision@0.2.0 output field: next_design_iteration.'
        required: true
        nullable: true
  variation_policy:
    frozen_across_profiles:
    - Gate responsibility
    - input object names
    - output field names and direction
    - hard-failure propagation semantics
    profiles_may_override:
    - indication vocabulary
    - biomarker vocabulary
    - evidence adapters
    - thresholds
    - selected Model version
