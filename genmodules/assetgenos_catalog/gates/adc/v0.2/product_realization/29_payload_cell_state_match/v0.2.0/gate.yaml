gate:
  gate_id: payload_cell_state_match
  gate_family: adc.v0_2.product_realization.payload_cell_state_match
  gate_version: 0.2.0
  sequence: 29
  name: Payload Mechanism–Cell-State Match
  purpose: Match payload mechanism to the endpoint-driving cell state, cycling status, repair and apoptotic competence, efflux,
    prior therapy, and resistance liabilities.
  runtime:
    required: true
    hard_gate: true
    applicable_modalities:
    - ADC
    required_inputs:
    - target_opportunity
    - adc_product_candidate
    - upstream_gate_results
    outputs:
    - payload_MOA
    - target_state_sensitivity
    - cell_cycle_dependence
    - slow_cycling_activity
    - apoptotic_competence_requirement
    - DNA_repair_dependency
    - efflux_susceptibility
    - SOC_cross_resistance
    - payload_resistance_risk
    - payload_endpoint_alignment
    pass_rule: score >= 0.65 with adequate evidence and no propagated hard failure
    fail_rule: score < 0.30 with direct or high-confidence evidence
    uncertainty_rule: missing, inferred, stale, or non-version-bound evidence keeps the Gate in exploration mode
    cost_tier: medium_high
    default_model_ids:
    - payload_cell_state_match_llm_v0_2
    thresholds:
      pass: 0.65
      fail: 0.3
    missing_data_policy: exploration_only
    gate_group: product_realization
    group_code: P
    priority: P2
    dependencies:
    - product_design_objective
    - endpoint_driving_population
    - treatment_induced_state_response
    output_defaults:
      payload_MOA: null
      target_state_sensitivity: null
      cell_cycle_dependence: null
      slow_cycling_activity: null
      apoptotic_competence_requirement: null
      DNA_repair_dependency: null
      efflux_susceptibility: null
      SOC_cross_resistance: null
      payload_resistance_risk: null
      payload_endpoint_alignment: null
  input_contract:
    envelope_schema: GateInputEnvelope@2.0.0
    candidate_fields:
      target_gene:
        type: string
        description: Canonical target gene.
        required: true
      target_protein:
        type: string
        description: Canonical target protein.
        required: true
      indication:
        type: string
        description: Candidate-level indication retained for backward compatibility.
        required: true
      biological_hypothesis:
        type: string
        description: Immutable candidate hypothesis.
        required: true
    context_fields:
      target_opportunity:
        type: TargetOpportunityContext
        description: 'Version-bound v0.2 input object: target_opportunity.'
        required: true
        nullable: false
      adc_product_candidate:
        type: ADCProductContext
        description: 'Version-bound v0.2 input object: adc_product_candidate.'
        required: true
        nullable: false
      upstream_gate_results:
        type: map[gate_id,GateResult]
        description: 'Version-bound v0.2 input object: upstream_gate_results.'
        required: true
        nullable: false
  output_contract:
    envelope_schema: GateModelOutput@2.0.0
    common_contract_ref: components/contracts/model_output.v2.yaml
    domain_fields:
      payload_MOA:
        type: string_or_structured_object
        description: 'Frozen payload_cell_state_match@0.2.0 output field: payload_MOA.'
        required: true
        nullable: true
      target_state_sensitivity:
        type: number[0,1]
        description: 'Frozen payload_cell_state_match@0.2.0 output field: target_state_sensitivity.'
        required: true
        nullable: true
      cell_cycle_dependence:
        type: string_or_structured_object
        description: 'Frozen payload_cell_state_match@0.2.0 output field: cell_cycle_dependence.'
        required: true
        nullable: true
      slow_cycling_activity:
        type: number[0,1]
        description: 'Frozen payload_cell_state_match@0.2.0 output field: slow_cycling_activity.'
        required: true
        nullable: true
      apoptotic_competence_requirement:
        type: string_or_structured_object
        description: 'Frozen payload_cell_state_match@0.2.0 output field: apoptotic_competence_requirement.'
        required: true
        nullable: true
      DNA_repair_dependency:
        type: string_or_structured_object
        description: 'Frozen payload_cell_state_match@0.2.0 output field: DNA_repair_dependency.'
        required: true
        nullable: true
      efflux_susceptibility:
        type: string_or_structured_object
        description: 'Frozen payload_cell_state_match@0.2.0 output field: efflux_susceptibility.'
        required: true
        nullable: true
      SOC_cross_resistance:
        type: string_or_structured_object
        description: 'Frozen payload_cell_state_match@0.2.0 output field: SOC_cross_resistance.'
        required: true
        nullable: true
      payload_resistance_risk:
        type: number[0,1]
        description: 'Frozen payload_cell_state_match@0.2.0 output field: payload_resistance_risk.'
        required: true
        nullable: true
      payload_endpoint_alignment:
        type: number[0,1]
        description: 'Frozen payload_cell_state_match@0.2.0 output field: payload_endpoint_alignment.'
        required: true
        nullable: true
  variation_policy:
    frozen_across_profiles:
    - Gate responsibility
    - input object names
    - output field names and direction
    - hard-failure propagation semantics
    profiles_may_override:
    - indication vocabulary
    - biomarker vocabulary
    - evidence adapters
    - thresholds
    - selected Model version
