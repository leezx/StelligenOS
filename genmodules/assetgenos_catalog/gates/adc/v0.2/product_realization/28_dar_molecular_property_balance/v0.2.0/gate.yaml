gate:
  gate_id: dar_molecular_property_balance
  gate_family: adc.v0_2.product_realization.dar_molecular_property_balance
  gate_version: 0.2.0
  sequence: 28
  name: DAR and Molecular Property Balance
  purpose: Optimize DAR and distribution against payload potency, hydrophobicity, linker properties, stability, aggregation,
    clearance, binding, density, and killing depth.
  runtime:
    required: true
    hard_gate: false
    applicable_modalities:
    - ADC
    required_inputs:
    - target_opportunity
    - adc_product_candidate
    - upstream_gate_results
    outputs:
    - target_DAR
    - DAR_distribution
    - effective_payload_load
    - hydrophobicity_burden
    - aggregation_risk
    - clearance_risk
    - binding_impact
    - stability_impact
    - DAR_robustness_window
    pass_rule: score >= 0.65 with adequate evidence and no propagated hard failure
    fail_rule: score < 0.30 with direct or high-confidence evidence
    uncertainty_rule: missing, inferred, stale, or non-version-bound evidence keeps the Gate in exploration mode
    cost_tier: medium_high
    default_model_ids:
    - dar_molecular_property_balance_llm_v0_2
    thresholds:
      pass: 0.65
      fail: 0.3
    missing_data_policy: exploration_only
    gate_group: product_realization
    group_code: P
    priority: P2
    dependencies:
    - product_design_objective
    - conjugation_platform_site
    output_defaults:
      target_DAR: null
      DAR_distribution: null
      effective_payload_load: null
      hydrophobicity_burden: null
      aggregation_risk: null
      clearance_risk: null
      binding_impact: null
      stability_impact: null
      DAR_robustness_window: null
  input_contract:
    envelope_schema: GateInputEnvelope@2.0.0
    candidate_fields:
      target_gene:
        type: string
        description: Canonical target gene.
        required: true
      target_protein:
        type: string
        description: Canonical target protein.
        required: true
      indication:
        type: string
        description: Candidate-level indication retained for backward compatibility.
        required: true
      biological_hypothesis:
        type: string
        description: Immutable candidate hypothesis.
        required: true
    context_fields:
      target_opportunity:
        type: TargetOpportunityContext
        description: 'Version-bound v0.2 input object: target_opportunity.'
        required: true
        nullable: false
      adc_product_candidate:
        type: ADCProductContext
        description: 'Version-bound v0.2 input object: adc_product_candidate.'
        required: true
        nullable: false
      upstream_gate_results:
        type: map[gate_id,GateResult]
        description: 'Version-bound v0.2 input object: upstream_gate_results.'
        required: true
        nullable: false
  output_contract:
    envelope_schema: GateModelOutput@2.0.0
    common_contract_ref: components/contracts/model_output.v2.yaml
    domain_fields:
      target_DAR:
        type: string_or_structured_object
        description: 'Frozen dar_molecular_property_balance@0.2.0 output field: target_DAR.'
        required: true
        nullable: true
      DAR_distribution:
        type: string_or_structured_object
        description: 'Frozen dar_molecular_property_balance@0.2.0 output field: DAR_distribution.'
        required: true
        nullable: true
      effective_payload_load:
        type: number[0,1]
        description: 'Frozen dar_molecular_property_balance@0.2.0 output field: effective_payload_load.'
        required: true
        nullable: true
      hydrophobicity_burden:
        type: number[0,1]
        description: 'Frozen dar_molecular_property_balance@0.2.0 output field: hydrophobicity_burden.'
        required: true
        nullable: true
      aggregation_risk:
        type: number[0,1]
        description: 'Frozen dar_molecular_property_balance@0.2.0 output field: aggregation_risk.'
        required: true
        nullable: true
      clearance_risk:
        type: number[0,1]
        description: 'Frozen dar_molecular_property_balance@0.2.0 output field: clearance_risk.'
        required: true
        nullable: true
      binding_impact:
        type: string_or_structured_object
        description: 'Frozen dar_molecular_property_balance@0.2.0 output field: binding_impact.'
        required: true
        nullable: true
      stability_impact:
        type: number[0,1]
        description: 'Frozen dar_molecular_property_balance@0.2.0 output field: stability_impact.'
        required: true
        nullable: true
      DAR_robustness_window:
        type: string_or_structured_object
        description: 'Frozen dar_molecular_property_balance@0.2.0 output field: DAR_robustness_window.'
        required: true
        nullable: true
  variation_policy:
    frozen_across_profiles:
    - Gate responsibility
    - input object names
    - output field names and direction
    - hard-failure propagation semantics
    profiles_may_override:
    - indication vocabulary
    - biomarker vocabulary
    - evidence adapters
    - thresholds
    - selected Model version
