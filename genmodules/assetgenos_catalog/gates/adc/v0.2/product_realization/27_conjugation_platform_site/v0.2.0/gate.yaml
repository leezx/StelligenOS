gate:
  gate_id: conjugation_platform_site
  gate_family: adc.v0_2.product_realization.conjugation_platform_site
  gate_version: 0.2.0
  sequence: 27
  name: Conjugation Platform and Site Selection
  purpose: Select a controllable conjugation method and site that preserves antibody function, stability, homogeneity, manufacturability,
    scale-up, and platform access.
  runtime:
    required: true
    hard_gate: true
    applicable_modalities:
    - ADC
    required_inputs:
    - target_opportunity
    - adc_product_candidate
    - upstream_gate_results
    outputs:
    - conjugation_method
    - conjugation_site
    - site_occupancy
    - product_homogeneity
    - positional_stability
    - antibody_function_preservation
    - manufacturing_robustness
    - scale_up_feasibility
    - platform_IP_risk
    pass_rule: score >= 0.65 with adequate evidence and no propagated hard failure
    fail_rule: score < 0.30 with direct or high-confidence evidence
    uncertainty_rule: missing, inferred, stale, or non-version-bound evidence keeps the Gate in exploration mode
    cost_tier: medium_high
    default_model_ids:
    - conjugation_platform_site_llm_v0_2
    thresholds:
      pass: 0.65
      fail: 0.3
    missing_data_policy: exploration_only
    gate_group: product_realization
    group_code: P
    priority: P2
    dependencies:
    - antibody_sequence_developability
    output_defaults:
      conjugation_method: null
      conjugation_site: null
      site_occupancy: null
      product_homogeneity: null
      positional_stability: null
      antibody_function_preservation: null
      manufacturing_robustness: null
      scale_up_feasibility: null
      platform_IP_risk: null
  input_contract:
    envelope_schema: GateInputEnvelope@2.0.0
    candidate_fields:
      target_gene:
        type: string
        description: Canonical target gene.
        required: true
      target_protein:
        type: string
        description: Canonical target protein.
        required: true
      indication:
        type: string
        description: Candidate-level indication retained for backward compatibility.
        required: true
      biological_hypothesis:
        type: string
        description: Immutable candidate hypothesis.
        required: true
    context_fields:
      target_opportunity:
        type: TargetOpportunityContext
        description: 'Version-bound v0.2 input object: target_opportunity.'
        required: true
        nullable: false
      adc_product_candidate:
        type: ADCProductContext
        description: 'Version-bound v0.2 input object: adc_product_candidate.'
        required: true
        nullable: false
      upstream_gate_results:
        type: map[gate_id,GateResult]
        description: 'Version-bound v0.2 input object: upstream_gate_results.'
        required: true
        nullable: false
  output_contract:
    envelope_schema: GateModelOutput@2.0.0
    common_contract_ref: components/contracts/model_output.v2.yaml
    domain_fields:
      conjugation_method:
        type: string_or_structured_object
        description: 'Frozen conjugation_platform_site@0.2.0 output field: conjugation_method.'
        required: true
        nullable: true
      conjugation_site:
        type: string_or_structured_object
        description: 'Frozen conjugation_platform_site@0.2.0 output field: conjugation_site.'
        required: true
        nullable: true
      site_occupancy:
        type: number[0,1]
        description: 'Frozen conjugation_platform_site@0.2.0 output field: site_occupancy.'
        required: true
        nullable: true
      product_homogeneity:
        type: number[0,1]
        description: 'Frozen conjugation_platform_site@0.2.0 output field: product_homogeneity.'
        required: true
        nullable: true
      positional_stability:
        type: number[0,1]
        description: 'Frozen conjugation_platform_site@0.2.0 output field: positional_stability.'
        required: true
        nullable: true
      antibody_function_preservation:
        type: string_or_structured_object
        description: 'Frozen conjugation_platform_site@0.2.0 output field: antibody_function_preservation.'
        required: true
        nullable: true
      manufacturing_robustness:
        type: string_or_structured_object
        description: 'Frozen conjugation_platform_site@0.2.0 output field: manufacturing_robustness.'
        required: true
        nullable: true
      scale_up_feasibility:
        type: number[0,1]
        description: 'Frozen conjugation_platform_site@0.2.0 output field: scale_up_feasibility.'
        required: true
        nullable: true
      platform_IP_risk:
        type: number[0,1]
        description: 'Frozen conjugation_platform_site@0.2.0 output field: platform_IP_risk.'
        required: true
        nullable: true
  variation_policy:
    frozen_across_profiles:
    - Gate responsibility
    - input object names
    - output field names and direction
    - hard-failure propagation semantics
    profiles_may_override:
    - indication vocabulary
    - biomarker vocabulary
    - evidence adapters
    - thresholds
    - selected Model version
