contract:
  contract_id: model_work_package
  contract_version: "1.0.0"
  standard_ref: ModelAuthoringIsolationStandard@1.0.0
  lifecycle_standard_ref: ModelLifecycleStandard@1.0.0
  description: >-
    Exclusive single-Model authoring package used to keep concurrent agent
    writes disjoint and defer all shared-file mutations to one serial
    integration owner.
  identity:
    required_fields:
      - package_id
      - gate_id
      - model_id
      - model_version
      - owner
      - state
      - created_at_utc
  allowed_states:
    - initialized
    - authoring
    - ready_for_integration
    - integrated
    - rejected
  authoring:
    single_writer: true
    default_write_root: model_work_packages/<gate_id>/<model_id>/v<model_version>
    optional_external_write_roots: exact_package_declared_exclusive_dataset_roots
    shared_inputs_are_read_only: true
    symlink_escape_forbidden: true
    repository_worklog_write_forbidden: true
  required_package_files:
    all_states:
      - package.yaml
      - WORKLOG.md
      - integration/manifest.yaml
      - verification/results.yaml
    ready_for_integration:
      - candidate/model.yaml
      - candidate/release_candidate.yaml
  integration_manifest:
    required_fields:
      - package_ref
      - copy_files
      - merge_requests
    copy_file_required_fields:
      - source
      - destination
    merge_request_required_fields:
      - target
      - request_file
      - summary
      - verification
    duplicate_copy_destination_policy: reject_batch
    shared_target_policy: integration_owner_only
  package_log_required_topics:
    - purpose
    - implementation
    - evidence_and_data_versions
    - assumptions_and_limitations
    - verification
    - integration_requests
    - unresolved_issues
  ready_requirements:
    - candidate_model_exists
    - release_candidate_exists
    - integration_manifest_valid
    - package_log_complete
    - package_verification_passed
    - author_stopped_writing
  integration:
    mode: serial_single_writer
    final_release_created_only_after_final_artifact_hash: true
    required_full_checks:
      - model_governance_audit
      - gate_model_contract_validation
      - full_test_suite
      - doctor
      - package_requested_data_or_scientific_audits
    required_outputs:
      - integration_batch_record
      - consolidated_repository_worklog_entry
      - package_integration_receipt
  forbidden_parallel_shared_targets:
    - AGENTS.md
    - CLAUDE.md
    - README.md
    - WORKLOG.md
    - ../HANDOFF.md
    - ../DATA/dataset.index.md
    - components/gates/**
    - components/models/**
    - components/model_governance/**
    - components/profiles/**
    - components/contracts/**
    - configs/pipeline.yaml
    - configs/v0.2_graph.yaml
    - configs/v0.2_gate_groups.yaml
    - scripts/generate_v0_2_components.py
    - src/adc_factory/models.py
    - src/adc_factory/v2_pipeline.py
    - src/adc_factory/config.py
    - src/adc_factory/cli.py
    - tests/test_core.py
    - tests/test_v2.py
    - tests/conftest.py
    - tests/fixtures/**
