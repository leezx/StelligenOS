# Independent verification of every gate the governance protocol already requires
# locally. Until this workflow existed, test counts and boundary results in
# handoffs and review records were local evidence only, which reviewers of PRs
# #15 through #48 repeatedly noted as a residual risk.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared floor: src/lifecycle/state_machine.py uses
        # enum.StrEnum. Running it makes the floor enforced, not just claimed.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install ripgrep
        # tests/test_git_sync.sh uses `rg`. Installed explicitly rather than
        # assumed present on the runner image.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep

      - name: Unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s tests -p 'test_*.py'

      - name: git_sync behaviour tests
        run: bash tests/test_git_sync.sh

      # The three checks below run *after* the test steps on purpose: they are
      # meaningful only once the suite has had the chance to leave artifacts
      # behind. A data-free repository must come out of a full test run byte for
      # byte as it went in.
      - name: Repository boundary
        run: bash scripts/verify_repository_boundary.sh

      - name: No bytecode artifacts left behind
        run: |
          found="$(find . -name __pycache__ -not -path './.git/*' | wc -l | tr -d ' ')"
          if [ "$found" -ne 0 ]; then
            find . -name __pycache__ -not -path './.git/*'
            echo "the test run left __pycache__ directories behind" >&2
            exit 1
          fi

      - name: Working tree unchanged by the test run
        run: |
          git diff --check
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "the test run modified the repository" >&2
            exit 1
          fi
