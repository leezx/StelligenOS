module:
  module_id: MOD-TGT03
  module_name: tgt03_treatment_metastatic_persistence
  module_version: "1.0.0"
  built_in: runtime_migration_pr_e10
  construction_contract: src/contracts/gate_modules/tgt03_treatment_metastatic_persistence.yaml
  construction_drawing: docs/gate_modules/TGT-03_Treatment_Metastatic_Persistence.md

  gate_binding:
    gate_id: TGT-03
    gate_version: "1.0"
    gateset_id: ADC_TARGET_GATESET
    gateset_version: "1.0"
    instantiation_id: INST-CRC-REFRACTORY-ADC-TARGET-v1
    candidate_level: L04
    # frozen PR D / gateset regime for TGT-03; the current instantiation runs the
    # public path only.
    dominant_evidence_regime: PUBLIC_HYBRID
    current_instantiation_regime: PUBLIC_ONLY

  the_one_question: >-
    Does target expression persist in the actual clinical setting: refractory /
    prior-treated and/or metastatic CRC (including colorectal liver metastases)?
    (verbatim gate_question inherited from the PR D TGT-03 contract; a
    BIDIRECTIONAL scientific persistence gate whose NEGATIVE -- materially
    impaired persistence -- is a genuine scientific finding, NOT a fatal flag and
    NOT a KILL; not widened or narrowed)

  purpose: >-
    Deterministic Gate-specific scientific core for TGT-03. It turns normalized
    upstream clinical-persistence facts (refractory / prior-treated protein,
    metastatic-lesion protein, paired pre-/post-treatment protein, treated /
    metastatic transcript, validated CRC treatment-resistance model,
    treatment-naive primary CRC, different-tumor-type, audited search-completion
    records) into atomic Gate-neutral EvidencePackages, maps each to a frozen
    TGT-03 Evidence-Ladder rung (DIRECT only for a clinical-context protein
    observation with protein_measurement_validation_status == QUALIFIED + a
    QUALIFIED context adequacy status + malignant-cell attribution and a
    clinical_context matching the observation kind -- assay_method is an OPEN
    factual type, there is no closed assay whitelist; INDIRECT_STRONG for a
    treated / metastatic transcript or a well-validated CRC resistance model,
    even when it measures protein; WEAK for treatment-naive primary CRC or a
    different tumor type) and a Module-owned Gate-relative persistence-implication
    reading (SUPPORTS_PERSISTENCE / OPPOSES_PERSISTENCE / CONTEXTUAL). The
    TRANSIENT_OR_MINOR_DOWNREGULATION SUPPORTING-vs-CONTEXTUAL branch is decided
    ONLY by the typed residual_target_presence_status field, never by free-text
    parsing. It tracks ONE typed completion state
    (ClinicalPersistenceCompletion) with three HARD invariants (completeness
    consistency; mandatory SEARCH_COMPLETION_AUDIT presence + snapshot parity on
    the persistence_context_id namespace; qualifying persistence-context-set
    parity), aggregates a proposed Direction x Strength strictly per the frozen
    E9 truth table (overall Strength is the HIGHEST qualifying evidence class --
    NO E6-style two-axis rule; the four mandatory search components are
    search-space completeness, not a four-axis score; NEGATIVE is reachable; a
    genuinely incompatible retained-vs-loss landscape is CONFLICTING unless an
    explicit typed multi-context MIXED_OR_UNRESOLVED characterisation resolves it
    to a GRADED INCONCLUSIVE; a WEAK-only public landscape is INCONCLUSIVE /
    UNKNOWN, never INCONCLUSIVE / WEAK; a single paired biopsy series, metastatic
    cohort or loss observation is never a completed population-level answer),
    emits a machine-local fatal_review review TRIGGER when eligible DIRECT-class
    protein NEAR_LOSS_OR_MARKED_LOSS observations satisfy Route A (an auditable
    explicit reproducibility qualification) OR Route B (>= 2 independent
    qualified persistence-context identities) on a completed audited landscape,
    and emits a non-canonical assessment proposal envelope for the human review
    surface.

  owns:
    - input contract validation (no implicit default scientific context; the candidate's target_identity is the single authoritative target; the canonical Instantiation context_id CTX-CRC-REFRACTORY-MCRC + context_version 1 are HARD-pinned and are a SEPARATE namespace from each observation's LOCAL persistence_context_id; landscape_as_of is mandatory)
    - candidate <-> observation target-identity binding (an observation whose target_identity differs from the candidate's canonical target is evidence misbinding and is a HARD rejection)
    - the eight observation kinds (REFRACTORY_OR_PRIOR_TREATED_PROTEIN / METASTATIC_LESION_PROTEIN / PAIRED_PRE_POST_PROTEIN / TREATED_METASTATIC_TRANSCRIPT / RESISTANCE_MODEL / TREATMENT_NAIVE_PRIMARY / DIFFERENT_TUMOR_TYPE / SEARCH_COMPLETION_AUDIT); the provider supplies NORMALIZED UPSTREAM FACTS only -- including the persistence_pattern / residual_target_presence_status / protein_measurement_validation_status / context_adequacy_status / reproducibility_status qualifications -- and never sets a rung, a direction, or a persistence implication; there is NO normalizer inside this package
    - frozen TGT-03 Evidence-Ladder rung mapping and the deterministic Gate-relative persistence-implication reading; transcript / a resistance model never reaches DIRECT; a protein observation without protein_measurement_validation_status == QUALIFIED never reaches DIRECT; protein without malignant-cell attribution never reaches DIRECT; treatment-naive primary CRC / a different tumor type is CONTEXTUAL WEAK and never a persistence claim or a TGT-02 baseline-coverage substitution
    - Gate-NEUTRAL EvidencePackage construction (PR A evidence_package shape); one package per observation; a package never carries "passes TGT-03", "persistence established", "meaningful target availability is lost", "should be killed", or a TGT-02 / TGT-04 conclusion; an observation already in the Evidence Library is reused as its EXACT canonical package (no allocator call, no new body); provenance comes from the resolved canonical SourceIndex record; the TGT-03-specific dedup deviation preserves distinct LOCAL persistence-context observations that share a (source_id, claim) and never drops a SEARCH_COMPLETION_AUDIT EP
    - "hard identity / provenance / completion-consistency / classification-qualification integrity gate: a candidate<->target misbinding, a context_key / search_scope drift from the run, a claimed-resolved source missing from the canonical SourceIndex, a canonical-source metadata conflict, an incompatible canonical EvidencePackage, a completion whose umbrella flag contradicts its component searches, an attempted completion with no / more than one / a drifted SEARCH_COMPLETION_AUDIT observation, a dedup-lost audit EP, a completion whose qualifying persistence-context-id sets disagree with the emitted qualifying evidence, or a duplicate observation_id rejects the WHOLE run -- it is never degraded to an accepted UNKNOWN"
    - one module-local typed ClinicalPersistenceCompletion (a run record, NOT a seventh core object); the mandatory public clinical-persistence landscape is complete only when the umbrella flag AND all four declared component searches (refractory / prior-treated, metastatic lesion, paired pre-/post, resistance model) are complete AND certified by exactly one snapshot-consistent SEARCH_COMPLETION_AUDIT observation; the four components are flat booleans, search-space completeness, not a four-axis score; a component searched / exhausted with zero qualifying records still counts complete; an incomplete landscape is INCONCLUSIVE / UNKNOWN and is NOT an integrity failure
    - deterministic Direction x Strength aggregation per the frozen E9 truth table; the overall Strength is the highest qualifying frozen evidence class (there is NO E6-style two-axis weaker-ceiling rule); a graded Direction is produced only over a completed audited landscape; NEGATIVE weighs the science against retained persistence and is never a fatal flag / KILL / reproducible fatal pattern on its own
    - "machine-local fatal_review review TRIGGER (E9 item 08 / 12): required iff eligible DIRECT-class protein NEAR_LOSS_OR_MARKED_LOSS observations (evidence_rung DIRECT + persistence_implication OPPOSES_PERSISTENCE + persistence_pattern NEAR_LOSS_OR_MARKED_LOSS) meet Route A (reproducibility_status == QUALIFIED + a non-empty auditable reproducibility_basis; the basis text is NEVER parsed) OR Route B (>= 2 independent qualified persistence-context identities; NOT '> 2' and NOT '>= 3'), on a completed audited landscape; status is at most POTENTIAL_FATAL_PATTERN; NO numeric / percent-positive / H-score / fold-change / context-count threshold; the machine NEVER emits PUBLIC_FATAL_SIGNAL_ESTABLISHED / a canonical fatal flag / KILL / HOLD / Decision, and NEVER decides whether the pattern is a real fatal signal; only an accepted run's trigger is an actionable handoff"
    - machine acceptance record (E9 item 13) as executable checks
    - non-canonical assessment proposal envelope (E9 item 12); the TGT-03 ceiling / inference / direction live here, never on the Gate-neutral package; the envelope carries the canonical Instantiation identity pins (incl. context_id CTX-CRC-REFRACTORY-MCRC) and no assessment_id / assessment_version / review, no TGT-02 / TGT-04 conclusion, and no fatal flag

  does_not_own:
    - live GEO / HPA / CPTAC / single-cell / spatial / TMA / paired-biopsy / resistance-model repository retrieval; extractors; normalizers; a runner; a dry-run executor
    - external retrieval / extraction / normalization and the upstream persistence_pattern / residual_target_presence_status / protein_measurement_validation_status / context_adequacy_status / reproducibility_status qualifications and the final critical-unknown resolution kind assignment by the provider (the provider supplies facts; the module does the deterministic mapping)
    - entity resolution, source registry, provenance ledger, serialization (shared infra, v5 section 6.5)
    - database, cache, RUNS / ASSESSMENTS / EvidenceIndex persistence
    - whether a clinical context is genuinely a qualified refractory / prior-treated / metastatic context, whether the malignant-cell attribution is convincing, whether the paired / pre-post relation is valid, whether the persistence-context identities are genuinely independent, whether a "marked / near loss" qualification is justified vs a transient / minor effect, whether an apparent loss is an assay / platform artifact, whether a reported reproducibility is scientifically convincing, whether meaningful target availability is actually lost, and whether the reproducible-loss pattern satisfies the GateSet fatal policy
    - a TGT-02 baseline malignant-cell coverage substitution, a TGT-04 surface / density / localization / internalization conclusion, and letting generic EVGAP-02 / CRC linkage discharge TGT-03
    - human approval and canonical CandidateGateAssessment construction
    - Candidate-level Decision / KILL / HOLD, PUBLIC_FATAL_SIGNAL_ESTABLISHED, MatrixView writes, cross-Gate reasoning
    - any numeric or ranking score, and any fold-change / percent-positive / H-score / down-regulation / context-count cutoff

  ports:
    - name: Tgt03PersistenceProviderPort
      role: supplies already-normalized, primary/repository-source-resolved TGT-03 clinical-persistence observations (each with observation_kind, molecular_layer, an OPEN assay_method fact, a CLOSED protein_measurement_validation_status predicate + basis, clinical_context + basis, context_adequacy_status + basis, malignant_cell_attribution + basis, persistence_pattern + basis, residual_target_presence_status + basis, reproducibility_status + basis, LOCAL persistence_context_id(s) and facts only) plus the one typed completion contract (ClinicalPersistenceCompletion)
    - name: EvidenceIdAllocatorPort
      role: allocates EP-nnnnnnnn ids for observations not already in the Evidence Library; the Module never derives ids from the filesystem
    - name: SourceResolverPort
      role: resolves a provenance.source_id to its canonical SourceIndex record; an unresolved id or a provider observation whose metadata disagrees with the canonical record is a HARD rejection
    - name: ExistingEvidenceLibraryPort
      role: read-only lookup by observation_id into the PR C reusable Evidence Library; returns the EXACT canonical EvidencePackage, reused unchanged (no allocator call, no re-created body); an incompatible returned package (missing OR drifted classification-driving field, or a drifted audit snapshot) is a hard integrity failure

  boundary_flags:
    performs_network_io: false
    spawns_subprocess: false
    writes_repository: false
    allocates_ids_from_filesystem: false
    constructs_canonical_assessment: false
    produces_decision_or_kill: false
    emits_public_fatal_signal_established: false
    baseline_coverage_substitution_or_surface_density_logic: false
    scientific_de_risking_of_other_gates: false
    ontology_or_embedding_inference: false
    numeric_or_ranking_scoring: false
    fold_change_percent_positive_hscore_or_context_count_threshold: false
    grades_a_direction_before_the_landscape_is_complete: false
    parses_qualification_basis_free_text: false
    normalizer_inside_the_package: false
    modifies_frozen_gate_science: false
    modifies_mod_tgt01_mod_tgt02_mod_tgt05_or_mod_tgt08: false
    lifts_migration_pending: false
