module:
  module_id: MOD-TGT01
  module_name: tgt01_adc_modality_precedent
  module_version: "1.0.0"
  built_in: runtime_migration_pr_e2
  construction_contract: src/contracts/gate_modules/tgt01_adc_modality_precedent.yaml
  construction_drawing: docs/gate_modules/TGT-01_ADC_Modality_Precedent.md

  gate_binding:
    gate_id: TGT-01
    gate_version: "1.0"
    gateset_id: ADC_TARGET_GATESET
    gateset_version: "1.0"
    instantiation_id: INST-CRC-REFRACTORY-ADC-TARGET-v1
    candidate_level: L04
    dominant_evidence_regime: PUBLIC_PRIMARY

  the_one_question: >-
    Has this target already been reality-tested by the ADC modality?
    (verbatim gate_question inherited from the PR D TGT-01 contract; not widened
    or narrowed)

  purpose: >-
    Deterministic Gate-specific scientific core for TGT-01. It turns normalized
    same-target / adjacent-target ADC precedent records into atomic
    EvidencePackages, detects the frozen item-08 target-attributable failure
    pattern, aggregates a proposed Direction x Strength strictly per the frozen
    TGT-01 Evidence Ladder (no numeric score), enforces the item-16 stop-rule
    completion prerequisites, and emits a non-canonical assessment proposal
    envelope for the human review surface.

  owns:
    - input contract validation (no implicit default scientific context; the candidate's target_identity is the single authoritative target)
    - candidate <-> program target-identity binding (a SAME_TARGET record whose program targets a different antigen is evidence misbinding and is rejected; an ADJACENT_TARGET record carries an auditable adjacency_basis)
    - normalized precedent record admissibility + frozen ladder-rung classification
    - Gate-NEUTRAL EvidencePackage construction (PR A evidence_package shape); one package per observation; an observation already in the Evidence Library is reused as its EXACT canonical package (no allocator call, no new body); provenance comes from the resolved canonical SourceIndex record
    - "hard identity / provenance integrity gate: a candidate<->program antigen misbinding, a claimed-resolved source missing from the canonical SourceIndex, a canonical-source metadata conflict, or an incompatible canonical EvidencePackage rejects the WHOLE run (E1 item 13 on_failure) -- it never degrades to an accepted UNKNOWN"
    - "target-attributable failure-pattern detection (frozen item 08, BOTH branches -- target-mediated toxicity AND intrinsically unachievable therapeutic window; a pattern needs >= 2 independent same-target programs failing for the SAME frozen class)"
    - deterministic Direction x Strength aggregation (E1 semantics; Strength orthogonal to Direction; no fourth ladder)
    - machine acceptance record (E1 item 13) + stop-rule completion prerequisites (E1 item 16)
    - non-canonical assessment proposal envelope (E1 item 12); the TGT-01 ceiling / inference / direction live here, never on the Gate-neutral package

  does_not_own:
    - web / literature / trial / patent retrieval
    - entity resolution, source registry, provenance ledger, serialization (shared infra, v5 section 6.5)
    - any source-specific live provider (PubMed / ClinicalTrials.gov / FDA / patent / ADCdb adapters)
    - database, cache, RUNS / ASSESSMENTS / EvidenceIndex persistence
    - human approval and canonical CandidateGateAssessment construction
    - Candidate-level Decision / KILL, MatrixView writes, cross-Gate reasoning

  ports:
    - name: Tgt01PrecedentProviderPort
      role: supplies already-normalized, primary-source-resolved precedent observations (each with observation_id, program_target_identity, adjacency_basis) plus the two completion flags (same_target_program_inventory_complete, failure_reason_sweep_complete)
    - name: EvidenceIdAllocatorPort
      role: allocates EP-nnnnnnnn ids for observations not already in the Evidence Library; the Module never derives ids from the filesystem
    - name: SourceResolverPort
      role: resolves a provenance.source_id to its canonical SourceIndex record; an unresolved id (incl. an ADCdb-only lead) cannot establish a ladder rung, and a provider record whose metadata disagrees with the canonical record is rejected
    - name: ExistingEvidenceLibraryPort
      role: read-only lookup by observation_id into the PR C reusable Evidence Library; returns the EXACT canonical EvidencePackage, which is reused unchanged (no allocator call, no re-created body); an incompatible returned package is a hard integrity failure

  boundary_flags:
    performs_network_io: false
    spawns_subprocess: false
    writes_repository: false
    allocates_ids_from_filesystem: false
    constructs_canonical_assessment: false
    produces_decision_or_kill: false
    numeric_scoring: false
    modifies_frozen_gate_science: false
    lifts_migration_pending: false
