extension:
  extension_id: EXT-04
  extension_name: stop_rule
  extension_version: 0.1.0
  extension_type: KernelExtension
  status: active_design
  priority: highest

  source:
    document: prompts/GPT-Feedback.md
    section: "v4"
    risk_id: "一级风险四"
    risk_title: "没有定义 Stop Rule"

  purpose: >
    为每个 Gate 定义 Evidence Sufficiency Contract，回答「证据到什么程度算够、
    什么时候必须停止继续收集」。没有这条规则，所有 Gate 都会无限优化，
    资产永远无法产出。

  kernel_contact_surface:
    reads:
      - GateInputEnvelope@2.0.0
      - GateModelOutput@2.0.0
      - genmodules/assetgenos_catalog/gates/**/gate.yaml
    modifies: []
    note: >
      本扩展只读取内核 Gate 身份和输出语义，不修改任何 gate.yaml、
      阈值、Profile 绑定或 45-Gate 拓扑。

  prohibited:
    - 不得自动改写 Gate score、status、threshold 或 Profile 绑定。
    - 不得把 unknown、null 或缺失信息转换为 0、negative 或 FAIL。
    - 不得把「达到搜索上限」转换为 FAIL；只能转换为需要人类决策的阻断状态。
    - 不得把「反对证据充分」转换为 FAIL；充分性只表示可以做判断，方向由 Gate 决定。
    - 不得在未经专家校准的情况下产出 actionable 裁决。
    - 不得把专家校准当成治理批准；两者是独立的门，都必须打开。
    - 在本扩展 status 提升为 governed 之前，不得产出任何 actionable 裁决。
    - 不得替代人类专家签字，也不得自动推动生命周期晋级。
    - 不得在仓库内保存证据、结果或计数数据；只接受 external 引用和聚合计数。

  sufficiency_semantics:
    direction_neutral: true
    rule: max(independent_supporting, independent_opposing) >= min_independent_evidence
    note: >
      两个方向不相加；取较强的一方。裁决不携带方向，也不携带 pass/fail 信号。
    actionability_rule: >
      actionable = (verdict == SUFFICIENT) AND (calibration_status == expert_calibrated)
      AND (governance_status == governed) AND (EXTENSION_STATUS == governed)。
      三道门互不替代：充分性由求值给出，校准由领域专家给出，治理由独立 PR 与
      ChatGPT APPROVE 给出。未校准或未治理的契约仍可报告 SUFFICIENT，
      但 actionable 恒为 false。
    current_actionability: >
      本扩展 status 为 active_design，因此当前任何裁决的 actionable 必然为 false，
      即使合同已校准且已治理。这是 extensions/README.md 中
      「active_design 尚未接入任何真实运行」的强制实现。
    governance_reference_rule: >
      governance_status 为 governed 时必须提供 external: governance_approval_ref；
      未治理时该字段必须为空。
    status_mirror: >
      contracts.py 的 EXTENSION_STATUS 镜像本文件的 status，
      提升必须同步进行，由 tests/test_stop_rule_extension.py 断言不漂移。

  execution_policy: advisory_only

  calibration_status: proposed_baseline_requires_expert_calibration

  known_limitations:
    - >
      本扩展依赖「独立证据数」这个判据，而当前 evidence independence 定义
      不够严格（见 extensions/BACKLOG.zh-CN.md BL-01）。在 BL-01 解决之前，
      min_independent_evidence 可能被重复来源虚增，且该偏差对支持与反对
      两个方向同时存在。
    - >
      三个 gate group 的 baseline 阈值来自外部专家反馈的建议值，
      不是经过校准的科学阈值，激活前必须逐 Gate 复核。

  activation_requirements:
    - 逐 Gate 实例化 EvidenceSufficiencyContract 并由领域专家复核阈值。
    - 解决 BL-01 evidence independence，或明确接受其偏差。
    - 独立任务分支、独立 PR 和 ChatGPT APPROVE。
