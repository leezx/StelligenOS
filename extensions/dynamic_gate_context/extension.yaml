extension:
  extension_id: EXT-02
  extension_name: dynamic_gate_context
  extension_version: 0.1.0
  extension_type: KernelExtension
  status: partially_absorbed
  priority: medium

  source:
    document: prompts/GPT-Feedback.md
    section: "v4"
    risk_id: "一级风险二"
    risk_title: "Gate 是静态的，而 Biology 是动态的"

  purpose: >
    让被评分的对象从 Target 变成 Target x Clinical Context。同一个 target
    在不同 indication、疾病阶段、治疗线、biomarker 状态和联合用药背景下
    含义完全不同（HER2 在乳腺癌、CRC 和 HER2-low 是三件事），
    因此 Gate 结果必须按 context 限定的身份存放，不能按 target 折叠。

  absorbed_by_kernel:
    absorbed_in: "v5 clinical hypothesis architecture (PR #45, merged as a5bf77f)"
    what_was_absorbed: >
      本扩展的核心论点已由内核实现，且是改在内核里而非适配器里。v5 把早期研发单元
      从 target-indication-endpoint 三元组改为
      Target x Anchor Clinical Context x Intended Benefit/Product Hypothesis，
      新增 ClinicalHypothesis、AnchorClinicalContext、IntendedBenefitHypothesis、
      BiomarkerHypothesis、ProductHypothesis，并让 Gate 输入携带
      clinical_hypothesis_ref 与递进 lock state。
    consequence: >
      本扩展原本的 design_constraint「以适配器方式实现，不改内核」已经不再是事实描述。
      status 因此从 shell_only 改为 partially_absorbed：核心概念已进内核，
      剩余范围见 remaining_scope，历史论证保留在 README.md 供追溯。
    note: >
      本次只更新扩展元数据与说明文档。未修改本扩展 contracts.py，
      也未修改内核任何内容。

  remaining_scope:
    - id: RS-01
      item: 五个 context 轴的取值域
      detail: >
        v5 提供了 AnchorClinicalContext，但 indication、disease_stage、
        line_of_therapy、biomarker_status、combination_setting 五个轴各自是
        自由文本、受控词表还是外部本体引用，仍未定。
    - id: RS-02
      item: 逐 Gate 的跨 context 复用策略
      detail: >
        contracts.py 的 GateContextBinding 默认 undecided，45 个 Gate 中
        哪些结果可跨 context 复用仍需领域专家逐个标注。这部分 v5 完全没有覆盖。
    - id: RS-03
      item: context 变化时既有 Gate 结果的失效规则
      detail: >
        既不自动继承也不自动重置这条约束仍然成立且仍未实现。
        v5 引入了 lock state，但 lock state 表达的是承诺程度，不是 context 失效。
    - id: RS-04
      item: context 粒度
      detail: >
        「三线 CRC」与「三线 MSS CRC」是同一个 context 还是两个，仍未定。
    - id: RS-05
      item: 既有 CRC 试运行结果的映射
      detail: >
        已产出的 9 indication / 36 endpoint / 41 target 如何映射到
        v5 的 ClinicalHypothesis 身份，仍未定。

  design_constraint: >
    剩余范围仍以适配器方式实现，不再改内核。45-Gate 拓扑、gate.yaml、
    GateInputEnvelope@2.0.0 和 GateModelOutput@2.0.0 全部保持不变；
    本扩展只提供 context 限定的复合身份与逐 Gate 复用标注。

  kernel_contact_surface:
    reads:
      - GateInputEnvelope@2.0.0
      - src/objects/core.py
      - genmodules/gen_indication_endpoint_target/contracts.py
    modifies: []

  prohibited:
    - 不得修改 45-Gate 拓扑、gate_id、gate.yaml 或 envelope schema。
    - 不得新增顶层生命周期阶段。
    - 不得把不同 clinical context 下的 Gate 结果合并或相互继承。
    - 不得让 context 的改变自动重置或自动继承既有 Gate 结论。

  execution_policy: disabled

  future_direction: >
    专家建议最终把 Gate 输入抽象成 ClinicalOpportunity 而不是 Target，
    这样 ADC、TCE、Radioligand 可以统一。v5 的 ClinicalHypothesis 已经朝这个方向
    走了一步，但仍以 ADC 为唯一落地形态，尚未抽象到跨模态。
    跨模态统一仍是内核级变更，必须另立治理任务，不在本扩展范围内。

  activation_requirements:
    - RS-01 五个 context 轴的取值域由领域专家确认。
    - RS-02 45 个 Gate 的跨 context 复用策略逐个标注完成。
    - RS-03 明确 context 变化时既有 Gate 结果的失效规则。
    - 独立任务分支、独立 PR 和 ChatGPT APPROVE。
