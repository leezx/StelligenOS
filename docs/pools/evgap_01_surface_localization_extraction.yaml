# EVGAP-01：target surface localization 证据抽取绑定（machine-readable）
#
# 目的：解除 PR #58 登记的 EVGAP-01，使 Level 01 的 LOCK-01 可以真正产出
# eligible_surface_target。本文件不含任何证据数据，只含来源身份、字段白名单、
# 到 RQ 要求的映射、输出 schema 与验证规则。
#
# 由 tests/test_evgap_01_surface_localization.py 校验。
# LOCK-01 的 RQ-01/RQ-02/RQ-03 定义见 docs/pools/adc_pool_level_01_input_binding.yaml。

extraction:
  extraction_id: evgap_01_surface_localization
  extraction_version: 0.1.0
  discharges_gap: EVGAP-01
  gap_source: docs/pools/adc_pool_level_01_input_binding.yaml
  serves_lock: LOCK-01
  status: admission_bound_extraction_authorised
  execution_status: authorised_not_yet_executed
  # SRCADM-01 已于 PR #63 取得独立 APPROVE（记录见 source_admission_dependency
  # 的 admission_record_ref，由 PR #65 合入）。抽取阻断因此解除。
  # 授权范围是**一次**抽取，且仍不授权执行 Level 01。
  authorises_extraction_run: true
  authorises_extraction_run_count: 1
  authorises_level_01_execution: false
  extraction_blocked_by: []
  extraction_unblocked_by:
    - blocker: SRCADM-01
      cleared_by_pr: 63
      admission_record_ref: logs/chatgpt-review-2026-08-06-srcadm-01-admission-final.md
      merge_commit: 98a1698
  # 抽取完成并经结果 PR 接受后，需再开一个 PR 更新 Level 01 输入绑定以解除 EVGAP-01。
  requires_followup_binding_pr: true

# 依赖的数据库 snapshot。**本契约不批准它。**
#
# 该库是派生数据库，不是原始公开数据源。哈希与它自己的语义声明只能证明
# 「读到的就是这个版本」，不能证明该版本确实遵守它所声明的规则。
# 因此纳入已批准来源必须由独立的 source admission PR 完成，本契约只引用其结论。
source_admission_dependency:
  id: SRCADM-01
  source_id: adc_surfaceome_reference_v0_3_0
  dataset_id: ADC_surfaceome_reference
  dataset_version: 0.3.0
  snapshot_id: 2026-07-29-quant-topology-mm
  root: external:databases/ADC_surfaceome_reference/processed/v0.3.0
  is_derived_database: true
  previously_approved: false
  previously_approved_evidence: 仓库内 logs/chatgpt-review-*.md 无任何一条提及 surfaceome；worklog 仅有一次 2026-08-01 mock 运行提及。
  admission_status: admitted_with_conditions
  admission_record_ref: logs/chatgpt-review-2026-08-06-srcadm-01-admission-final.md
  admission_record_required: true
  # 记录文件名按 admission ID（SRCADM-01）命名，与 PR #59 originally 写下的
  # 按数据集命名的形态不同。**未重命名已合并且已获批的记录文件**，改为把形态
  # 对齐到实际约定，并保留原形态以便追溯。见 handoff 第三节。
  admission_record_path_pattern: logs/chatgpt-review-<date>-srcadm-01-admission-final.md
  admission_record_path_pattern_superseded: logs/chatgpt-review-<date>-adc-surfaceome-reference-v0-3-0-admission-final.md
  # 准入是**有条件**的。四项条件由 SRCADM-01 冻结，任一被破坏即须重审。
  admission_is_conditional: true
  admission_conditions_ref: docs/pools/srcadm_01_surfaceome_admission.yaml#admission_conditions
  admission_conditions:
    - COND-01
    - COND-02
    - COND-03
    - COND-04
  # 该 admission PR 必须逐项审计以下内容。哈希与自声明不在其列。
  required_audit_items:
    - id: AUD-01
      item: builder 实现与版本（AssetGenOS/scripts/build_t7_surfaceome_reference.py@0.3.0）
    - id: AUD-02
      item: raw manifest 与 raw_manifest_sha256 884f4191… 的对应关系
    - id: AUD-03
      item: 原始来源清单与各自的 release 版本
    - id: AUD-04
      item: 每个原始来源的 license 与再分发条件
    - id: AUD-05
      item: independent_evidence_family 的独立性是否真实成立，而非同源数据的重复计数
    - id: AUD-06
      item: 来源去重逻辑
    - id: AUD-07
      item: discordance_flags 的生成规则与覆盖范围
    - id: AUD-08
      item: 代表性靶点的逐行来源回溯
    - id: AUD-09
      item: snapshot 是否可由 builder 与 raw manifest 复现
  # 自声明的语义守卫在 admission 中只能作为待验证项，不能作为已验证结论。
  self_declared_guards_are_claims_not_verification: true
  self_declared_guards:
    - guard: absence_is_negative_evidence
      declared_value: false
      status: claim_pending_audit
      relates_to_repo_rule: 缺失证据一律 DEFER，永不 EXCLUDE
    - guard: membrane_topology_is_independent_surface_localization
      declared_value: false
      status: claim_pending_audit
      relates_to_repo_rule: PR #58 第二轮阻断——跨膜段不足以判定细胞外可及
    - guard: generic_membrane_is_surface_confirmation
      declared_value: false
      status: claim_pending_audit
      relates_to_repo_rule: 泛膜注释不等于质膜定位
    - guard: cci_receptor_role_is_surface_confirmation
      declared_value: false
      status: claim_pending_audit
      relates_to_repo_rule: 受体角色推断不等于定位证据
    - guard: tumor_ihc_is_surface_density
      declared_value: false
      status: claim_pending_audit
      relates_to_repo_rule: 表达强度不等于表面密度，属 Level 02 T7
    - guard: excluded_rna_source
      declared_value: GSE160572_MM_surfaceome.csv.gz 因其为 RNA FPKM 而被排除
      status: claim_pending_audit
      relates_to_repo_rule: RNA 不得当作蛋白层面验证，无例外
  # 抽取执行时仍须校验这些校验和；它们是版本固定手段，不是批准依据。
  files_pinned_for_integrity_only:
    - path: surfaceome_consensus.tsv
      sha256: c7baa2ac86e1d173ef555e92036c2841efb5d106c4931bcf71507fbd5cbc1e7b
      rows: 20797
    - path: membrane_topology_evidence.tsv
      sha256: d2680b961793f8ed83decbc92cdf04d5818f4cdbcb1e241c0ef34c4f06e77eca
      rows: 4863
    - path: source_evidence.tsv
      sha256: a61222f03f2763af7733793d0bc85e19185515683a8fa1956d1559667cd662ab
      rows: 41204
    - path: build_manifest.json
      sha256: 9872dacd2f30532364576f29ce8c7428a8df9c6bc5abea408472bb3f79069fe2

# 抽取范围：只处理已批准枚举里的 41 个靶点，不新增任何靶点。
scope:
  target_axis_source: external:result/gen_iet_crc_target_enumeration_20260802
  target_axis_file: target_evidence_catalog.tsv
  target_axis_sha256: 27bb81ebe5f1048b732f62c530095e0007212f818f3844e004118bb94525cc28
  target_count: 41
  join_key: gene_symbol
  new_targets_allowed: false
  measured_coverage_in_reference: 37
  measured_absent_from_reference: 4
  measured_absent_targets:
    - AG7
    - CA19-9
    - EDBN
    - Undisclosed

# 只允许读取这些字段。白名单之外一律不得进入推导，防止把 Level 02 的量化
# 与肿瘤上下文数据洗进 LOCK-01。
allowed_fields:
  from_surfaceome_consensus:
    - gene_symbol
    - uniprot_accessions
    - uniprot_signal_peptide
    - uniprot_gpi_anchor
    - uniprot_transmembrane_segment_count
    - uniprot_extracellular_domain
    - uniprot_extracellular_domain_count
    - uniprot_extracellular_max_length_aa
    - uniprot_ecd_meets_min_length
    - independent_evidence_family_count
    - independent_evidence_families
    - consensus_class
    - discordance_flags
    - dataset_version
    - snapshot_id
    - row_checksum
  from_source_evidence:
    - gene_symbol
    - source_id
    - source_release
    - evidence_family
    - evidence_kind
    - evidence_codes
    - source_url
    - license

# 明确禁止读取的文件与字段：它们属 Level 02 / T7，读入即重演 PR #58 的越界。
barred_files:
  - path: tumor_surface_measurement.tsv
    reason: 肿瘤表面定量属 Level 02 T7，不属 LOCK-01。
  - path: tumor_protein_context.tsv
    reason: 肿瘤上下文蛋白组属 Level 02 T7。
  - path: treatment_surface_response.tsv
    reason: 治疗后表面变化属 T5/T7，Level 01 不评估。
  - path: receptor_evidence.tsv
    reason: 受体角色推断不构成定位证据（该库自身亦声明 cci_receptor_role_is_surface_confirmation=false）。
barred_fields:
  - field: cci_receptor_role
    reason: 受体角色不是定位证据。
  - field: uniprot_generic_membrane
    reason: 泛膜注释不等于质膜定位。
  - field: full_t7_gate_confidence_cap
    reason: T7 置信上限属 Level 02，Level 01 不得引用。

# RQ-01：质膜定位。要求至少两个独立证据家族。
# 该库定义的三个独立家族为 curated_knowledge / imaging / cell_surface_capture_ms，
# 且已把拓扑与泛膜排除在家族计数之外，故家族计数天然不会把拓扑当定位。
rq_01_plasma_membrane_localization:
  decisive_field: independent_evidence_family_count
  minimum_independent_families: 2
  independent_families:
    - curated_knowledge
    - imaging
    - cell_surface_capture_ms
  topology_counts_as_family: false
  generic_membrane_counts_as_family: false
  rna_may_satisfy: false

# RQ-02：细胞外结构域。两条合格路径，任一成立即满足。
rq_02_extracellular_domain:
  # 两个计数必须分开：满足某条路径 != 最终 eligible。
  # 满足 RQ-02 的靶点还可能因独立家族数不足或定位证据冲突而落 hold。
  paths:
    - path_id: ECD-a
      condition: uniprot_ecd_meets_min_length = true
      applies_to: 有跨膜段且带 TOPO_DOM Extracellular 注释的蛋白
      measured_path_satisfied_count: 30
      eligible_via_path_count: 18
    # 必需的第二条路径。UniProt 的 extracellular domain 字段由跨膜蛋白的
    # TOPO_DOM 推导，GPI 锚定蛋白零跨膜段、无 TOPO_DOM，故该字段一律为 false。
    # 若只用 ECD-a，CEACAM5、MSLN、FOLR1、MELTF 会因数据表示假象落入 hold，
    # 而四者都是 confirmed_surface 且带信号肽与 GPI 锚——成熟蛋白整体位于胞外。
    - path_id: ECD-b
      condition: uniprot_gpi_anchor = true 且 uniprot_signal_peptide = true 且 uniprot_transmembrane_segment_count = 0
      applies_to: GPI 锚定、带信号肽、零跨膜段的蛋白，成熟蛋白整体位于胞外
      rationale_note: >-
        这是修正数据表示假象，不是放宽标准：GPI 锚定加信号肽加零跨膜段在结构上
        即意味着全长成熟蛋白位于细胞外侧，其胞外长度等于成熟蛋白长度。
      measured_path_satisfied_count: 4
      eligible_via_path_count: 4
      measured_targets:
        - CEACAM5
        - FOLR1
        - MELTF
        - MSLN
  paths_are_mutually_exclusive_in_this_snapshot: true
  measured_path_overlap: 0
  # RQ-02 阳性总数的分解恒等式。执行结果必须满足它。
  rq_02_positive_decomposition:
    total: 34
    final_eligible: 22
    hold_insufficient_localization_families: 6
    hold_discordance: 6
    identity: "|RQ-02 positive| = |E1-01| + |E1-02| + |E1-04 中 RQ-02 阳性者|"
  luminal_domain_is_not_extracellular: true
  luminal_domain_note: >-
    溶酶体／内体膜蛋白的大结构域朝向腔内而非胞外。LAMP1 即属此类：
    有跨膜段与信号肽，但无胞外 TOPO_DOM，故两条路径都不满足，落 hold。
    这正是审核方要求的「细胞器膜定位必须 DEFER」。

# RQ-03：蛋白层面 provenance。分两类，不得混用。
rq_03_protein_level_provenance:
  rna_derived_rows_admissible: false
  # 库中覆盖的靶点：必须有完整的来源 provenance。
  covered_rows:
    requires_rows_in: source_evidence.tsv
    required_fields:
      - source_id
      - source_release
      - evidence_family
      - source_url
      - license
  # 库中未覆盖的靶点（E1-05）：source_evidence.tsv 里本就没有它们的行，
  # 因此不得要求来源 provenance——否则合法的 hold 行无法通过验证，
  # 或迫使执行者伪造 provenance。改为要求「缺失 provenance」。
  absent_rows:
    requires_rows_in: null
    source_provenance_fields_may_be_empty: true
    fabricating_source_evidence_forbidden: true
    required_absence_fields:
      - reference_dataset_id
      - reference_dataset_version
      - reference_snapshot_id
      - target_axis_ref
      - absence_reason
      - lookup_at
    absence_reason_allowed_values:
      - gene_symbol_not_present_in_reference
  never_present_absence_as_source_supported: true
  # 覆盖靶点 RQ-03 不成立时的归属规则。
  covered_row_failure_rule: E1-04b
  covered_row_failure_disposition: DEFER
  measured_covered_targets_satisfying_rq_03: 37
  measured_covered_targets_failing_rq_03: 0

# 规则求值优先级。五条规则的条件并非天然互斥——同一靶点可能同时满足
# 「两条 ECD 路径都不满足」与「独立家族数 < 2」。实测本 snapshot 下有 2 个
# 这样的靶点（TM4SF1、TDGF1）。因此必须冻结优先级，按此顺序取第一个命中者，
# 每个靶点恰好命中一条规则。
derivation_precedence:
  - E1-05
  - E1-04
  - E1-04b
  - E1-03
  - E1-02
  - E1-01
precedence_rationale: >-
  先判「不在库中」，因为无数据时其余条件都无法求值；再判定位证据冲突，
  因为冲突使后续判据不可信；再判 provenance 是否成立，因为 provenance 不成立时
  该行的证据本身不可引用，再谈拓扑与家族数没有意义；再判细胞外结构域，
  再判独立家族数；全部通过才 eligible。
measured_multi_condition_targets:
  - gene_symbol: TM4SF1
    conditions_matched:
      - E1-03
      - E1-02
    resolved_to: E1-03
  - gene_symbol: TDGF1
    conditions_matched:
      - E1-03
      - E1-02
    resolved_to: E1-03

# 确定性映射。五条规则覆盖全部 41 个靶点，无自由裁量，零排除。
derivation_rules:
  - id: E1-01
    condition: RQ-01 满足且 RQ-02 任一路径满足且 RQ-03 满足，且 discordance_flags 为空
    lock_01_outcome: eligible_surface_target
    disposition: RETAIN
    resulting_state: eligible
    expected_count: 22
  - id: E1-02
    condition: RQ-02 满足但独立证据家族数 < 2
    lock_01_outcome: possible_surface_target
    disposition: DEFER
    resulting_state: hold
    expected_count: 6
    measured_targets:
      - CLDN18
      - GUCY2C
      - LGR5
      - PRLR
      - RNF43
      - SLC44A4
  - id: E1-03
    condition: 两条 RQ-02 路径都不满足（含细胞器腔内结构域）
    lock_01_outcome: possible_surface_target
    disposition: DEFER
    resulting_state: hold
    expected_count: 3
    measured_targets:
      - LAMP1
      - TDGF1
      - TM4SF1
  - id: E1-04
    condition: discordance_flags 非空
    lock_01_outcome: possible_surface_target
    disposition: DEFER
    resulting_state: hold
    reason: 定位证据冲突一律 DEFER，不得由抽取者裁决。
    expected_count: 6
    measured_targets:
      - CD276
      - F3
      - IL2RA
      - MET
      - MST1R
      - TACSTD2
  # 覆盖靶点的 RQ-03 不成立时必须有归属规则，否则 VAL-E01 的「恰好命中一条」
  # 无从满足。实测本 snapshot 下 37 个覆盖靶点全部满足 RQ-03，故本规则为空规则；
  # 但它必须存在，因为 provenance 完整性不由本契约保证，抽取时可能失败。
  - id: E1-04b
    condition: 靶点在参考库中，但 RQ-03 provenance 不成立
    lock_01_outcome: possible_surface_target
    disposition: DEFER
    resulting_state: hold
    reason: >-
      provenance 不成立时该行证据不可引用，只能 DEFER；
      既不得 RETAIN（无可回溯来源），也不得 EXCLUDE（缺 provenance 不是否定证据）。
    expected_count: 0
    vacuous_this_run: true
    vacuous_reason: 实测 37 个覆盖靶点在 source_evidence.tsv 中均有齐备的 source_id／source_release／evidence_family／source_url／license。
  - id: E1-05
    condition: 靶点不在参考库中
    lock_01_outcome: possible_surface_target
    disposition: DEFER
    resulting_state: hold
    reason: 缺失是 DEFER，永不 EXCLUDE；该库自身 absence_is_negative_evidence 亦为 false。
    expected_count: 4
    measured_targets:
      - AG7
      - CA19-9
      - EDBN
      - Undisclosed

# not_surface_target 仍然不可用。
unavailable_outcomes:
  - outcome: not_surface_target
    reason: >-
      本库明确 absence_is_negative_evidence=false，不产出「该靶点不是表面蛋白」
      这类阳性否定断言。consensus_class = no_surface_support 只表示无支持证据，
      不等于已证伪。故本次抽取仍不得排除任何靶点。
  - outcome: identity_unresolved
    reason: 本库无身份解析结论字段；未覆盖的 4 个靶点一律落 possible_surface_target。

# 抽取后的预期结果，逐项可核对。
predicted_result_shape:
  targets_total: 41
  eligible: 22
  hold: 19
  killed: 0
  hold_breakdown:
    E1-02_no_independent_localization: 6
    E1-03_no_extracellular_domain: 3
    E1-04_conflict: 6
    E1-05_not_in_reference: 4
  eligible_via_path:
    ECD-a: 18
    ECD-b: 4
  # 执行结果必须逐项等于上列数字，任一项不符即视为偏离本契约。

# 必须写进结果报告的发现，避免被误读。
mandatory_findings:
  - id: MF-01
    finding: >-
      GUCY2C 落 hold。它在本参考库中只有 curated_knowledge 一个独立证据家族，
      未达两家族门槛，consensus_class 为 supported_surface 而非 confirmed_surface。
      这与此前多模型共识把 GUCY2C 列为首选、以及被隔离运行的 Tier A 选择相反。
      结果报告必须原样写出，不得因与既有偏好冲突而弱化。
  - id: MF-02
    finding: >-
      eligible 只表示身份与拓扑层面存在有合理依据的细胞外可及蛋白形式，
      不表示该靶点在 CRC 肿瘤细胞表面可得——后者是 Level 02 的 T7，本次未评估。
  - id: MF-03
    finding: >-
      零排除。41 个靶点中没有任何一个被判为 not_surface_target。
      hold 不是淘汰，是待证据。

output_schema:
  # provenance_kind 决定哪一组列必填。
  conditionally_required_columns:
    - when_provenance_kind: reference_absent
      required_columns:
        - reference_dataset_id
        - reference_dataset_version
        - reference_snapshot_id
        - absence_reason
        - target_axis_ref
        - lookup_at
      may_be_empty_columns:
        - source_ids
        - source_releases
        - source_urls
        - licenses
      # 这三列必须分别等于 admission snapshot 的对应值，不得自由填写。
      pinned_to_admission_snapshot:
        reference_dataset_id: ADC_surfaceome_reference
        reference_dataset_version: 0.3.0
        reference_snapshot_id: 2026-07-29-quant-topology-mm
    - when_provenance_kind: source_supported
      required_columns:
        - source_ids
        - source_releases
        - source_urls
        - licenses
      may_be_empty_columns:
        - reference_dataset_id
        - reference_dataset_version
        - reference_snapshot_id
        - absence_reason
        - lookup_at
  per_target_columns:
    - gene_symbol
    - uniprot_accessions
    - rule_id
    - lock_01_outcome
    - disposition
    - evaluation_status
    - rq_01_satisfied
    - rq_01_family_count
    - rq_01_families
    - rq_02_satisfied
    - rq_02_path
    - rq_03_satisfied
    - consensus_class
    - discordance_flags
    - source_ids
    - source_releases
    - source_urls
    - licenses
    - dataset_version
    - snapshot_id
    - row_checksum
    - extracted_at
    - provenance_kind
    - reference_dataset_id
    - reference_dataset_version
    - reference_snapshot_id
    - absence_reason
    - target_axis_ref
    - lookup_at

output_validation:
  - id: VAL-E01
    rule: 输出必须恰好 41 行，每行命中且仅命中一条 derivation_rules 规则，并记录 rule_id。
  - id: VAL-E02
    rule: 计数必须等于 predicted_result_shape：22 eligible + 19 hold + 0 killed，且 hold_breakdown 逐项相符。
  - id: VAL-E03
    rule: 输出中不得出现 not_surface_target 或 identity_unresolved。
  - id: VAL-E04
    rule: 每个 eligible 行必须记录 rq_02_path，取值限于 ECD-a 或 ECD-b。
  - id: VAL-E05
    rule: >-
      provenance_kind = source_supported 的行必须有非空 source_ids、source_releases、
      source_urls、licenses；缺失即该行降为 hold。
  - id: VAL-E05b
    rule: >-
      provenance_kind = reference_absent 的行（即 E1-05）允许 source_* 字段为空，
      但必须有完整的缺失 provenance：reference_dataset_id、reference_dataset_version、
      reference_snapshot_id、target_axis_ref、absence_reason、lookup_at。
      absence_reason 只能取 gene_symbol_not_present_in_reference。
      这六列全部在 output_schema.per_target_columns 之内。
  - id: VAL-E05d
    rule: >-
      reference_dataset_id、reference_dataset_version、reference_snapshot_id 必须分别
      等于 admission snapshot 的 ADC_surfaceome_reference、0.3.0、
      2026-07-29-quant-topology-mm，不得自由填写。
  - id: VAL-E05c
    rule: >-
      禁止为未覆盖靶点伪造 source evidence，也禁止把缺失表述为 source-supported：
      provenance_kind = reference_absent 的行若出现非空 source_ids 即为验证失败。
  - id: VAL-E06
    rule: 四个输入文件与靶点轴文件的 SHA-256 必须与本契约记录一致，不一致即中止执行。
  - id: VAL-E07
    rule: 不得读取 barred_files 或 barred_fields 中的任何文件或字段。
  - id: VAL-E08
    rule: 输出中不得出现任何 Gate 分数、Gate 状态、T7 判定或肿瘤表面定量。
  - id: VAL-E09
    rule: mandatory_findings 的三条必须原样出现在结果报告中。
  - id: VAL-E10
    rule: 每个产物文件必须逐文件记录 SHA-256 并写入结果 PR 的 handoff。
  - id: VAL-E11
    rule: >-
      规则求值必须按 derivation_precedence 顺序取第一个命中者；每个靶点恰好命中
      一条规则。同时满足多条条件的靶点必须落在优先级更高的那条，并在结果中
      记录其余被压制的条件。覆盖靶点若 RQ-03 不成立，必须归入 E1-04b，
      不得因无归属规则而落空。
  - id: VAL-E12
    rule: >-
      RQ-02 阳性靶点数必须满足 rq_02_positive_decomposition 的恒等式；
      每条路径必须同时报出 path-satisfied 与 eligible-via-path 两个计数，
      不得只报其一或用后者冒充前者。
  - id: VAL-E13
    rule: >-
      抽取执行前，source_admission_dependency.admission_record_ref 必须指向一份
      实际存在的独立 APPROVE 记录；为空即不得执行。

not_authorised:
  - 在 SRCADM-01 取得独立 APPROVE 记录前执行抽取
  - 把 ADC_surfaceome_reference 纳入已批准来源（本契约只引用，不批准）
  - 执行 Level 01
  - 评估 T7 或任何肿瘤细胞表面可得性
  - 新增任何靶点或 clinical context
  - 任何筛选排序、Tier 划分、资产推荐或实验建议
  - 任何 Gate 执行或评分
  - 读取被禁文件或字段
  - 把被隔离运行（PR #53、#54）的任何产物引入
