upstream_defect:
  id: GAP-P07
  defect: PR #58 冻结的 41 个 target 中至少四个不是可消歧的蛋白实体
  entities:
    - Undisclosed
    - EDBN
    - AG7
    - CA19-9
  where: external:result/gen_iet_crc_target_enumeration_20260802#target_evidence_catalog.tsv
  frozen_by_pr: 58
  why_not_fixed_here: >-
    EVGAP-02 无权新增或修改 target 与 clinical context（见 not_authorised）。
    在本契约内给 Undisclosed 编一个身份，等于静默改轴。
  binding_already_knew: >-
    binding 的 lock_01 规则明确把 identity_unresolved 列为 unavailable_outcomes，
    理由是「已批准层没有身份解析结论字段，无法区分身份未解析与注释不可得」。
    也就是说该缺陷在 PR #58 时已被察觉但无法表达，于是四个实体以
    rq_01_family_count = 0、rule E1-05 的形式留在轴上。
  interim_handling: 本抽取按 L3-00 处理，全部 DEFER，既不 RETAIN 也不 EXCLUDE
  requires_separate_pr: true
  separate_pr_scope: >-
    在 target 轴层面决定这四个实体的归属：解析为标准符号、定义为非蛋白抗原、
    或从轴上移除。移除会改变 41/369 这两个冻结计数，故必须经审核。

