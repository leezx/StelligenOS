# EVGAP-02：CRC-specific target–context linkage 证据抽取绑定（machine-readable）
#
# 目的：解除 PR #58 登记的 EVGAP-02，使 Level 01 的 LOCK-03 可以真正求值。
# 本文件不含任何证据数据，只含来源分层、四类 linkage 判据、求值优先级、
# 检索范围冻结、输出 schema 与验证规则。
#
# 由 tests/test_evgap_02_crc_linkage.py 校验。
# LOCK-03 的 outcome 词表见 docs/pools/adc_pool_gate_usage.yaml（PR #57）。
# 来源文档：Zhixins-KB/2.Biotech/Asset-Generation-OS-architecture.md#EVGAP-02 应该具体抽取什么
#
# v0.2.0 修订（PR #62 审核）：v0.1.0 有一个承重漏洞——它把 evidence_direction 与
# review_status 列为必需列，却没有任何一条规则要求它们被解析。结果 0.1.0 下的一次
# 合规执行产出了 7,067 行 evidence_direction=unknown 的检索命中，并据此判出 168 条
# RETAIN。检索命中不是 linkage 证据。v0.2.0 把抽取拆成三层，并要求 LOCK-03 只能
# 引用已抽取的 assertion。

extraction:
  extraction_id: evgap_02_crc_linkage
  extraction_version: 0.2.0
  supersedes_version: 0.1.0
  amended_after_review_of_pr: 62
  amendment_reason: >-
    v0.1.0 允许「搜索命中」直接充当 A/B/C/D 类 linkage 证据：linkage_class 由
    query 类别决定，而非由记录内容决定。因此 target、CRC 词与 modality 词在同一篇
    全文中共现即可被登记为 precedent。v0.2.0 引入 assertion 层，把「检索到候选」
    与「已抽取断言」分开，并把实体消歧前置为 LOCK-03 可求值的前提。
  discharges_gap: EVGAP-02
  gap_source: docs/pools/adc_pool_level_01_input_binding.yaml
  serves_lock: LOCK-03
  status: amended_pending_review
  # v0.1.0 已执行一次，其产物按 PR #62 审核结论降级为 L-RETRIEVAL 层产物，
  # 不构成 EVGAP-02 结果。v0.2.0 的 L-ASSERTION 与 L-DISPOSITION 尚未执行。
  execution_status: retrieval_layer_executed_assertion_layer_not_executed
  gap_discharged: false
  executed_runs:
    - run_id: external:result/gen_iet_evgap_02_crc_linkage_20260805T190453Z
      under_contract_version: 0.1.0
      layers_completed:
        - L-RETRIEVAL
      layers_not_completed:
        - L-ASSERTION
        - L-DISPOSITION
      downgraded_by_review_of_pr: 62
      discharges_gap: false
  # 与 EVGAP-01 不同：本抽取不依赖任何未获准入的派生数据库，
  # Tier 1 原始公开来源即可支撑，故获 APPROVE 后即可执行。
  authorises_extraction_run_after_approve: true
  authorises_level_01_execution: false
  blocked_by:
    - contract_approval
  requires_followup_binding_pr: true
  # 本抽取与 EVGAP-01／SRCADM-01 完全独立，可并行执行。
  independent_of:
    - EVGAP-01
    - SRCADM-01
  independence_reason: >-
    LOCK-03 问的是「target 为什么与这个 CRC clinical context 有关」，
    与表面拓扑无关，因此不读取 surfaceome 参考库，也不受其准入状态影响。

# ---------------------------------------------------------------- 三层结构
#
# v0.1.0 只有「检索」与「判定」两步，中间缺一层。缺的这一层正是「这条记录到底
# 断言了什么」。没有它，linkage_class 只能由 query 类别决定，于是分类器就是查询词本身。
extraction_layers:
  - layer_id: L-RETRIEVAL
    name: candidate_retrieval
    unit: target（A/B/C）与 pair（D）
    produces: retrieval_candidates
    # 这一层的产物永远不能单独支撑 LOCK-03。
    may_support_lock_03: false
    may_be_referenced_by_disposition: false
    what_it_proves: >-
      在该 endpoint 上，给定 query 表达式返回了这条记录。仅此而已。
      它不证明该记录谈及本 target，也不证明其中的 CRC 语义与本 target 有关。
    known_false_positive_modes:
      - 缩写碰撞（符号在正文中指代其他事物）
      - 全文命中（target 与 CRC 词分别出现在正文不同段落、彼此无关）
      - 参考文献命中（命中来自文末引文而非正文主张）
      - 综述背景命中（modality 词属于其他 target 的 precedent）
      - "免责声明命中（PR #58 已记录：33 条 statement 全含 CRC，但只出现在
        「precedent does not establish CRC efficacy」这句免责声明里）"
  - layer_id: L-ASSERTION
    name: assertion_extraction
    unit: assertion
    consumes: retrieval_candidates
    produces: linkage_assertions
    may_support_lock_03: true
    # 一条 assertion 必须已经把主体、癌种、关系、方向与出处落到具体字段上。
    requires_all_of: assertion_requirements
    machine_extraction_permitted: true
    machine_extraction_permitted_basis: >-
      PR #58 的 DECISION-02 允许机器抽取的证据满足 LOCK-03 existence，
      但其前提是机器**已经抽出一条具体、可审计的 linkage assertion**，
      而不是「返回了一批候选记录」。v0.1.0 的执行停在候选，未做抽取。
    human_review_still_required: true
    human_review_scope: 每条 assertion 的 review_status 仍为待人工复核
  - layer_id: L-DISPOSITION
    name: lock_03_disposition
    unit: pair
    consumes: linkage_assertions
    may_only_reference: linkage_assertions
    may_reference_retrieval_candidates: false
    reason: >-
      supporting_evidence_refs 若可指向纯检索命中，L3-02 就退化为
      「query 有返回」。这正是 v0.1.0 实际发生的事。

# --------------------------------------------------------- assertion 的构成要件
#
# 任一要件缺失，该记录停留在 L-RETRIEVAL，不得升级为 assertion。
assertion_requirements:
  required_elements:
    - element: target_entity_resolved
      meaning: 记录中的主体已消歧到本 pair 的 target，而不仅是字符串匹配
    - element: crc_entity_resolved
      meaning: 记录中的癌种已消歧为 CRC，而不是「正文出现 colorectal 一词」
    - element: context_entity_resolved
      meaning: D 类必需——亚群语义已消歧到本 pair 的 clinical context
    - element: relationship_type
      meaning: target 与 CRC/context 之间的关系类型，取自 relationship_types
    - element: assertion_direction
      meaning: 关系的方向，不得为 unknown
    - element: supporting_text_or_structured_field
      meaning: 支撑该断言的具体原文段落，或具体结构化字段值
  relationship_types:
    - expressed_in
    - enriched_in
    - retained_in
    - targeted_by_modality_in
    - clinically_evaluated_in
  # 这是 v0.1.0 缺失的那一条硬性要求。
  direction_must_be_resolved: true
  direction_unknown_forbidden_for_lock_03: true
  direction_unknown_consequence: 该记录停留在 retrieval_candidate，不得进入任何 refs
  # 共现不是断言。
  cooccurrence_is_not_an_assertion: true
  cooccurrence_examples_rejected:
    - target 与 CRC 词共现于同一全文
    - target、CRC 与 "ADC" 共现于同一全文
    - target 与 BRAF／HER2／CMS4 等亚群词共现于同一全文
  examples_of_valid_assertions:
    - "CEACAM5 protein was detected in 72% of CRC tumours"
    - "A CEACAM5 ADC was tested in a CRC xenograft model"
  examples_of_invalid_assertions:
    - "一篇综述同时提到本 target、colorectal 与 antibody-drug conjugate"
    - "GDC gene index 中存在该 gene symbol"

# ---------------------------------------------------------------- 实体消歧
#
# v0.1.0 直接把 target 轴的字符串塞进 query。实测后果：字符串 "Undisclosed"
# 被当作基因符号检索，PMC 返回 1,384 条，并使 1 个 pair 判出 RETAIN。
identity_resolution:
  required_before_search: true
  resolution_must_record:
    - input_symbol
    - resolved_identifier_kind
    - resolved_identifier
    - synonyms_used
    - resolution_status
    - resolution_basis
  resolved_identifier_kinds:
    - hgnc_gene_symbol
    - uniprot_accession
    - non_protein_antigen_definition
  resolution_status_vocabulary:
    - resolved
    - resolved_as_non_protein_antigen
    - unresolvable_placeholder
    - unresolvable_ambiguous_abbreviation
  # 未消歧的实体不得进入检索，更不得由检索结果推出任何 LOCK-03 结论。
  unresolved_may_not_be_searched: true
  unresolved_lock_03_rule: L3-00
  # 关键不对称：未消歧实体既不得 RETAIN，也**绝不得** EXCLUDE。
  unresolved_may_not_retain: true
  unresolved_may_not_exclude: true
  unresolved_may_not_exclude_reason: >-
    零命中若源于符号无法消歧，那是消歧失败，不是「完整检索后无 linkage」。
    实测 v0.1.0 正是在此处出错：EDBN 在全部 11 个 endpoint 返回 0 条，
    于是 9 个 pair 落 L3-05 EXCLUDE。而 EDBN 应指 fibronectin 的 extra domain B，
    其标准符号为 FN1；被排除的原因只是缩写本身不出现在文献里。
  # 本次 target 轴中实测四个必须单列的实体。
  known_unresolved_entities:
    - input_symbol: Undisclosed
      resolution_status: unresolvable_placeholder
      note: 这不是实体，是缺失值占位符。v0.1.0 对其执行了 11 次检索。
    - input_symbol: EDBN
      resolution_status: unresolvable_ambiguous_abbreviation
      note: 疑指 fibronectin extra domain B（标准符号 FN1），须由来源轴确认后才可检索。
    - input_symbol: AG7
      resolution_status: unresolvable_ambiguous_abbreviation
      note: 非标准靶点符号；PMC 返回 56 条，全部为缩写碰撞候选。
    - input_symbol: CA19-9
      resolution_status: resolved_as_non_protein_antigen
      note: >-
        sialyl-Lewis a 糖类抗原，非蛋白基因产物，无 HGNC 符号。
        它可被消歧，但不能按基因符号检索；PMC 返回 14,200 条。
  # 消歧规则的可判定性：四个实体在 target 轴中的 LOCK-01 状态一致，可机械识别。
  mechanical_precondition: >-
    这四个实体在 PR #58 的 target 轴中同属 rq_01_family_count = 0、rule E1-05
    （参考库无对应行）。故「无任何表面注释」与「符号无法消歧」在本轴上高度相关，
    可先按该字段筛出候选再逐个消歧，不依赖自由裁量。

# ------------------------------------------------- 各 endpoint 的命中证明了什么
#
# v0.1.0 未声明这一层，于是「endpoint 返回一条记录」被一律当作该类证据。
endpoint_evidence_admissibility:
  - endpoint: PubMed
    hit_proves: 该 query 在题录索引中匹配到该条记录
    hit_does_not_prove: 该记录断言本 target 与 CRC 有关
    assertion_extraction_source: title_and_abstract
    requires_assertion_extraction: true
  - endpoint: PMC
    hit_proves: 该 query 的词项出现在该全文中的某处
    hit_does_not_prove: 这些词项彼此相关，或都指代本 target
    assertion_extraction_source: matched_passage
    requires_assertion_extraction: true
    additional_requirement: 必须记录命中所在段落，且该段落须同时含主体与癌种语义
  - endpoint: ClinicalTrials.gov
    hit_proves: 该 query 匹配到该试验记录
    hit_does_not_prove: 本 target 是干预靶点，或 CRC 是实际纳入适应症
    requires_assertion_extraction: true
    # 宽查询（"<symbol> colorectal"）返回的记录不得直接进入 B/C 类。
    required_structured_fields:
      - intervention_name
      - intervention_target
      - intervention_modality
      - conditions
      - arm_group_assignment
    same_arm_requirement: true
    same_arm_requirement_note: target 与 indication 必须属于同一试验臂，否则不成立
  - endpoint: TCGA
    query_kind: GDC gene index lookup
    hit_proves: GDC gene index 中存在该 gene symbol
    hit_does_not_prove:
      - CRC 肿瘤表达
      - tumour > normal
      - prevalence
      - malignant-cell attribution
    admissible_as_class_a: false
    admissible_as_class_a_reason: gene 存在性与表达无关，属身份查询而非证据查询
    permitted_role: identity_resolution_support_only
  - endpoint: Human Protein Atlas
    query_kind: search index lookup
    hit_proves: HPA 中存在该 target 的页面
    hit_does_not_prove: CRC 人体肿瘤表达
    admissible_as_class_a: false
    permitted_role: identity_resolution_support_only
  - endpoint: GEO
    query_kind: db=gds metadata search
    hit_proves: 该数据集的标题或摘要匹配了 query 词项
    hit_does_not_prove: 该数据集中本 target 在 CRC 中表达或富集
    admissible_as_class_a: false
    admissible_as_class_a_reason: >-
      数据集元数据匹配不是表达测量。要作为 A 类，必须抽取该数据集内本 target 的
      具体表达结论（含方向），并按 RNA 标注。
    permitted_role: candidate_dataset_identification_only
    rna_labelling_still_required: true

# 三个 dataset endpoint 仍必查——它们服务于检索完整性与身份消歧，
# 但其命中不得计入 linkage_classes_hit。
dataset_endpoint_handling:
  dataset_endpoints:
    - TCGA
    - Human Protein Atlas
    - GEO
  still_required_for_coverage: true
  hits_excluded_from_linkage_classes_hit: true
  hits_may_not_be_sole_basis_for_class_a: true

# ---------------------------------------------------------------- 来源分层
#
# 治理事实：仓库内 logs/chatgpt-review-*.md 中**没有任何一条**提及过任何本地
# 派生数据库。surfaceome 的准入问题不是个例，而是普遍状况。因此本契约把来源
# 分成两层：原始公开来源可直接使用；派生本地库一律须各自取得 admission。
source_tiers:
  tier_1_primary_public:
    admissible_without_separate_admission: true
    rationale: >-
      原始公开来源不是派生数据库，其内容可由 source_locator 直接回溯到原始记录，
      不存在「构建逻辑是否遵守声明」的问题。这正是 PR #59 审核所作的区分。
    sources:
      - source_class: peer_reviewed_literature
        # 每个 endpoint 都必查，不允许只查其中一个就算覆盖该 class。
        endpoints:
          - PubMed
          - PMC
        all_endpoints_required: true
        minimum_endpoint_set:
          - PubMed
          - PMC
        must_record:
          - pmid_or_pmcid
          - title
          - journal
          - year
          - retrieved_at
      - source_class: clinical_trial_registry
        endpoints:
          - ClinicalTrials.gov
        all_endpoints_required: true
        minimum_endpoint_set:
          - ClinicalTrials.gov
        must_record:
          - nct_id
          - phase
          - status
          - indication_text
          - retrieved_at
      - source_class: public_molecular_dataset
        endpoints:
          - TCGA
          - GEO
          - Human Protein Atlas
        all_endpoints_required: true
        minimum_endpoint_set:
          - TCGA
          - GEO
          - Human Protein Atlas
        must_record:
          - dataset_accession
          - dataset_version_or_release
          - query_expression
          - retrieved_at
      - source_class: approved_internal_result
        endpoints:
          - external:result/gen_iet_crc_target_enumeration_20260802
        authorising_pr: 29
        role: target 轴与 clinical context 轴，唯一用途是定义抽取范围
        must_record:
          - source_id
          - sha256

  tier_2_derived_local_databases:
    admissible_without_separate_admission: false
    barred_until_admitted: true
    reason: >-
      派生数据库的构建逻辑未经审计，自声明不等于已验证——PR #59 已就此裁决。
      每一个都必须有自己的 admission 记录才能作为 EVGAP-02 的来源。
    pending_admissions:
      - id: SRCADM-02
        dataset_id: ADCdb
        would_serve_linkage_class: B
        admission_record_ref: null
      - id: SRCADM-03
        dataset_id: CRC_journal_whitelist_literature
        would_serve_linkage_class: A
        admission_record_ref: null
      - id: SRCADM-04
        dataset_id: CRC_Atlas_fulltext_accession_ledger
        would_serve_linkage_class: A
        admission_record_ref: null
      - id: SRCADM-05
        dataset_id: ADC_competitive_landscape_reference
        would_serve_linkage_class: B
        admission_record_ref: null
    # 本次抽取不使用它们；使用即为违约。
    used_by_this_extraction: false
    consequence_of_exclusion: >-
      检索完整性只能按 Tier 1 声明范围判定。若将来某个派生库获准入，
      需另开 PR 扩大 declared_search_scope 并重跑，不得静默扩大。

# ---------------------------------------------------------------- 抽取范围
scope:
  unit: pair
  pair_definition: clinical_context_id x target
  clinical_context_axis: external:result/gen_iet_crc_target_enumeration_20260802#indication_endpoint_universe.tsv
  clinical_context_axis_sha256: b0b9506644df5453b97982f8c934b10795890b9c602342d7716124948c55d727
  clinical_context_count: 9
  target_axis: external:result/gen_iet_crc_target_enumeration_20260802#target_evidence_catalog.tsv
  target_axis_sha256: 27bb81ebe5f1048b732f62c530095e0007212f818f3844e004118bb94525cc28
  target_count: 41
  pair_count: 369
  new_targets_allowed: false
  new_contexts_allowed: false
  # 覆盖全部 369 个 pair，而不是只覆盖 EVGAP-01 之后可能 eligible 的 22 个。
  covers_all_pairs: true
  does_not_depend_on_lock_01_status: true
  scope_reason: >-
    若只覆盖 22 个 pair，本抽取就会依赖尚未获准入的 surfaceome 判定结果，
    既污染来源，也使两条 track 无法并行。全部 369 个 pair 独立于 LOCK-01。
  # 检索粒度：疾病级证据按 target 检索一次，情境特异性按 pair 判定。
  search_granularity:
    disease_level_search_unit: target
    disease_level_search_count: 41
    context_specific_assessment_unit: pair
    context_specific_assessment_count: 369
    reason: >-
      A/B/C 三类的疾病级检索对同一 target 在 9 个 context 下结果相同，
      按 target 检索一次即可，避免 369 次冗余检索；
      D 类情境特异性富集必须按 pair 判定。

# ------------------------------------------------- 四类 linkage 判据（来源文档）
#
# v0.2.0：四类都是 assertion 的分类，不是 query 的分类。
linkage_class_common_requirements:
  applies_to_all_classes: true
  requires_assertion: true
  classified_by: assertion_content
  classified_by_query_category_forbidden: true
  classified_by_query_category_forbidden_reason: >-
    v0.1.0 用 query 类别给记录贴 class：命中「class B 查询」即记为 B 类 precedent。
    于是「文章里同时出现 target、CRC 与 ADC」被当成「该 target 在 CRC 中有 ADC precedent」。
    命中可能来自综述、参考文献、背景介绍、别的 target 的 ADC，或 ADC 是别的缩写。
  minimum_fields_per_assertion:
    - relationship_type
    - assertion_direction
    - supporting_text_or_structured_field
  direction_unknown_admissible: false

linkage_classes:
  - class_id: A
    name: crc_human_tumor_expression
    accepts:
      - CRC patient samples
      - primary tumour
      - metastatic lesion
      - treatment-resistant context
    must_record_when_available:
      - positive_fraction_or_prevalence
      - malignant_cell_attribution
    protein_preferred_over_rna: true
    # RNA 可以证明 linkage 存在，但绝不得替代 LOCK-01 的蛋白层面判据。
    rna_admissible_for_linkage_existence: true
    rna_may_satisfy_lock_01: false
    rna_must_be_labelled: true
  - class_id: B
    name: crc_specific_adc_precedent
    accepts:
      - CRC clinical trial
      - CRC preclinical ADC
      - CRC cell line
      - CRC PDO
      - CRC PDX
      - CRC animal model
    other_cancer_only_precedent_counts_as_linkage: false
    other_cancer_only_precedent_disposition: metadata_only_hold
  - class_id: C
    name: crc_specific_target_directed_modality
    accepts:
      - naked antibody
      - CAR-T
      - bispecific
      - radioimmunotherapy
      - immunotoxin
      - imaging antibody
    proves: target 在 CRC 中可接近或可干预
    # 必须显式标注：这不是 ADC 疗效证据。
    is_adc_efficacy_evidence: false
    must_be_labelled_not_adc_efficacy: true
    counts_as_linkage_existence: true
    counts_as_linkage_reason: >-
      LOCK-03 只问「是否存在公开证据表明该 target 与该 CRC context 有关」，
      不问 ADC 疗效。CRC 中的靶向干预证据满足前者。
  - class_id: D
    name: context_specific_enrichment
    accepts:
      - MSS/pMMR
      - post-anti-EGFR
      - liver metastasis
      - treatment-resistant
      - HER2-positive
      - refractory metastatic CRC
    # 疾病级 CRC 证据只支持 canonical context，不自动支持任何亚群。
    disease_level_supports_canonical_only: true
    subgroup_requires_class_d: true

# ---------------------------------------------------- 检索范围冻结（可判定完整性）
#
# PR #58 曾判定 no_known_linkage_after_complete_search 不可用，理由是检索范围
# 未闭合。本节正是使该 outcome 变为可用的前提：范围一旦冻结，
# 「是否完成规定检索」就成为可判定的事实，而不是执行者的自我声明。
declared_search_scope:
  scope_version: 0.2.0
  per_target_required_source_classes:
    - peer_reviewed_literature
    - clinical_trial_registry
    - public_molecular_dataset
  query_template_required: true
  query_template_must_record:
    - target_symbol_and_synonyms
    - crc_terms
    - class_specific_terms
    - date_range
  date_range_upper_bound: run_date
  per_source_must_record:
    - source_class
    - endpoint
    - query_expression
    - executed_at
    - result_count
    - reachable
  # 覆盖粒度：按 endpoint 判定，不是按 source class 判定。
  coverage_unit: endpoint
  coverage_unit_reason: >-
    只要求覆盖 source class，执行者可以只查 PubMed 不查 PMC、只查 TCGA 不查 GEO 与 HPA，
    结果不可复现。故每个 source class 都写明 minimum_endpoint_set 且 all_endpoints_required。

  # D 类是 pair 级的，必须单独有可审计的检索完整性契约，
  # 否则 subgroup pair 可能在从未检索 D 类的情况下直接落 L3-03，
  # 或使「四类均无命中」的 L3-05 被错误触发。
  per_pair_required_class_d_search:
    required: true
    applies_to: all_369_pairs
    must_record:
      - class_d_query_expression
      - class_d_executed_at
      - class_d_result_count
      - class_d_reachable
      - class_d_source_coverage_ref
      - class_d_search_complete
    incomplete_consequence: L3-01
    incomplete_consequence_note: >-
      某个 pair 的 D 类检索未完成时，该 pair 必须落 L3-01 linkage_evidence_missing，
      **不得**落 L3-03，也**不得**落 L3-05。

  # 「完成规定检索」的定义。任一条不满足即为未完成。
  search_complete_definition:
    - 每个 target 的 input_symbol 都已完成 identity_resolution 且 resolution_status = resolved
      或 resolved_as_non_protein_antigen
    - 每个 target 都对 per_target_required_source_classes 的每一类的**每一个 endpoint** 执行过检索
    - 每次检索都记录了 query_expression、executed_at、result_count 与 reachable
    - 每个 pair 都完成了 per_pair_required_class_d_search 并记录其六个字段
    - 所有 reachable = false 的 endpoint 与 D 类检索都被显式记录为未完成，而非静默跳过
    - 该 pair 的全部 retrieval_candidates 都已过 L-ASSERTION 层，即每条候选都已判定为
      「已抽出 assertion」或「无法抽出 assertion」，不得有未判定的候选
  search_complete_requires_both_levels: false
  search_complete_requires_all_levels: true
  search_complete_levels:
    - target_level_identity_resolution
    - target_level_source_class_and_endpoint_coverage
    - pair_level_class_d_coverage
    - pair_level_assertion_extraction_completed
  # v0.2.0 新增：仅完成检索不等于完成本抽取。
  retrieval_alone_is_not_search_complete: true
  retrieval_alone_is_not_search_complete_reason: >-
    L3-05 EXCLUDE 的前提是「已完整检索且四类均无命中」。若 assertion 层未做，
    「无命中」只是「未判定」。v0.1.0 的 9 条 L3-05 全部出自这一混淆。
  unreachable_source_consequence: search_incomplete_for_that_target
  unreachable_class_d_consequence: search_incomplete_for_that_pair
  silent_skip_forbidden: true

# ------------------------------------------------ LOCK-03 求值规则与冻结优先级
#
# 五条规则必须覆盖全部 pair 且互斥。优先级先判检索完整性，
# 因为检索未完成时其余判据都不可信。
derivation_precedence:
  - L3-00
  - L3-01
  - L3-02
  - L3-03
  - L3-04
  - L3-05
precedence_rationale: >-
  先判实体是否消歧——符号未消歧时检索结果既不能支持也不能排除；
  再判检索与 assertion 抽取是否完成——未完成时「没找到」无法与「不存在」区分；
  再判是否存在与该 context 匹配的 CRC-specific 证据；
  再判疾病级证据遇亚群 context 的降级；再判仅有其他癌种 precedent 的降级；
  以上都不成立且检索已完成，才允许判定完整检索后无 linkage。

derivation_rules:
  # v0.2.0 新增，且必须位于最前。
  - id: L3-00
    condition: >-
      该 pair 的 target input_symbol 的 identity_resolution 结果为
      unresolvable_placeholder 或 unresolvable_ambiguous_abbreviation
    lock_03_outcome: linkage_evidence_missing
    disposition: DEFER
    resulting_state: hold
    reason: >-
      符号未消歧时，检索命中可能来自缩写碰撞，零命中可能来自符号本身不通行。
      两个方向都不可采信，故只能 DEFER。
    # LOCK-03 的 outcome 词表由 PR #57 冻结，其中没有 identity_unresolved
    # （该 outcome 只属于 LOCK-01）。故本规则复用 linkage_evidence_missing，
    # 其 evidence_state = absent_incomplete_search 恰好正确，
    # 身份信息另由 identity_resolution_status 列承载，不新增 outcome。
    outcome_vocabulary_note: reuses_lock_03_frozen_vocabulary
    does_not_introduce_new_outcome: true
    distinguishing_column: identity_resolution_status
    may_never_become_l3_05: true
  - id: L3-01
    condition: >-
      实体已消歧，但未按 declared_search_scope 完成规定工作——target 级 endpoint
      覆盖未齐，**或**该 pair 的 D 类检索未完成，**或**该 pair 的 assertion 抽取未完成
    lock_03_outcome: linkage_evidence_missing
    disposition: DEFER
    resulting_state: hold
    reason: 检索或 assertion 抽取未完成时「没找到」不能与「不存在」区分。
    covers_all_completeness_levels: true
  - id: L3-02
    condition: >-
      存在 A/B/C 任一类的 CRC-specific **assertion**，且 context 为 canonical_c0，
      或 context 为亚群且同时存在 D 类情境特异性 assertion
    requires_assertion: true
    requires_direction_resolved: true
    may_reference_retrieval_candidates: false
    lock_03_outcome: linkage_evidence_exists
    disposition: RETAIN
    resulting_state: active
  - id: L3-03
    condition: >-
      D 类检索已完成，存在 CRC 疾病级证据，但 context 为亚群且 D 类无命中
    requires_class_d_search_complete: true
    lock_03_outcome: linkage_unassessed
    disposition: DEFER
    resulting_state: hold
    reason: 疾病级 CRC 证据不能建立亚群特异 linkage。
  - id: L3-04
    condition: 仅有其他癌种的 precedent，无任何 CRC-specific 证据
    lock_03_outcome: linkage_unassessed
    disposition: DEFER
    resulting_state: hold
    reason: 泛癌 precedent 只证明 modality precedent，不证明与 CRC context 的 linkage。
    retained_as: target_modality_metadata
  - id: L3-05
    condition: >-
      实体已消歧，已按 declared_search_scope 完成规定检索（含该 pair 的 D 类检索）
      **且已完成 assertion 抽取**，四类 linkage 均无 assertion
    requires_class_d_search_complete: true
    requires_identity_resolved: true
    requires_assertion_extraction_complete: true
    zero_hits_from_unresolved_symbol_forbidden: true
    zero_hits_from_unresolved_symbol_forbidden_note: >-
      零命中若源于符号无法消歧，必须落 L3-00，不得落本规则。
    lock_03_outcome: no_known_linkage_after_complete_search
    disposition: EXCLUDE
    disposition_semantics: EXCLUDE_FROM_ACTIVE_POOL
    resulting_state: reactivation-eligible
    is_scientific_disproof: false
    is_killed: false
    retained_in_eligible_universe_index: true
    requires_search_completeness_record: true
    required_search_fields:
      - search_complete
      - search_policy_ref
      - source_coverage_ref
      - search_scope
      - searched_at
      - search_policy_version

# 本契约不给出预期结果形状，这与 EVGAP-01 不同。
predicted_result_shape:
  provided: false
  reason: >-
    EVGAP-01 读取的是已固定的数据集，结果可以事先算出并逐项核对。
    EVGAP-02 是发现型检索，事先给出 22/19 这类数字就会把预测冒充成结果——
    正是来源文档列为第二种必须避免的混淆。因此本契约不预测计数，
    改为冻结 declared_search_scope，使完整性与每一条 disposition 都可事后核验。
  what_is_frozen_instead:
    - declared_search_scope
    - search_complete_definition
    - derivation_precedence
    - provenance requirements
    - output validation

# ---------------------------------------------------------------- 输出
output_schema:
  # v0.2.0：三张表，对应三层。前两张表不可混用。
  tables:
    - table: retrieval_candidates
      layer: L-RETRIEVAL
      may_be_referenced_by_disposition: false
    - table: linkage_assertions
      layer: L-ASSERTION
      may_be_referenced_by_disposition: true
    - table: pair_linkage_disposition
      layer: L-DISPOSITION

  # 第一层产物。它是检索审计记录，不是证据表。
  retrieval_candidate_row_key: candidate_id
  retrieval_candidate_columns:
    - candidate_id
    - target_input_symbol
    - queried_symbol
    - source_class
    - endpoint
    - query_expression
    - query_class_label
    - source_ref
    - source_locator
    - result_rank
    - retrieved_at
    # 这四列把「候选」与「证据」的界限写进 schema 本身。
    - record_status
    - linkage_validated
    - may_support_lock_03
    - assertion_extraction_status
  retrieval_candidate_fixed_values:
    record_status: retrieved_candidate
    linkage_validated: false
    may_support_lock_03: false
  # query_class_label 只记录该候选由哪一类查询检出，**不是** linkage_class。
  query_class_label_is_not_linkage_class: true
  assertion_extraction_status_vocabulary:
    - not_attempted
    - assertion_extracted
    - no_assertion_extractable
  # 第二层产物。只有这张表的行可以被 disposition 引用。
  assertion_row_key: assertion_id
  assertion_id_unique: true
  assertion_columns:
    - assertion_id
    - candidate_id
    - pair_id
    - target
    - clinical_context_id
    - evidence_type
    - linkage_outcome
    - target_entity_resolved
    - crc_entity_resolved
    - context_entity_resolved
    - relationship_type
    - assertion_direction
    - supporting_text_or_structured_field
    - source_section_or_field
    - extraction_method
    - extraction_confidence
    - review_status
    - linkage_class
    - crc_specific
    - context_specific
    - human_or_model
    - protein_or_rna
    - source_ref
    - source_locator
    - is_adc_efficacy_evidence
    - positive_fraction_or_prevalence
    - malignant_cell_attribution
    - retrieved_at
  assertion_forbidden_values:
    assertion_direction:
      - unknown
      - ""
  assertion_must_cite_its_candidate: true
  assertion_must_cite_its_candidate_reason: >-
    candidate_id 使每条 assertion 都能回溯到它是从哪一次检索的哪一条记录抽出的，
    审核方因此可以独立复核抽取是否成立。

  # v0.2.0 起「evidence 表」即 linkage_assertions 表，其列为 assertion_columns。
  # 既有验证规则中的「evidence 行」一律指 assertion 行。
  evidence_table_is_assertion_table: true
  evidence_table_name: linkage_assertions
  evidence_columns_alias: assertion_columns
  evidence_row_key: assertion_id
  evidence_id_unique: true
  # v0.1.0 → v0.2.0 的列改名，避免两版列名被混用。
  renamed_from_v0_1_0:
    - from: evidence_id
      to: assertion_id
    - from: evidence_direction
      to: assertion_direction
      change: 不再允许 unknown
  # 每个 pair 一行的 disposition 表。
  disposition_columns:
    - pair_id
    - target
    - clinical_context_id
    - rule_id
    - lock_03_outcome
    - disposition
    - disposition_semantics
    - resulting_state
    - evaluation_status
    - linkage_classes_hit
    - search_complete
    - search_policy_ref
    - source_coverage_ref
    - search_scope
    - searched_at
    - search_policy_version
    - provenance_kind
    - evidence_row_count
    # v0.2.0 新增：承载 L3-00 与 assertion 层完整性，使二者可逐 pair 审计。
    - identity_resolution_status
    - resolved_identifier
    - assertion_extraction_complete
    - retrieval_candidate_count
    - assertion_count
    # 三组引用，使每条 disposition 可逐条审计其依据。
    - supporting_evidence_refs
    - class_d_evidence_refs
    - other_cancer_evidence_refs
    # D 类 pair 级检索完整性的六个字段。
    - class_d_query_expression
    - class_d_executed_at
    - class_d_result_count
    - class_d_reachable
    - class_d_source_coverage_ref
    - class_d_search_complete
    - no_evidence_found_reason
    - provisional_only
    - may_advance_to_level_02
  # 每条规则必须引用什么、必须不引用什么。这是 disposition 与 evidence 之间的
  # 一对一审计关系；仅有 evidence_row_count 无法证明某条 disposition 由哪些证据支持。
  # v0.2.0：所有 refs 一律指向 linkage_assertions 表的 assertion_id，
  # 指向 retrieval_candidates 的 candidate_id 即为验证失败。
  refs_point_to: assertion_id
  refs_pointing_to_candidate_id_forbidden: true
  evidence_reference_requirements:
    - rule_id: L3-00
      supporting_evidence_refs: must_be_empty
      class_d_evidence_refs: must_be_empty
      other_cancer_evidence_refs: must_be_empty
      note: >-
        实体未消歧时，任何命中都可能是缩写碰撞，不得引用为依据；
        零命中也不得据以排除。
    - rule_id: L3-01
      supporting_evidence_refs: must_be_empty
      class_d_evidence_refs: must_be_empty
      other_cancer_evidence_refs: may_be_empty
      note: 检索或 assertion 抽取未完成时不得伪造任何 evidence refs。
    - rule_id: L3-02
      context_kind: canonical
      supporting_evidence_refs: at_least_one_of_class_a_b_or_c
      class_d_evidence_refs: may_be_empty
      other_cancer_evidence_refs: may_be_present_but_must_not_be_counted_as_linkage
    - rule_id: L3-02
      context_kind: subgroup
      supporting_evidence_refs: at_least_one_of_class_a_b_or_c
      class_d_evidence_refs: at_least_one
      other_cancer_evidence_refs: may_be_present_but_must_not_be_counted_as_linkage
    - rule_id: L3-03
      supporting_evidence_refs: at_least_one_disease_level_crc_evidence
      class_d_evidence_refs: must_be_empty
      other_cancer_evidence_refs: may_be_empty
    - rule_id: L3-04
      supporting_evidence_refs: must_be_empty
      class_d_evidence_refs: must_be_empty
      other_cancer_evidence_refs: at_least_one
      note: 其他癌种 precedent 只能出现在 other_cancer_evidence_refs，不得进入 supporting。
    - rule_id: L3-05
      supporting_evidence_refs: must_be_empty
      class_d_evidence_refs: must_be_empty
      other_cancer_evidence_refs: must_be_empty
      search_provenance: must_be_complete
  provenance_kinds:
    - source_supported
    - no_evidence_found_after_complete_search
    - search_incomplete
  # 找不到证据的 pair 不得伪造 source provenance，须记录检索 provenance。
  conditionally_required_columns:
    - when_provenance_kind: source_supported
      # 必填列所属的表。审核必须逐表检查，不得用两张表列的并集代替。
      table: evidence
      required_columns:
        - source_ref
        - source_locator
        - retrieved_at
      may_be_empty_columns:
        - no_evidence_found_reason
    - when_provenance_kind: no_evidence_found_after_complete_search
      table: disposition
      required_columns:
        - search_complete
        - search_policy_ref
        - source_coverage_ref
        - search_scope
        - searched_at
        - search_policy_version
        - no_evidence_found_reason
      may_be_empty_columns:
        - source_ref
        - source_locator
      fabricating_source_evidence_forbidden: true
    - when_provenance_kind: search_incomplete
      table: disposition
      required_columns:
        - search_complete
        - search_scope
        - searched_at
        - no_evidence_found_reason
      may_be_empty_columns:
        - source_ref
        - source_locator
      fabricating_source_evidence_forbidden: true

output_validation:
  - id: VAL-L01
    rule: disposition 表必须恰好 369 行，每行按 derivation_precedence 命中且仅命中一条规则并记录 rule_id。
  - id: VAL-L02
    rule: 每行的 lock_03_outcome、disposition、resulting_state 必须与 derivation_rules 中同一 rule_id 的声明逐项一致。
  - id: VAL-L03
    rule: >-
      RNA 来源的证据行必须 protein_or_rna = rna 且显式标注；
      任何 RNA 行都不得被引用为 LOCK-01 依据。
  - id: VAL-L04
    rule: >-
      C 类证据行必须 is_adc_efficacy_evidence = false；
      任何 C 类行被表述为 ADC 疗效证据即为验证失败。
  - id: VAL-L05
    rule: >-
      仅有其他癌种 precedent 的 pair 必须落 L3-04，其证据行 crc_specific = false，
      且不得计入 linkage_classes_hit。
  - id: VAL-L06
    rule: >-
      context 为亚群且无 D 类证据的 pair 必须落 L3-03，不得因疾病级证据而 RETAIN。
  - id: VAL-L07
    rule: >-
      L3-05 的行必须六项检索完整性字段齐备且 search_complete = true；
      其 disposition_semantics 必须为 EXCLUDE_FROM_ACTIVE_POOL，
      is_scientific_disproof 与 is_killed 必须为 false，resulting_state 必须为 reactivation-eligible。
  - id: VAL-L08
    rule: >-
      provenance_kind = no_evidence_found_after_complete_search 或 search_incomplete 的行，
      source_ref 与 source_locator 允许为空，但不得伪造；出现非空 source_ref 即为验证失败。
  - id: VAL-L09
    rule: >-
      conditionally_required_columns 声明的必填列必须存在于其所属的那张表内；
      不得用两张表列的并集代替逐表检查。
  - id: VAL-L16
    rule: >-
      每条 assertion 行必须有唯一 assertion_id；每条 disposition 行的
      supporting_evidence_refs、class_d_evidence_refs、other_cancer_evidence_refs
      引用的每个 id 都必须存在于 linkage_assertions 表，
      且所引用行的 pair_id 与该 disposition 一致。
  - id: VAL-L17
    rule: >-
      每条 disposition 必须满足 evidence_reference_requirements 中其 rule_id 与
      context_kind 对应的条目：L3-02 canonical 至少一条 A/B/C；L3-02 subgroup 另需至少一条 D；
      L3-03 须有疾病级 CRC 证据且 D refs 为空；L3-04 只能引用 other-cancer refs；
      L3-05 三组 refs 全空且检索 provenance 完整；L3-01 不得伪造任何 refs。
  - id: VAL-L18
    rule: >-
      每个 pair 必须记录 per_pair_required_class_d_search 的六个字段。
      任一 pair 的 class_d_search_complete 为 false 时该 pair 必须落 L3-01，
      不得落 L3-03 或 L3-05。
  - id: VAL-L19
    rule: >-
      target 级覆盖按 endpoint 判定：每个 source class 的 minimum_endpoint_set
      中每个 endpoint 都必须有检索记录，缺任一即该 target 的全部 pair 落 L3-01。
  - id: VAL-L20
    rule: >-
      evidence_row_count 必须等于该 pair 三组 refs 去重后的总条数，
      不得只报计数而不给 refs。
  # ---------------- v0.2.0 新增：三层结构与实体消歧的验证规则
  - id: VAL-L21
    rule: >-
      每条 assertion 行的 assertion_direction 不得为 unknown 或空。
      出现一条即为验证失败——这是 v0.1.0 未设、并因此漏掉 7,067 行的那道检查。
  - id: VAL-L22
    rule: >-
      每条 assertion 行必须同时非空：target_entity_resolved、crc_entity_resolved、
      relationship_type、assertion_direction、supporting_text_or_structured_field、
      source_section_or_field；D 类另需 context_entity_resolved 非空。
  - id: VAL-L23
    rule: >-
      supporting_evidence_refs、class_d_evidence_refs、other_cancer_evidence_refs
      引用的每个 id 都必须是 linkage_assertions 表的 assertion_id。
      任一 id 只存在于 retrieval_candidates 表即为验证失败。
  - id: VAL-L24
    rule: >-
      retrieval_candidates 表每行必须 record_status = retrieved_candidate、
      linkage_validated = false、may_support_lock_03 = false，
      且 assertion_extraction_status 取自其词表。
  - id: VAL-L25
    rule: >-
      linkage_class 必须可由该 assertion 的 relationship_type 与内容判定；
      仅凭 query_class_label 赋 linkage_class 即为验证失败。
      retrieval_candidates 表不得含 linkage_class 列。
  - id: VAL-L26
    rule: >-
      TCGA、Human Protein Atlas 与 GEO 三个 endpoint 的命中不得计入
      linkage_classes_hit，也不得作为 A 类 assertion 的唯一依据；
      但它们的检索记录仍必须齐备，缺任一仍触发 L3-01。
  - id: VAL-L27
    rule: >-
      每个 target 的 input_symbol 必须有 identity_resolution 记录。
      resolution_status 为 unresolvable_placeholder 或
      unresolvable_ambiguous_abbreviation 的 target，其全部 9 个 pair 必须落 L3-00，
      不得落 L3-02，**尤其不得落 L3-05**。
  - id: VAL-L28
    rule: >-
      ClinicalTrials.gov 来源的 B/C 类 assertion 必须记录
      required_structured_fields 的五个字段，且 target 与 indication 属于同一试验臂；
      仅有「symbol + colorectal」宽查询命中不得成为 B/C 类 assertion。
  - id: VAL-L10
    rule: 不得读取 tier_2_derived_local_databases 中的任何数据库。
  - id: VAL-L11
    rule: >-
      每个 target 的检索记录必须覆盖 per_target_required_source_classes 的每一类的
      每一个 endpoint，未达即该 target 的全部 pair 落 L3-01。
  - id: VAL-L12
    rule: 输出中不得出现任何 Gate 分数、Gate 状态、T2/T7 判定、排序、Tier 划分或实验建议。
  - id: VAL-L13
    rule: 输入轴文件的 SHA-256 必须与本契约记录一致，不一致即中止执行。
  - id: VAL-L14
    rule: 每个产物文件必须逐文件记录 SHA-256 并写入结果 PR 的 handoff。
  - id: VAL-L15
    rule: >-
      每行必须带 provisional_only 与 may_advance_to_level_02；
      在 EVGAP-01 未解除前 may_advance_to_level_02 恒为 false。

# 必须写进结果报告的约束。
mandatory_findings:
  - id: MF-L01
    finding: >-
      LOCK-03 RETAIN 只表示存在可回溯的 CRC-specific linkage 证据，
      不表示该靶点适合 ADC、不表示疗效、不表示治疗窗。
  - id: MF-L02
    finding: >-
      C 类证据（naked antibody／CAR-T／bispecific／RIT／immunotoxin／imaging）
      证明 target 在 CRC 中可接近或可干预，**不是 ADC 疗效证据**，必须在报告中原样标注。
  - id: MF-L03
    finding: >-
      本次抽取未使用任何派生本地数据库，检索完整性只在 Tier 1 声明范围内成立。
      若某个派生库日后获准入，需另开 PR 扩大范围并重跑。
  - id: MF-L04
    finding: >-
      LOCK-03 RETAIN 不使 pair 进入 Level 02。EVGAP-01 未解除前
      may_advance_to_level_02 恒为 false。
  - id: MF-L05
    finding: >-
      检索命中不是 linkage 证据。报告必须分别给出 retrieval_candidate_count 与
      assertion_count；只报候选数即冒充证据量。
  - id: MF-L06
    finding: >-
      落 L3-00 的 pair 既未被支持也未被排除。报告不得把它们与 L3-05
      合并计数，也不得表述为「无 linkage」。

