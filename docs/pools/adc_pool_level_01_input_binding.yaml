        distinct_genes: 41
      - path: target_evidence_summary.tsv
        sha256: 6426fac0c23a91ccccaa68ac4fcd13078e4535470eae5e3fbd2cdcd0256e6bb6
      - path: source_manifest.json
        sha256: 59e17e1285b25864386e2955d9a9027f9a5bf2a7843c87e566e1130274e683d3
    # 实测的关键限制，必须原样传递给执行者，不得掩盖。
