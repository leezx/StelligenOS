        rows: 41
      - path: opposing_evidence.tsv
        sha256: 99ccf54440b3ac52d7fb37feabdcd5c9608f6f608e2068433d2e3944bd214efd
      - path: source_manifest.json
        sha256: 9f7fa1a3d627172a10de7e1c3a5b652ceb3c42f42aa0c5165484d703bd15469e
      - path: run_report.md
        sha256: 2579c8f0ef95e45655a0c83b5159de7b2adade5b0b1329d76f968edd93b3944b
      - path: external_run_worklog.md
        sha256: 83f318d2b550ad2cc20e7374b7c1ff8e1e78c8c1572e92aa33c1019c5fe53442
      - path: indication_endpoint_target_pairs.tsv
        sha256: c6d9f77d8c56541129ec7d6a2dcd01a8ca74325c320152b5bd2e75671ee85c73
        used_by_level_01: false
