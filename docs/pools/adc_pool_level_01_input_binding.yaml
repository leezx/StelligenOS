# ADC Pool Level 01 输入绑定（machine-readable）
#
# 这份文件把 Level 01 的两条原始轴与 linkage 证据绑定到**已获批准的**外部产物上，
# 并冻结「来源状态 → LOCK 输出上限」的映射。它不含任何候选、证据或结果数据。
#
# 由 tests/test_adc_pool_level_01_input_binding.py 校验。
# Level 01 的判据定义见 docs/pools/adc_pool_gate_usage.yaml（PR #57，已 APPROVE）。

binding:
  binding_id: adc_pool_level_01_input_binding
  binding_version: 0.1.0
  level: "01"
  level_contract_ref: docs/pools/adc_pool_gate_usage.yaml
  status: contract_only_pending_review
  execution_status: not_authorized_not_executed
  # 本绑定不需要任何新的枚举运行。上游产物已经存在并已获批准。
  requires_new_enumeration_run: false

# 允许作为 Level 01 输入的外部产物。每一项都必须有自己的 APPROVE 记录。
