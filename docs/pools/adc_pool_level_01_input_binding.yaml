# 明确禁止作为输入的来源。
barred_sources:
  - source_id: crc_clinical_frame_and_membrane_target_screen_20260804
    run_dir: external:result/gen_iet_crc_clinical_frame_and_membrane_target_screen_20260804T191053Z
    status: UNAUTHORIZED_QUARANTINED_NOT_ACCEPTED
    related_pr: 53
    barred_content:
      - 20 个 unmet-need 场景（其中 11 个为该运行新增）
      - 45 个靶点（其中 4 个为该运行新增：GPA33、LY6G6D、TNFRSF12A、CEACAM6）
      - 全部 RETAIN/DEFER/EXCLUDE disposition 与 Tier A 选择
      - benefit ranking、endpoint 定量门槛、payload 类别结论
  - source_id: adc_seed_playbook_v0_1_20260804
    run_dir: external:result/gen_iet_adc_seed_playbook_v0.1_20260804T201605Z
    status: UNAUTHORIZED_QUARANTINED_NOT_ACCEPTED
    related_pr: 54
    barred_content:
      - Seed Admission Standard 与全部决策规则
      - 17 靶点 disposition、抗体进入条件、压力测试判定
      - 全部实验建议与架构结论

# 范围收缩，这是使用已批准来源的直接后果，必须写明而不是回避。
scope_consequences:
  raw_clinical_contexts: 9
  raw_targets: 41
  raw_enumeration_matrix_pairs: 369
  note: >-
    被隔离运行扩大到 20 场景 / 45 靶点，那部分不可用。Level 01 首次执行的范围
    因此小于该运行，这是正确结果而不是退步。

# LOCK-02：来源状态决定 outcome 上限。禁止把 derived strategy 自动升级为
# canonical clinical fact——这是 PR #28 契约自身的禁令，此处继承。
lock_02_status_ceiling:
  - source_status: canonical_c0
    calibration: calibrated
    max_outcome: validated_unmet_context
    count: 1
  - source_status: derived_strategy
    calibration: not_calibrated
    max_outcome: plausible_unmet_context
    forced_disposition: DEFER
    count: 7
  - source_status: benchmark_subgroup
    calibration: benchmark_only
    max_outcome: weak_context
    forced_disposition: DEFER
    reason: benchmark 情境用于校准，不是开发情境。
    count: 1

# LOCK-01：既有 disposition 列是分类标签，不是筛选判决，禁止当作 LOCK-01 输出。
lock_01_input_semantics:
  catalog_disposition_values:
    - benchmark
    - candidate
    - hold
  catalog_disposition_is_candidate_filter_result: false
  may_be_inherited_as_lock_01_outcome: false
  reason: >-
    这些标签由 PR #28 契约的五条最小筛选层产生，判据与 LOCK-01 不同；
    且 gate_score_status 全部为 not_scored_in_enumeration_run、
    gate_pass_status 全部为 not_assessed。LOCK-01 必须独立推导。

# LOCK-03：证据只有 target 级，没有 context 列。这决定了 pair 级 linkage 的上限。
lock_03_linkage_rules:
  evidence_dimension_used: crc_prevalence
  # 疾病级证据可支撑 canonical CRC 情境，但不能区分 8 个亚群情境。
  evidence_granularity: disease_level_not_subgroup_level
  rules:
    - id: LNK-01
      condition: crc_prevalence 单元存在且 direction=supporting，且该情境为 canonical_c0
      outcome: linkage_evidence_exists
      disposition: RETAIN
    - id: LNK-02
      condition: crc_prevalence 单元存在且 direction=supporting，但该情境为 derived 或 benchmark 亚群
      outcome: linkage_unassessed
      disposition: DEFER
      reason: 疾病级证据不能建立亚群特异 linkage。
    - id: LNK-03
      condition: crc_prevalence 单元 direction=unknown 或不存在
      outcome: linkage_unassessed
      disposition: DEFER
    - id: LNK-04
      condition: 未按 LOCK-03 规定范围完成检索
      outcome: linkage_evidence_missing
      disposition: DEFER
  # DECISION-02，明示待审核方裁决。
  machine_extracted_evidence_satisfies_existence: true
  requires_review_status_column: true
  carry_forward_constraint: >-
    linkage 证据仅为 machine_extracted_requires_human_review 的 pair 可以进入
    Level 01 active pool，但**不得晋级到 Level 02**，直到该证据通过专家复核。
  no_known_linkage_after_complete_search_available: false
  no_known_linkage_unavailable_reason: >-
    该 outcome 要求 search_complete=true 与完整检索记录。既有证据包为
    machine_extracted、且 20 个专家复核批次只完成 2 个，检索范围未闭合，
    因此本次执行不得输出该 outcome。

# 本绑定授权什么、不授权什么。
authorises:
  - 按本绑定执行 Level 01 一次，产出 docs/pools/adc_pool_gate_usage.yaml 规定的五份产物。
not_authorised:
  - 任何新的 clinical context 或 target 枚举
  - 任何靶点筛选排序、Tier 划分、资产推荐或实验建议
  - 任何 Gate 执行或 Gate 评分
  - endpoint 锁定或定量门槛
  - Level 02 与 Level 03
  - 把被隔离运行的任何产物重新引入

output_validation:
  inherits_from: docs/pools/adc_pool_gate_usage.yaml
  additional_rules:
    - id: VAL-B01
      rule: 每个 clinical context 行必须携带 source_status 与 calibration，且 LOCK-02 outcome 不得超过 lock_02_status_ceiling 规定的上限。
    - id: VAL-B02
      rule: 每个 pair 行必须携带 linkage_evidence_review_status；仅 machine_extracted 的行必须同时标记不得晋级 Level 02。
    - id: VAL-B03
      rule: 输出中不得出现 no_known_linkage_after_complete_search。
    - id: VAL-B04
      rule: raw_enumeration_matrix 必须恰好 369 行（9 x 41）。
    - id: VAL-B05
      rule: 每个输入文件的 SHA-256 必须与本绑定记录一致，不一致即中止执行。
    - id: VAL-B06
      rule: 输出中不得出现任何被隔离运行独有的场景 ID 或靶点（GPA33、LY6G6D、TNFRSF12A、CEACAM6）。
