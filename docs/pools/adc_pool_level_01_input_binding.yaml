  - source_id: crc_target_evidence_20260801
    run_dir: external:result/gen_iet_crc_target_evidence_20260801T2235EDT
    authorising_pr: 31
    authorising_record: logs/chatgpt-review-2026-08-02-crc-target-evidence-results-final.md
