scoping_decisions:  # ChatGPT AI审核方案, before code, 8 decisions
  E3-1: next Gate = TGT-05, order unchanged; machine identity TGT-05@1.0 / ADC_TARGET_GATESET@1.0 / L04 / INST-CRC-REFRACTORY-ADC-TARGET-v1 / MOD-TGT05 / module_version 0.0.0; PR D TGT-05 scientific contract unchanged
  E3-2: strictly design-only -- contract + drawing + 17-item checklist + validation/parity tests + manifest/handoff/worklog; forbidden -- implementation / provider / adapter / runner / network / external data / runtime EvidencePackage or proposal / numeric scoring / new ladder semantics; NO generic GateModule framework, abstract base class, or MOD-TGT01 refactor
  E3-3: 17-item template reused from the approved E1 template (validated by PR E2); provenance not_claimed_verbatim_from_blueprint; items 03/05/07/08 bound to the frozen PR D TGT-05 contract by a normalized-equality parity test
  E3-4: TGT-05 frozen as a one-way liability detector, never a safety predictor; Direction describes the evidence relative to the Gate question, not candidate desirability; NEGATIVE is essentially unreachable on the public path (a "no risk seen" negative is forbidden); the module never flips Direction; HOLD/KILL is the GateSet Decision policy's job
  E3-5: fatal semantics separate single-product toxicity (DIRECT liability, not fatal) from target-intrinsic convergence (>= 2 materially distinct same-target ADC constructs with convergent target-mediated normal-tissue toxicity); every clinical ADC toxicity observation carries an auditable construct fingerprint + observed-severity-for-this-product + target-attribution basis; "materially distinct" and "truly target-mediated" stay human-review calls; no numeric severity score; no Candidate-level KILL
  E3-6: source plan separates liability evidence from vital-organ coverage completeness; DIRECT/INDIRECT_STRONG/WEAK source classes per PR D with hard locks (RNA-only != protein; whole-tissue protein != cell-surface accessibility; non-ADC severity != ADC; negative atlas != safety); a CNS/cardiac/hepatic/pulmonary/hematopoietic/GI coverage map; NO universal threshold (organ count / TPM / IHC score / severity grade); PUBLIC_ONLY path only
  E3-7: asymmetric fatal-sweep-mandatory stop rule -- Path A (potential fatal pattern -> PUBLIC_FATAL_SIGNAL_ESTABLISHED, stop chasing weaker evidence, hand off); Path B (one DIRECT ADC toxicity -> complete the same-target ADC construct inventory + toxicity/attribution sweep before any stop); Path C (no DIRECT clinical liability -> complete the vital-organ / non-ADC / NHP / RNA-only sweeps; unresolvable -> EXPERIMENT_REQUIRED); absence of public risk evidence is not a stop condition for safety
  E3-8: freeze (not re-copy) the PR E2 runtime genes for items 10-17 -- single authoritative canonical target identity, canonical SourceIndex provenance authority, Gate-neutral atomic EvidencePackage, exact canonical EP reuse (never recreate by old id), classification-driving semantic parity on reuse, non-canonical proposal envelope, human approval -> canonical CandidateGateAssessment, hard identity/provenance failure -> machine reject, UNKNOWN != integrity failure, no Decision / KILL / persistence / numeric score

