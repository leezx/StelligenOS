seven_key_freeze_points:  # ChatGPT AI审核方案 closing summary -- frozen in the contract
  - "1. Option A -- a qualifying INDIRECT_STRONG addressability landscape propagates to POSITIVE / INDIRECT_STRONG; TGT-06 is NOT a TGT-04-style single-tier gate."
  - "2. Legal Direction x Strength pairs are strictly SIX (POSITIVE/DIRECT, POSITIVE/INDIRECT_STRONG, NEGATIVE/DIRECT, CONFLICTING/DIRECT, INCONCLUSIVE/DIRECT, INCONCLUSIVE/UNKNOWN), not eight."
  - "3. Exactly one independent DIRECT-quality failure configuration with no productive DIRECT -> INCONCLUSIVE / DIRECT, never NEGATIVE (PR D forbidden_inference)."
  - "4. NEGATIVE / DIRECT and potential fatal both require multiple independent antibody / epitope configurations."
  - "5. Route A must ITSELF be a declared multi-configuration analysis (>= 2 unique configuration ids) -- one configuration's reproducibility cannot bypass the frozen PR D 'multiple independent configurations'."
  - "6. WELL_MATCHED_CRC_MODEL CAN contribute to fatal (unlike TGT-04); BUT any qualifying productive DIRECT existence proof cancels the target-wide surface-static machine fatal trigger."
  - "7. Completion does NOT build qualifying_indirect_configuration_ids; DIRECT integrated evidence is never assembled from different observations / configurations."

three_headline_conclusions:
  - Internalization is configuration-specific, not a target-intrinsic constant. One qualifying disease-relevant antibody / epitope configuration with productive antibody-induced internalization and lysosomal delivery is sufficient DIRECT existence proof for addressability; failure of one configuration is only configuration-level opposing evidence and can never establish target-wide non-internalization.
  - DIRECT productive-addressability authority requires an auditable integrated observation tying antibody-induced internalization and lysosomal delivery to the same antibody / epitope configuration in a disease-relevant context. Surface localization, receptor-family inference, constitutive endocytosis, internalization without confirmed lysosomal delivery, non-CRC internalization and successful same-target ADC precedent remain lower-ceiling evidence and may not be combined across unrelated observations or configurations to synthesize DIRECT.
  - A target-wide surface-static potential fatal pattern requires productive-internalization / trafficking failure across multiple independent qualified antibody / epitope configurations and no qualifying productive DIRECT existence proof in the completed landscape. The machine may surface only POTENTIAL_FATAL_PATTERN; it never decides fatality, ADC efficacy, KILL, HOLD or a Candidate-level Decision.

