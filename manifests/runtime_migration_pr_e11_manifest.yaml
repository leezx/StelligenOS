four_key_scoping_corrections:  # ChatGPT AI审核方案 -- frozen in the contract (first two most important)
  - "1. Localization-only must resolve to INCONCLUSIVE / UNKNOWN, NOT INCONCLUSIVE / INDIRECT_STRONG -- TGT-04 is a two-tier evidence architecture with a single-tier grading authority; INDIRECT_STRONG never propagates to a Gate-level proposed Strength. legal Direction x Strength pairs = exactly {POSITIVE/DIRECT, NEGATIVE/DIRECT, CONFLICTING/DIRECT, INCONCLUSIVE/DIRECT, INCONCLUSIVE/UNKNOWN}."
  - "2. Do NOT overload one status to carry both measurement validity and density direction -- three SEPARATE typed fields: measurement_validation_status {QUALIFIED, NOT_ESTABLISHED} (does this measurement qualify for DIRECT); density_plausibility_status {PLAUSIBLY_ADEQUATE, NOT_PLAUSIBLY_ADEQUATE, MIXED_OR_UNRESOLVED, NOT_ESTABLISHED} (an upstream-qualified interpretation, never computed from a number); surface_antigen_level {QUANTITATIVELY_PRESENT, LOW_BUT_PRESENT, NEGLIGIBLE_OR_UNDETECTABLE, MIXED_OR_UNRESOLVED, NOT_ESTABLISHED} (frozen separately for the fatal path). LOW_BUT_PRESENT is never silently equated with NOT_PLAUSIBLY_ADEQUATE."
  - "3. Raw quantitative density values / units ARE admissible factual evidence (reported_density_value / reported_density_unit / reported_density_summary) -- what is forbidden is the Module comparing them to ANY threshold, cutoff or invented 'clinically effective range'. There is no reliable cross-target universal ADC-effective density range."
  - "4. Fatal Route A / Route B mirror TGT-03; the local identity is named surface_context_id(s); Route B is convergent NEGLIGIBLE_OR_UNDETECTABLE across at least two independent qualified surface_context identities -- a deterministic SUFFICIENT convergence pattern, NOT the word-meaning of 'reproducible' and NOT '> 2'."

three_headline_conclusions:
  - Surface localization is not antigen density. INDIRECT_STRONG localization evidence may establish that the antigen is on the membrane, but only quantitative DIRECT evidence can answer the TGT-04 density-plausibility question.
  - Quantitative values are evidence, not thresholds. MOD-TGT04 may preserve measured antigen-density values and units, but it never derives a universal ADC-effective density cutoff; density plausibility must arrive as an auditable upstream qualification.
  - Reproducible quantitative NEGLIGIBLE_OR_UNDETECTABLE surface antigen may surface only POTENTIAL_FATAL_PATTERN; low-but-present antigen is not automatically negative or fatal, and the Module never decides fatality or ADC efficacy.

