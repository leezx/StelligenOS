seven_required_tightenings:  # ChatGPT AI审核方案 closing summary -- frozen verbatim in the contract
  - "1. Option A: positive INDIRECT_STRONG propagates; exactly 6 legal Direction x Strength pairs; there is NO NEGATIVE / INDIRECT_STRONG."
  - "2. A below-detection / below-quantitation-limit soluble-antigen quantitation is CONTEXTUAL -- not a positive INDIRECT_STRONG and not a NEGATIVE; a new CLOSED circulating_soluble_target_status typed enum {QUANTIFIED_PRESENT, BELOW_DETECTION_OR_QUANTITATION_LIMIT, MIXED_OR_UNRESOLVED, NOT_ESTABLISHED} carries this."
  - "3. A canonical NEGATIVE / DIRECT is produced ONLY by a qualified SOLUBLE_ANTIGEN_TMDD_ANALYSIS with exposure_scenario_class == INTENDED_ADC_EXPOSURE and sink_materiality_outcome == NO_MATERIAL_SOLUBLE_SINK; 'some same-target therapeutic did not see a sink' can never directly produce NEGATIVE / DIRECT."
  - "4. Fatal does NOT use a TGT-06-style Route A / Route B convergence -- one qualifying DIRECT observation whose sink_materiality_outcome == MATERIAL_SOLUBLE_SINK_WITH_CLINICAL_EXPOSURE_COMPROMISE and that satisfies the clinical source path OR the TMDD source path triggers POTENTIAL_FATAL_PATTERN; clinical and TMDD are two alternative source paths, not two convergence routes; no extra reproducibility beyond the clinical path's own per-observation reproducibility_status == QUALIFIED gate (no independent-replication / cross-study convergence requirement); there is NO global cancellation precondition (the fatal signal is a strict subset of POSITIVE / DIRECT)."
  - "5. Introduce a lightweight single-string sink_exposure_context_id (with sink_exposure_context_basis), REQUIRED on a qualifying DIRECT observation only; same-context material-vs-no-material only is CONFLICTING; NO TGT-06 declared_multi / IDENTIFIED_MULTI / third-state machinery and NO set-projection helper."
  - "6. TMDD / clinical DIRECT and fatal authority is carried by typed statuses -- tmdd_input_adequacy_status, same_target_therapeutic_match_status, soluble_antigen_attribution_status, analysis_validation_status, exposure_scenario_class -- and E16 must NEVER semantic-parse prose to obtain DIRECT or fatal authority."
  - "7. SolubleAntigenEvidenceCompletion keeps exactly FOUR search-completion axes (soluble_antigen_quantitation_search_complete / sheddase_processing_search_complete / secreted_isoform_search_complete / same_target_pk_pd_or_tmdd_search_complete) and NO qualifying_indirect_evidence_context_ids set; soluble_antigen_quantitation_search_complete is true iff BOTH the CRC-patient and the healthy-donor serum / plasma search subspaces are done; the fourth axis explicitly covers clinical PK / PD and target-mediated-disposition analyses."

three_headline_conclusions:
  - A measurable soluble form is not the same thing as a material antigen sink. Quantified circulating soluble target, documented sheddase processing or a validated secreted isoform may support the presence of a soluble-antigen sink-liability class at INDIRECT_STRONG, but materiality requires DIRECT evidence from a documented same-target PK / PD sink effect or a qualified quantitative TMDD analysis; a concentration value, including a low or below-assay-limit value, is never converted by the Module into a universal material-sink threshold.
  - Soluble-antigen materiality is exposure-context dependent. DIRECT observations are bound to an auditable local sink-exposure context; one clean DIRECT material-sink context is sufficient for POSITIVE / DIRECT, while a canonical NEGATIVE / DIRECT requires a qualified intended-ADC TMDD analysis demonstrating no material soluble sink. Opposite DIRECT conclusions are CONFLICTING only when they refer to the same sink-exposure context; the machine has no conflict resolver in v1.
  - The TGT-07 potential-fatal signal is a strict subset of POSITIVE / DIRECT, not a convergence rule. One qualifying DIRECT observation may surface POTENTIAL_FATAL_PATTERN when soluble antigen is documented or quantitatively modelled to materially compromise the clinically achievable exposure of a target-directed antibody. Clinical and TMDD evidence are alternative qualified source paths; the machine never decides fatality, KILL, HOLD, therapeutic efficacy or the Candidate-level consequence.

