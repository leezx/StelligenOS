six_required_implementation_tightenings:  # ChatGPT AI审核方案 -- frozen in the code
  T1_indirect_strong_is_outcome_aware: >-
    a FAILS_PRODUCTIVE_INTERNALIZATION_OR_TRAFFICKING outcome is NEVER a positive
    INDIRECT_STRONG; a non-CRC / partial-evidence observation qualifies as
    positive INDIRECT_STRONG only when the typed outcome
    (PRODUCTIVE_INTERNALIZATION_WITH_LYSOSOMAL_DELIVERY or
    INTERNALIZATION_OBSERVED_LYSOSOMAL_DELIVERY_UNRESOLVED) actually establishes
    internalization support. An ANTIBODY_CONFIGURATION_INTERNALIZATION_ONLY
    observation that also claims
    PRODUCTIVE_INTERNALIZATION_WITH_LYSOSOMAL_DELIVERY is a HARD typed-fact
    incoherence (contract-constructor ValueError).
  T2_single_classifier_authority: >-
    all DIRECT-quality failure -- an ANTIBODY_CONFIGURATION_INTERNALIZATION_TRAFFICKING
    failure, an ANTIBODY_CONFIGURATION_INTERNALIZATION_ONLY failure, a
    TRAFFICKING_OR_RECYCLING_ONLY failure -- is classifier-owned DIRECT +
    OPPOSES_ADDRESSABILITY; aggregate.py and fatal_review.py consume the
    classified result and never re-run an assay / context qualification engine.
  T3_configuration_id_canonicalised_at_the_provider_boundary: >-
    internalization_configuration_ids for IDENTIFIED_MULTI is a non-empty,
    de-duplicated, deterministically ordered tuple (tuple(sorted(set(...)))); the
    three-state validation is enforced in the contract constructor; a local id
    colliding with the canonical CTX-CRC-REFRACTORY-MCRC is HARD; all runtime
    identity logic calls only configuration_identity_projection.
  T4_completion_audit_is_an_exact_identity: >-
    an attempted completion carries exactly one normalized SEARCH_COMPLETION_AUDIT
    observation whose observation_id == completion.audit_observation_id AND
    exactly one emitted / reused provenance-bearing EP for that exact id;
    field-by-field snapshot parity (search_scope / sources_searched /
    landscape_as_of / four component flags / unresolved_item keys /
    qualifying_direct_configuration_ids); on a completed landscape
    qualifying_direct_configuration_ids == the UNION of the projection sets over
    every qualifying DIRECT-rung observation (productive or failure).
  T5_exact_reuse_and_dedup_parity_add_the_identity_fields: >-
    claim + antibody_identity + epitope_identity_or_region + affinity_context +
    conjugation_context join the exact reuse / true-dedup parity alongside the
    typed classification-driving fields (incl. internalization_outcome); a drift
    on any is a HARD identity integrity failure.
  T6_neutral_claim_numeric_text_is_not_a_threshold: >-
    the acceptance "no numeric threshold" check targets Module-owned text only
    (aggregation_rationale, critical unknowns, directly_supports); it never
    rejects a source-reported "65% internalized at 4 h" in the neutral claim.
    The Module forbids a Module-authored numeric internalization comparison /
    unit-normalization / scoring helper -- there is no such code and no such
    field.

frozen_proposal_evidence_role_mapping:  # ChatGPT AI审核方案 -- required behavior, no PR E13 contract text change
  POSITIVE_DIRECT: clean productive EPs -> SUPPORTING; other-configuration failures -> CONTEXTUAL (never CONTRADICTING)
  CONFLICTING_DIRECT: same-configuration productive -> SUPPORTING; same-configuration failure -> CONTRADICTING
  INCONCLUSIVE_UNKNOWN: zero evidence_refs
  key: different-configuration failures under a clean productive existence proof are CONTEXTUAL, not CONTRADICTING -- they are configuration-specific information, not a logical disproof of the existence proof

