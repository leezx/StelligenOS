scoping_decisions:  # ChatGPT AI审核方案, before code, E7-1..E7-9
  E7-1: >-
    complete construction contract, design-only; files src/contracts/gate_modules/tgt02_indication_specific_malignant_cell_coverage.yaml + docs/gate_modules/TGT-02_Indication_Specific_Malignant_Cell_Coverage.md + tests/test_tgt02_module_construction_contract.py + manifest/handoff/worklog. forbidden -- gate_modules/tgt02.../ runtime implementation, provider / adapter, GEO / HPA / CPTAC / scRNA / spatial retrieval, EvidencePackage runtime, proposal runtime, fatal detector runtime, numeric / ranking score, cohort-size / percent-positive / H-score / heterogeneity cutoff, generic GateModule framework / ABC, new dependency, external data, MOD-TGT01 / MOD-TGT05 / MOD-TGT08 refactor. MOD-TGT02 primary_module_version stays 0.0.0; MOD-TGT01 / MOD-TGT05 / MOD-TGT08 = 1.0.0; MIGRATION_PENDING remains. Module is built in PR E8, only after this contract is APPROVED.
  E7-2: >-
    17-item template inherited from E1 verbatim (validated by E2 / E4 / E6). items 03 / 05 / 07 / 08 do normalized-equality parity against the frozen PR D TGT-02 contract; item 04 does derived parity against evidence_required + the union of the ladder admissible_evidence_classes. the inference_guard is pinned verbatim: "EVGAP-02 primarily contributes TGT-02; generic CRC linkage does NOT discharge TGT-03."
  E7-3: >-
    Direction x Strength -- TGT-02 is a BIDIRECTIONAL scientific coverage gate. Direction is relative to the Gate question: POSITIVE (evidence supports malignant-cell target coverage) / NEGATIVE (evidence supports a lack of adequate malignant-cell coverage: absent, or rare and highly heterogeneous) / CONFLICTING (admissible observations make genuinely incompatible coverage claims and no auditable pattern resolves them) / INCONCLUSIVE (evidence does not resolve). DIRECT requires protein-level AND CRC AND malignant-cell attributed AND adequately-powered cohort qualification AND a completed audited cohort landscape -> POSITIVE / DIRECT (broad consistent presence), NEGATIVE / DIRECT (absent, or rare + highly heterogeneous). "rare / highly heterogeneous" is NOT computed by the Module from a percent / H-score / n -- it arrives as an auditable upstream qualification (expression_pattern in {ABSENT, RARE_HIGHLY_HETEROGENEOUS} with expression_pattern_basis in {SOURCE_REPORTED, HUMAN_REVIEWED_NORMALIZATION}); a missing / drifted basis is a HARD integrity failure. INDIRECT_STRONG = qualifying sc / spatial malignant-compartment or CRC TMA transcript+protein concordance -> POSITIVE / INDIRECT_STRONG (present) or NEGATIVE / INDIRECT_STRONG (absent / strongly non-covered); transcript-only never upgrades DIRECT and quantity never raises the ceiling. WEAK observations are admissible hypothesis / context evidence, BUT a WEAK-only public landscape -> INCONCLUSIVE / UNKNOWN, NOT INCONCLUSIVE / WEAK (TGT-02-specific -- bulk RNA does not answer the CRC x malignant-compartment x cohort-level question; PR A: INCONCLUSIVE / UNKNOWN carries zero evidence_refs, a graded INCONCLUSIVE carries CONTEXTUAL refs). graded INCONCLUSIVE = qualifying DIRECT / INDIRECT_STRONG evidence exists and the landscape is complete but coverage direction is MIXED / does not resolve. CONFLICTING is not auto-equated with real biological heterogeneity: a valid audited multi-cohort finding characterizing coverage as RARE_HIGHLY_HETEROGENEOUS is NEGATIVE, not CONFLICTING; Strength is not auto-degraded by a conflict. overall Strength = the highest qualifying frozen evidence class after the public CRC coverage search is complete -- there is NO E6-style two-axis weaker-ceiling rule (the Direct ladder itself already states protein cohort = DIRECT, sc / spatial / TMA = lower rung).
  E7-4: >-
    fatal -- machine-local fatal_review, never a direct KILL. PR D fatal = "protein-level evidence of absent, or rare and highly heterogeneous, target expression in CRC malignant cells across cohorts". the Module never emits a canonical fatal flag / KILL / HOLD / Decision. the machine at most surfaces a candidate pattern when: protein-level observations, each with CRC malignant-cell attribution, each with a QUALIFIED cohort_adequacy_status + auditable cohort_adequacy_basis, each with a negative coverage class (ABSENT / RARE_HIGHLY_HETEROGENEOUS) + auditable expression_pattern_basis, on a completed audited CRC coverage landscape, with cross-cohort support -- MORE THAN TWO independent cohort identities (or one declared multi-cohort analysis with more than two auditable cohort_ids). "across cohorts" is plural-cohorts logic, NOT a new biological threshold. human-only fatal adjudication: whether the cohort adequacy basis is convincing, whether the cohorts are genuinely independent / non-overlapping, whether the "rare and highly heterogeneous" characterisation is justified, whether assay / platform differences explain the apparent convergence, whether it satisfies the GateSet fatal policy. the machine always emits at most fatal_review status POTENTIAL_FATAL_PATTERN; never PUBLIC_FATAL_SIGNAL_ESTABLISHED. PR D fatal_gate_policy_ref is an independent GateSet-level policy reference. no numeric / percent-positive / H-score / heterogeneity threshold.
  E7-5: >-
    typed CrcCohortCoverageCompletion (PR E8 module-local frozen dataclass, NOT a seventh core object): attempted / landscape_as_of / search_scope / sources_searched / public_crc_coverage_search_complete / protein_cohort_search_complete / malignant_compartment_sc_spatial_search_complete / tma_concordance_search_complete / matched_normal_tumor_search_complete / unresolved_items / qualifying_protein_cohort_ids / qualifying_indirect_cohort_ids / audit_observation_id. NO E6-style two mandatory axes -- overall Strength = the highest qualifying frozen evidence class after the public CRC coverage search is complete. completion <-> SEARCH_COMPLETION_AUDIT snapshot parity (E6 gene) frozen for E8: search_scope / sources_searched / landscape_as_of / per-component completion states / unresolved_items / qualifying cohort ids; a missing / drifted snapshot -> HARD reject. normalized observation conceptual shape frozen in the drawing: observation_id / target_identity / context_key / landscape_as_of / observation_kind (PROTEIN_COHORT / MALIGNANT_SC_SPATIAL / TMA_TRANSCRIPT_PROTEIN_CONCORDANCE / BULK_CRC_RNA / PAN_CANCER_UNRESOLVED / MATCHED_NORMAL_TUMOR / SEARCH_COMPLETION_AUDIT) / molecular_layer (PROTEIN / TRANSCRIPT / BOTH) / assay_method / cohort_id / cohort_ids / cohort_n (raw fact, optional) / crc_specific / malignant_cell_attribution (MALIGNANT / NON_MALIGNANT / UNRESOLVED) + malignant_attribution_basis / cohort_adequacy_status (QUALIFIED / NOT_ESTABLISHED) + cohort_adequacy_basis / expression_pattern (PRESENT_CONSISTENT / ABSENT / RARE_HIGHLY_HETEROGENEOUS / MIXED_OR_UNRESOLVED) + expression_pattern_basis / source_id + source metadata + retrieved_at. the provider outputs facts only -- never a rung, a direction, or a pass / fail.
  E7-6: >-
    source-plan hard locks. DIRECT = validated CRC IHC / quantitative proteomics / validated multiplex IF in annotated malignant cells across an adequately powered CRC cohort. NEVER scRNA / spatial RNA / bulk RNA -> DIRECT; NEVER protein without malignant attribution -> DIRECT. INDIRECT_STRONG = scRNA / spatial RNA + malignant compartment resolved, or CRC TMA transcript+protein concordance + malignant-cell attribution. WEAK = bulk CRC RNA without malignant deconvolution, or pan-cancer dataset unresolved to CRC. compartment hard lock: stromal / immune / unresolved mixed-tissue expression != CRC malignant-cell expression (may be a contextual observation, does NOT discharge TGT-02). transcript != protein (prominent): transcript can support malignant-compartment expression but cannot establish protein-level malignant-cell coverage; quantity (many strong datasets) does NOT raise the class ceiling. matched normal-vs-tumor is in PR D evidence_required but must NOT be misused as "normal low + tumor high -> favorable therapeutic index" -- in TGT-02 it only contextualises CRC malignant-cell expression (TGT-05 owns normal-tissue liability). PUBLIC_ONLY path.
  E7-7: >-
    stop rule + EXPERIMENT_REQUIRED. while the target-specific CRC coverage search has started but a mandatory declared component is not complete -> INCONCLUSIVE / UNKNOWN; do not grade early on a pretty intermediate result (that is what the completion state is for). public search complete -> strongest qualifying evidence: DIRECT directional (POSITIVE / NEGATIVE / CONFLICTING / graded INCONCLUSIVE DIRECT), else INDIRECT_STRONG directional, else INCONCLUSIVE / UNKNOWN; WEAK-only still UNKNOWN. TGT-02 can and should use EXPERIMENT_REQUIRED, but only when the enumerated public CRC coverage source space is completed / exhausted AND the unresolved Gate question requires a NEW malignant-cell-resolved protein / adequately powered cohort measurement (e.g. public sc / spatial consistently supports malignant-cell expression but no adequate protein cohort exists -> POSITIVE / INDIRECT_STRONG + critical_unknown "protein-level malignant-cell cohort confirmation" = EXPERIMENT_REQUIRED; only bulk RNA + exhausted source space -> INCONCLUSIVE / UNKNOWN + EXPERIMENT_REQUIRED). a known-but-unfetched public dataset, or an incomplete public cohort search, is PUBLIC_RESOLVABLE; an existing source whose access / annotation currently prevents resolution is CURRENTLY_UNRESOLVABLE. once EXPERIMENT_REQUIRED is reached the public Module stops chasing weaker proxy evidence. a potential-fatal trigger may stop the chase for weaker bulk / pan-cancer proxy evidence AFTER the necessary cohort coverage completeness is satisfied -- the Module never stops on the first negative cohort.
  E7-8: >-
    items 10-17 directly inherit the E2 / E4 / E6 runtime genes. Item 10 -- instantiation pins, context / version, Gate / GateSet version, PUBLIC_ONLY, run_id / code_commit, landscape_as_of, declared CRC coverage search scope, existing evidence ids; no second drift-prone target argument; no implicit default context. Item 11 -- atomic Gate-neutral immutable-by-ID EvidencePackage, one observation -> one EP, canonical SourceIndex provenance, exact canonical reuse; an EP may state a neutral empirical fact, never "passes TGT-02 / has adequate coverage / is fatal / should be killed"; a SEARCH_COMPLETION_AUDIT EP carries a structured completion snapshot; a missing / drifted classification / snapshot field on reuse -> HARD integrity failure. Item 12 -- non-canonical proposal envelope (no assessment_id / assessment_version / review); fatal_review is a separate module-local record on the run result (required / status POTENTIAL_FATAL_PATTERN / evidence_ids / cohort_ids / coverage_class / basis refs / landscape_as_of / crc_coverage_search_scope), actionable only on an accepted run. Item 13 -- machine acceptance: identity / source / EP reuse / completion-audit snapshot parity; only frozen classes; transcript never above INDIRECT_STRONG; protein without malignant attribution never DIRECT; every QUALIFIED / negative-coverage class has an auditable basis; the mandatory CRC coverage landscape is complete (no early one-cohort grade); Direction x Strength == the item-06 truth table; WEAK-only -> INCONCLUSIVE / UNKNOWN with zero evidence_refs; fatal_review at most POTENTIAL_FATAL_PATTERN and not a proposal field; no numeric / ranking score, no cohort-size / percent-positive / H-score / heterogeneity threshold; no TGT-03 / TGT-04 / TGT-05 conclusion; no PUBLIC_FATAL_SIGNAL_ESTABLISHED / KILL / HOLD / Decision. a HARD identity / provenance / completion-consistency / classification-qualification failure rejects the WHOLE run -- never degraded to an accepted UNKNOWN; UNKNOWN from a genuinely incomplete public CRC coverage search is NOT an integrity failure. Item 14 -- human review surface + human-only judgements (cohort adequacy, malignant-cell attribution convincingness, rare-highly-heterogeneous justification, cohort independence, fatal-policy satisfaction). Item 15 -- weak-only bulk / pan-cancer -> UNKNOWN; incomplete search -> UNKNOWN; high-quality nondirectional -> graded INCONCLUSIVE; incompatible claims -> CONFLICTING; qualified rare-highly-heterogeneous multi-cohort -> NEGATIVE, not automatically CONFLICTING. Item 16 -- the E7-7 completion-before-grade stop rule. Item 17 -- two routes: HUMAN_APPROVED CandidateGateAssessment -> MatrixView / ADC_TARGET_GATESET decision layer / TGT-03 as context only (never via generic CRC linkage), and the module-local fatal_review -> human Gate review / GateSet fatal policy; forbidden -- fatal_review -> Module KILL.
  E7-9: >-
    synthetic construction acceptance tests, fixtures TARGET_A / CRC_COHORT_A / CRC_COHORT_B / CRC_COHORT_C / STROMA / IMMUNE, no real target or dataset. E7 ships parity / shape / boundary tests over the frozen contract + drawing (the ~40 synthetic run-level scenarios listed in the ruling are for PR E8's implementation acceptance suite). PR E7 test set: 17-item checklist completeness + E1-template reuse; items 03 / 05 / 07 / 08 normalized-equality parity + item 04 derived parity + inference_guard verbatim vs the frozen PR D TGT-02 contract; bidirectional Direction -- NEGATIVE reachable as a genuine scientific finding, never a fatal flag / KILL; "rare / highly heterogeneous" upstream-qualified never computed; WEAK-only -> INCONCLUSIVE / UNKNOWN (never INCONCLUSIVE / WEAK); graded INCONCLUSIVE vs UNKNOWN distinct; CONFLICTING not auto-equated with heterogeneity; transcript never becomes protein; fatal machine output at most POTENTIAL_FATAL_PATTERN, "across cohorts" = plural-cohorts logic; CrcCohortCoverageCompletion + no E6-style two-axis rule; source hard locks; EXPERIMENT_REQUIRED narrow; E2 / E4 / E6 gene inheritance for items 10-17; no implementation package; MOD-TGT02 binding still 0.0.0; MOD-TGT01 / MOD-TGT05 / MOD-TGT08 untouched; MIGRATION_PENDING remains; drawing covers all 17 items.

three_headline_conclusions:
  - TGT-02 NEGATIVE is reachable and a genuine SCIENTIFIC NEGATIVE -- "current admissible evidence shows refractory-mCRC malignant cells lack adequate population-level target expression coverage". It is NOT TGT-08's commercial NEGATIVE and NOT TGT-05's inverted liability.
  - NEGATIVE != fatal != KILL. NEGATIVE / DIRECT can occur, but only a cross-cohort protein-level pattern meeting the PR D fatal condition enters a machine-local fatal_review = POTENTIAL_FATAL_PATTERN. The Module never emits a canonical fatal flag / KILL; the GateSet fatal policy decides the Candidate-level consequence.
  - TGT-02 needs a typed CrcCohortCoverageCompletion (E6-style gene, different science): only a completed / audited CRC coverage search aggregates single observations into a cohort-level Gate judgement -- one pretty cohort is never a population-level answer.

