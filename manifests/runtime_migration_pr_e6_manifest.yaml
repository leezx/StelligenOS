    TGT-01 through TGT-07 -> the strategic materiality / "dominant" / "well protected" judgement ->
    the sponsor routing / capital-allocation decision -> human CandidateGateAssessment approval ->
    GateSet Decision / KILL / STOP_FOR_SPONSOR / OUT_OF_MANDATE

