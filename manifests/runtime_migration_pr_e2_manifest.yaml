scoping_decisions:  # ChatGPT AI审核方案, before code, 8 decisions
  E2-1: real deterministic MOD-TGT01 implementation (not a skeleton); module_version 1.0.0; no CLI / crawler / DB / background job / review UI
  E2-2: no source-specific live provider inside the module; one normalized Tgt01PrecedentProviderPort; failure_attribution=TARGET_MEDIATED only from an explicit primary-source disclosure, never NLP-inferred
  E2-3: ADCdb stays a discovery / entity-resolution / index layer behind the port; an unresolved database-only row is a retrieval lead, never rung-establishing
  E2-4: all output is an in-memory Tgt01ModuleRunResult; zero repository persistence; ids from an injected allocator, never derived from the filesystem
  E2-5: deterministic Direction x Strength, strict E1 semantics, no score, no fourth ladder; adverse pattern only when frozen item 08 is met (>= 2 independent same-target programs, consistent target-mediated failure); a single failed ADC is never NEGATIVE / fatal
  E2-6: the stop rule is a machine-enforced prerequisite -- same_target_program_inventory_complete AND failure_reason_sweep_complete must both be true before any acceptable proposal, even when a DIRECT positive precedent has already been found
  E2-7: one narrow repository-policy reconciliation -- allow top-level gate_modules/ source code; keep live retrieval / execution / persistence forbidden; raise TGT-01 primary_module_version 0.0.0 -> 1.0.0; the E1 construction-contract body and all TGT-01..08 Gate science stay untouched
  E2-8: CI runs synthetic / in-memory acceptance cases only -- no internet, no real ADC data, synthetic TARGET_A / PROGRAM_A

owns_boundary_one_liner:
  pr_e2_owns: normalized evidence -> Gate-specific scientific interpretation -> EvidencePackages -> assessment proposal envelope
  pr_e2_does_not_own: web retrieval -> database / cache -> source registry persistence -> human approval -> canonical persistence

