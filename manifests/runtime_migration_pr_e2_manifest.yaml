review_round_1:
  verdict: REQUEST_CHANGES
  reviewed_tip: "57d0c99"
  outer_architecture: PASS  # scope / no-live-provider / no-persistence / gate_modules one-way dependency / narrow policy reconciliation all accepted
  scope: 4 E2 deterministic-core correctness blockers; no architecture redesign; E2-1..E2-8 scope, Gate id/question, frozen ladder, allowed/forbidden inference, UNKNOWN semantics, repository layout, MIGRATION_PENDING and the 1.0.0 governance direction all unchanged
  fixes:
    blocker_1_candidate_target_identity_binding: >-
      Tgt01ModuleInput now carries the candidate's canonical target_identity as
      the single authoritative source; run() no longer takes a separate
      target_identity argument. NormalizedPrecedentRecord carries the ADC
      program's actual program_target_identity plus, for ADJACENT_TARGET, a
      mandatory auditable adjacency_basis. classify_record rejects a SAME_TARGET
      record whose program targets a different antigen (evidence misbinding) and
      a mislabelled adjacency. The EvidencePackage study_context retains
      program_target_identity / target_relation / adjacency_basis so a human can
      re-do the same/adjacent call (E1 item 14).
    blocker_2_frozen_item_08_both_branches: >-
      FAILURE_ATTRIBUTION_VALUES now expresses both frozen branches
      (TARGET_MEDIATED_TOXICITY, INTRINSIC_THERAPEUTIC_WINDOW) alongside
      CONSTRUCT_SPECIFIC / NON_TARGET / UNDISCLOSED, still primary-source only.
      aggregate() forms an adverse pattern only when >= 2 independent same-target
      programs failed for the SAME frozen class; a mix of different classes is
      not a consistent pattern; a single failure is never fatal.
    blocker_3_reusable_gate_neutral_evidence: >-
      New ExistingEvidenceLibraryPort -- an observation already in the PR C
      Evidence Library is reused by evidence_id, never re-created; a new id is
      allocated only for a novel observation. New SourceResolverPort resolves a
      source_id to its canonical SourceIndex record and the EvidencePackage
      provenance carries that canonical metadata; a provider record whose
      metadata disagrees is rejected. The EvidencePackage is Gate-NEUTRAL --
      observation-level directly_supports / does_not_support / limitations and a
      neutral observation-level evidence_ceiling; the TGT-01 ceiling, allowed /
      forbidden inference and Direction x Strength live only on the proposal.
    blocker_4_one_package_per_observation: >-
      build_evidence_packages returns a list of EmittedEvidence (one admissible
      observation -> one EvidencePackage), never a program_id-keyed dict. A
      program with two distinct primary-source observations gets two packages
      and two correct evidence_refs; program_id is used only to count
      independent programs for the fatal-pattern threshold. A same-program
      duplicate (source_id, claim) is cleanly dropped.
  tests_at_round_1: 44
  full_suite_at_round_1: 818
review_round_2:
  verdict: REQUEST_CHANGES
  reviewed_tip: "decaec7"
  round_1_status: blockers 1 / 2 / 4 confirmed closed; blocker 3 half closed
  scope: 2 remaining deterministic-core issues, both under blocker 3; E2-1..E2-8, Gate science, repository layout, MIGRATION_PENDING and the 1.0.0 direction all unchanged
  fixes:
    blocker_3a_true_canonical_ep_reuse: >-
      ExistingEvidenceLibraryPort.resolve now returns the EXACT canonical
      EvidencePackage (not just an id). When it resolves, the module reuses that
      package unchanged -- no allocator call, no new EvidencePackage body -- and
      the run result references it by id only (evidence_packages holds
      newly-created bodies only; reused_evidence_ids names the referenced ones).
      A returned package whose provenance.source_id / claim / candidate_refs are
      incompatible with the current observation is a HARD integrity failure, not
      a silent reuse. Regressions: allocator not called on reuse; no re-created
      body; incompatible canonical EP rejects the run.
    blocker_3b_hard_integrity_failure_rejects_the_run: >-
      A candidate<->program antigen misbinding, a source the provider claimed
      resolved but missing from the canonical SourceIndex, a canonical-source
      metadata conflict, or an incompatible canonical EvidencePackage is now a
      HARD failure carried on Tgt01ModuleRunResult.hard_integrity_failures;
      acceptance.evaluate enforces len(hard) == 0, so the run is machine
      REJECTED (proposal_envelope = None) -- E1 item 13 on_failure -- never
      washed into an accepted UNKNOWN. A legitimate "no evidence" outcome
      (no precedent, an unresolved ADCdb-only retrieval lead, an exhausted
      source space) stays a SOFT drop and can still produce an accepted UNKNOWN.
      Regressions: misbinding / missing source / metadata mismatch / incompatible
      canonical EP each reject the run; an unresolved ADCdb-only lead does not.
  tests_at_round_2: 45
  full_suite_at_round_2: 819
review_round_3:
  verdict: REQUEST_CHANGES
  reviewed_tip: "1be6bb2"
  round_2_status: 3b (hard integrity -> machine reject) and the exact-canonical-EP-reuse body both confirmed closed
  scope: 1 narrow blocker -- reused canonical EP <-> current normalized observation classification-driving semantic parity; nothing else changed
  fix:
    reused_ep_classification_parity: >-
      _reused_package_is_compatible now also verifies every observation field
      that drives TGT-01 classification -- program_target_identity,
      target_relation, adjacency_basis, program_stage, program_status,
      clinical_activity_disclosed, failure_attribution -- against the canonical
      package's study_context; a drift on any of them is a HARD integrity
      failure (the immutable canonical EP no longer backs the Strength /
      Direction the module would compute). A newly-created EP's study_context
      now also carries clinical_activity_disclosed so a later reuse can compare
      it. Regressions: canonical PHASE_1 + current APPROVED -> HARD reject (never
      DIRECT); canonical SAME_TARGET/TARGET_A + current ADJACENT/TARGET_B -> HARD
      reject; canonical construct-specific failure + current
      TARGET_MEDIATED_TOXICITY -> HARD reject (never an adverse pattern).
  tests_at_round_3: 46
  full_suite_at_round_3: 820
review_round_4:
  verdict: REQUEST_CHANGES
  reviewed_tip: "a7a91f7"
  round_3_status: the classification-parity body and the three drift regressions confirmed correct
  scope: 1 boundary condition -- a canonical EP MISSING a classification-driving field must also reject (presence + equality, not just equality-when-present)
  fix:
    require_presence_of_every_classification_driving_field: >-
      _reused_package_is_compatible now returns a "missing the
      classification-driving field" reason (HARD integrity failure) when a
      reused canonical package's study_context lacks any of the seven
      classification-driving keys -- parity cannot be verified, so the run is
      machine-rejected. Regression: a canonical EP missing
      clinical_activity_disclosed rejects the run.
  tests_at_round_4: 47
  full_suite_at_round_4: 821
