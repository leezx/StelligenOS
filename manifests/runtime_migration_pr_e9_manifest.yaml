four_mandatory_scoping_corrections:  # ChatGPT AI审核方案 -- frozen in the contract
  - "1. TRANSIENT_OR_MINOR_DOWNREGULATION is NOT fixed to CONTEXTUAL -- a qualified transient / minor down-regulation that still demonstrates retained expression SUPPORTS persistence (can contribute POSITIVE), and never contributes NEGATIVE or fatal_review; only NONDIRECTIONAL when the observation is itself ambiguous about retention."
  - "2. \"reproducible\" is established by Route A (an auditable explicit reproducibility qualification) OR Route B (convergent NEAR_LOSS_OR_MARKED_LOSS across at least two independent qualified clinical context identities). It is NOT defined by a numeric context count and Route B is NOT \"more than two\" / \"> 2\"."
  - "3. DIRECT protein measurement is an OPEN set (a protein-level clinical-context measurement + a factual assay_method type + a protein_measurement_validation_status / basis) -- validated IHC / quantitative proteomics / validated multiplex IF are admissible examples, NOT a closed three-assay whitelist."
  - "4. an EvidencePackage MAY state the empirical persistence / loss fact; only Gate-relative conclusions (passes TGT-03 / TGT-03 POSITIVE / TGT-03 NEGATIVE / adequate persistence established / meaningful target availability is lost / fatal / should be killed) are forbidden, and even a literal source Gate-relative claim is never upgraded by the Module."

three_headline_conclusions:
  - Baseline expression is not persistence. TGT-02 evidence cannot discharge TGT-03 unless the evidence source itself explicitly measures a qualified treatment / metastasis context.
  - "TGT-03 is a bidirectional scientific persistence gate: qualified clinical-context retention supports POSITIVE, qualified clinical-context near / marked loss supports NEGATIVE; NEGATIVE is not fatal and not KILL."
  - Reproducible protein-level near / marked loss may trigger only POTENTIAL_FATAL_PATTERN; reproducibility requires auditable evidence and is not defined solely by a numeric context count. The Module never decides fatality.

