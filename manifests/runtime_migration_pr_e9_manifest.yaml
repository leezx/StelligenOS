    near loss) OR Route B (convergent NEAR_LOSS_OR_MARKED_LOSS across AT LEAST TWO
    independent qualified clinical persistence context identities -- a
    deterministic SUFFICIENT convergence pattern, NOT the word-meaning definition
    of "reproducible" and NOT "more than two" / "> 2"). explicitly excluded from
    a fatal trigger -- TRANSIENT_OR_MINOR_DOWNREGULATION, transcript-only,
    resistance-model-only, a different tumor type, treatment-naive primary CRC.
    human-only -- whether the marked / near-loss qualification is justified vs a
    transient / minor effect, whether the contexts are independent, whether an
    apparent loss is an assay / platform artifact, whether the reported
    reproducibility is convincing, whether meaningful availability is actually
