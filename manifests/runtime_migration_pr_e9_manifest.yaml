  E9-3: >-
    Direction x Strength -- TGT-03 is a BIDIRECTIONAL scientific persistence gate.
    POSITIVE (qualifying evidence supports retention / persistence in the intended
    treated / refractory / metastatic CRC context) / NEGATIVE (qualifying evidence
    supports clinically contextual target loss / materially impaired persistence)
    / CONFLICTING (genuinely incompatible OVERALL persistence claims, no
    resolving context-specific characterization) / INCONCLUSIVE. NEGATIVE is a
    scientific NEGATIVE, not fatal / KILL. persistence_pattern in {RETAINED,
    NEAR_LOSS_OR_MARKED_LOSS, TRANSIENT_OR_MINOR_DOWNREGULATION,
    MIXED_OR_UNRESOLVED} is upstream-qualified (persistence_pattern_basis in
    {SOURCE_REPORTED, HUMAN_REVIEWED_NORMALIZATION}), never computed; a
    missing / drifted basis for a classification-driving pattern is HARD.
    CORRECTION 1 -- TRANSIENT_OR_MINOR_DOWNREGULATION is NOT fixed to CONTEXTUAL:
    a qualified transient / minor down-regulation that still demonstrates retained
    expression -> SUPPORTS_PERSISTENCE (can contribute POSITIVE), NEVER
    contributes NEGATIVE, NEVER contributes fatal_review, NEVER establishes
    TGT-04 density; only NONDIRECTIONAL / CONTEXTUAL when the observation is
    itself ambiguous about retention ("not sufficient for fatal" != "not
    directional"). RETAINED -> SUPPORTS_PERSISTENCE; NEAR_LOSS_OR_MARKED_LOSS ->
    OPPOSES_PERSISTENCE; MIXED_OR_UNRESOLVED -> NONDIRECTIONAL / CONTEXTUAL.
    DIRECT qualification -- protein-level + CRC + an explicitly qualified
    refractory / prior-treated OR metastatic clinical context + malignant-cell
    attribution + a QUALIFIED clinical-context adequacy status with an auditable
    basis; paired pre-/post protein is a high-information DIRECT but STILL just
    DIRECT (no SUPER_DIRECT rung); a resistance model is INDIRECT_STRONG even if
    it measures protein (the context is a model). INDIRECT_STRONG (strict PR D)
    -- treated / metastatic CRC malignant-compartment transcriptomics or a
    well-validated CRC treatment-resistance model. WEAK -- treatment-naive
    primary CRC only / different-tumor-type; WEAK-only -> INCONCLUSIVE / UNKNOWN
    with zero evidence_refs (matches PR D "Only treatment-naive primary CRC data
    -> UNKNOWN"). overall Strength = the HIGHEST qualifying frozen evidence class
    (any qualifying DIRECT -> DIRECT; else INDIRECT_STRONG; else UNKNOWN) -- NO
    E6-style two-axis weaker-ceiling rule, and the four mandatory search
    components are search-space completeness, not a four-axis score. graded
    INCONCLUSIVE vs UNKNOWN strictly distinct. CONFLICTING is not auto-equated
    with a qualified context / site / time variation -- if the source
    characterises it as context-dependent / variable, or the variation cannot
    answer overall persistence, that is a graded INCONCLUSIVE; Strength is not
    auto-degraded by a conflict. a single observation is never a Direction.
