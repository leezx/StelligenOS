seven_required_implementation_tightenings:  # ChatGPT AI审核方案 -- frozen in the code
  T1_direct_qualification_split_by_observation_kind: >-
    DIRECT qualification lives in classify.py alone and is kind-specific -- there
    is NO generic "kind in {clinical, TMDD} + sink context + analysis validation +
    method + materiality outcome" predicate. Clinical DIRECT requires
    same_target_therapeutic_match_status == QUALIFIED + basis + a non-empty ref,
    soluble_antigen_attribution_status == QUALIFIED + basis, and
    analysis_validation_status == QUALIFIED + basis + a non-empty analysis_method.
    TMDD DIRECT requires tmdd_input_adequacy_status == QUALIFIED + basis and
    analysis_validation_status == QUALIFIED + basis + a non-empty analysis_method.
  T2_mixed_is_direct_quality_contextual_not_established_is_not_direct: >-
    a MIXED_OR_UNRESOLVED sink_materiality_outcome on a DIRECT-authority kind is a
    DIRECT-quality CONTEXTUAL analysis (evidence_rung DIRECT, qualifying_direct_mixed).
    A NOT_ESTABLISHED sink_materiality_outcome is NEVER a qualifying DIRECT-rung
    observation.
  T3_aggregate_and_fatal_consume_classifier_authority: >-
    aggregate.py and fatal_review.py never re-implement DIRECT science; classify.py
    is the sole scientific qualification authority. aggregate.py consumes the
    classified DIRECT + SUPPORTS_SINK_LIABILITY / DIRECT + OPPOSES_SINK_LIABILITY /
    DIRECT + CONTEXTUAL(mixed) / INDIRECT_STRONG + SUPPORTS roles and runs the
    frozen order over sink_exposure_context_id.
  T4_quantitation_dual_subspace_executable_typed_facts: >-
    the completion adds crc_patient_quantitation_subspace_search_complete and
    healthy_donor_quantitation_subspace_search_complete typed facts (not a 5th /
    6th axis); soluble_antigen_quantitation_search_complete MUST equal their
    strict AND; the SEARCH_COMPLETION_AUDIT snapshot carries both with exact parity.
  T5_fatal_detector_is_not_a_second_direct_qualification_engine: >-
    fatal_review.py does only fatal-specific narrowing (kind + sink_materiality_outcome
    == MATERIAL_SOLUBLE_SINK_WITH_CLINICAL_EXPOSURE_COMPROMISE +
    documents_clinical_exposure_compromise + the intended-ADC-exposure narrowing
    for the TMDD path); the typed sink_materiality_outcome / exposure_scenario_class
    are the exposure-compromise authority -- no prose parsing. module.py runs the
    raw fatal candidate through acceptance BEFORE surfacing it.
  T6_exact_reuse_and_dedup_strings: >-
    claim / sink_exposure_context_id / basis strings use EXACT string
    presence-and-value equality for reuse / dedup parity -- no .strip() /
    lowercasing / whitespace normalization. The duplicate observation_id preflight
    HARD short-circuits before every side-effect / injected-port call.
  T7_migration_closeout_machine_invariant: >-
    a final regression asserts all eight built_module_versions keys are {TGT-01..TGT-08}
    at "1.0.0", every gate_binding primary_module_version is "1.0.0", and all
    eight primary-module package manifests exist with matching module_id /
    version / gate_id -- only then may the live architecture docs stop saying
    MIGRATION_PENDING. migration.deferred is not deleted; other deferred work stays.

frozen_proposal_relative_evidence_role_mapping: >-
  E15 item 12, reproduced in aggregate.py + AssessmentProposalEnvelope.
  POSITIVE / DIRECT -- a CLEAN material-sink DIRECT is SUPPORTING; an other-context
  no-material-sink DIRECT is CONTEXTUAL; conflicted-context evidence is CONTEXTUAL.
  POSITIVE / INDIRECT_STRONG -- a qualifying quantified-CRC-patient /
  sheddase-substrate / secreted-isoform observation is SUPPORTING.
  NEGATIVE / DIRECT -- the intended-ADC no-material-sink TMDD is SUPPORTING.
  CONFLICTING / DIRECT -- the same-context material-sink DIRECT is SUPPORTING and
  the same-context no-material-sink DIRECT is CONTRADICTING.
  INCONCLUSIVE / DIRECT -- the DIRECT-quality MIXED_OR_UNRESOLVED analysis is
  CONTEXTUAL. INCONCLUSIVE / UNKNOWN -- zero evidence_refs. CONTRADICTING appears
  ONLY on a CONFLICTING / DIRECT proposal.

