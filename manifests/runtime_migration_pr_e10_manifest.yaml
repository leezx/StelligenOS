scoping_decisions:  # ChatGPT AI审核方案, before code, E10-1..E10-8 (APPROVE-to-proceed, with the 5 implementation-level tightenings captured below)
  E10-1: >-
    real deterministic MOD-TGT03 implementation (like E2 / E4 / E6 / E8, a full Gate-specific scientific core). 11 files __init__ / module.yaml / contracts / ports / classify / evidence / aggregate / completion / fatal_review / acceptance / module -- completion.py and fatal_review.py are their own small files. module_version 1.0.0; ClinicalPersistenceCompletion is a frozen dataclass -- a module-local run record, NOT a seventh core object. acceptance.py executes item 13 machine acceptance + item 10 input / binding invariants + item 11 EP integrity + item 12 proposal / fatal-review structural boundary + item 16 completion-before-grade + forbids item-17 cross-Gate / Decision output; it is NOT a 17-item YAML parser (items 03-09 science lives in classify / aggregate / completion / fatal; items 14 / 17 are human / downstream). minimal binding update (TGT-03 primary_module_version 0.0.0 -> 1.0.0; built_module_versions + BUILT_MODULE_VERSIONS + gate_modules/README.md gain TGT-03; TGT-04 / TGT-06 / TGT-07 stay 0.0.0); frozen E9 contract body untouched. run() is pure Python -- no network / subprocess / filesystem-derived ids / repository writes / db / cache / retrieval adapter / LLM. src/ never imports gate_modules/.
  E10-2: >-
    one normalized Tgt03PersistenceProviderPort (the package declares its own EvidenceIdAllocatorPort / SourceResolverPort / ExistingEvidenceLibraryPort). NO normalizer inside the package -- the provider outputs NORMALIZED UPSTREAM FACTS: observation_id / target_identity / context_key / landscape_as_of / observation_kind in {REFRACTORY_OR_PRIOR_TREATED_PROTEIN, METASTATIC_LESION_PROTEIN, PAIRED_PRE_POST_PROTEIN, TREATED_METASTATIC_TRANSCRIPT, RESISTANCE_MODEL, TREATMENT_NAIVE_PRIMARY, DIFFERENT_TUMOR_TYPE, SEARCH_COMPLETION_AUDIT} / molecular_layer / assay_method (an OPEN factual type) / protein_measurement_validation_status (CLOSED {QUALIFIED, NOT_ESTABLISHED}) + basis / crc_specific / clinical_context + basis / context_adequacy_status + basis / malignant_cell_attribution + basis / persistence_pattern + basis / residual_target_presence_status + basis / reproducibility_status + basis / LOCAL persistence_context_id(s) / claim / source metadata / retrieved_at + the SEARCH_COMPLETION_AUDIT structured snapshot. the provider NEVER emits DIRECT / INDIRECT_STRONG / WEAK / SUPPORTS_PERSISTENCE / OPPOSES_PERSISTENCE / CONTEXTUAL / POSITIVE / NEGATIVE / CONFLICTING / INCONCLUSIVE / fatal / POTENTIAL_FATAL_PATTERN -- all Module-derived.
  E10-3: >-
    deterministic rung classification via a local ClassifiedPersistenceObservation {observation, evidence_rung, persistence_implication, admissible, rejection_severity, rejection_reason}. DIRECT requires a clinical protein kind (REFRACTORY_OR_PRIOR_TREATED_PROTEIN / METASTATIC_LESION_PROTEIN / PAIRED_PRE_POST_PROTEIN) + molecular_layer includes PROTEIN + protein_measurement_validation_status == QUALIFIED + auditable basis + context_adequacy_status == QUALIFIED + clinical_context_basis + basis + clinical_context matching the kind + malignant_cell_attribution == MALIGNANT + basis. assay_method is NOT a closed whitelist (E9's biggest impl difference vs TGT-02 -- assay vocabulary open, validation predicate closed). INDIRECT_STRONG -- TREATED_METASTATIC_TRANSCRIPT (treated / metastatic malignant compartment resolved) or RESISTANCE_MODEL (well-validated CRC resistance context), even when it measures protein (the ceiling is limited by the CONTEXT, not the measurement layer). WEAK -- TREATMENT_NAIVE_PRIMARY / DIFFERENT_TUMOR_TYPE, even with a pretty protein measurement (no smuggling TGT-02 baseline coverage into persistence). pattern -> implication -- RETAINED -> SUPPORTS_PERSISTENCE; NEAR_LOSS_OR_MARKED_LOSS -> OPPOSES_PERSISTENCE; TRANSIENT_OR_MINOR_DOWNREGULATION + residual_target_presence_status PRESENT -> SUPPORTS_PERSISTENCE; + UNRESOLVED -> CONTEXTUAL; MIXED_OR_UNRESOLVED -> CONTEXTUAL. the Module never parses basis prose; a single observation is NEVER a Direction.
  E10-4: >-
    deterministic aggregation with an explicit precedence -- 0. HARD integrity failure -> no proposal; 1. landscape incomplete -> INCONCLUSIVE / UNKNOWN with zero evidence_refs (a legitimate non-error state); 2. complete but audit invalid / missing -> HARD reject; 3. complete AND audited -> evaluate qualifying evidence. Strength = if any qualifying DIRECT: DIRECT; elif any qualifying INDIRECT_STRONG: INDIRECT_STRONG; else UNKNOWN -- NO four-axis score, NO weaker-axis rule. the four mandatory components stay FLAT booleans (refractory_prior_treated / metastatic_lesion / paired_pre_post / resistance_model search complete) -- no dedicated typed sub-record (E9 froze exact field names + the audit snapshot needs per-field parity). conflict rule (narrow) -- material SUPPORTS + material OPPOSES -> CONFLICTING, UNLESS an admissible declared multi-context observation with persistence_context_ids covering the relevant contexts and persistence_pattern == MIXED_OR_UNRESOLVED is an explicit cross-context characterisation -> graded INCONCLUSIVE. never semantic-parse source prose to decide if a conflict is "explained". a WEAK-only completed landscape -> INCONCLUSIVE / UNKNOWN, never INCONCLUSIVE / WEAK.
  E10-5: >-
    one module-local typed ClinicalPersistenceCompletion (frozen dataclass in completion.py; NOT a seventh core object) with three HARD invariants. (1) completeness consistency -- public_persistence_search_complete MUST equal all(four flat component booleans); a contradiction rejects the whole run (never a soft UNKNOWN). (2) audit presence + snapshot parity -- an attempted completion MUST be certified by EXACTLY ONE SEARCH_COMPLETION_AUDIT observation whose observation_id == audit_observation_id and whose structured snapshot (search_scope / sources_searched / landscape_as_of / the four per-component states / unresolved_item keys / qualifying_direct_persistence_context_ids / qualifying_indirect_persistence_context_ids) matches the typed completion field-for-field -- the snapshot field names ARE the typed completion's field names; no audit, two audits, drift, or a dedup-lost audit EP is a HARD reject; the snapshot fields also enter the audit EP exact-reuse parity. (3) qualifying persistence-context-set parity -- qualifying_direct_persistence_context_ids / qualifying_indirect_persistence_context_ids MUST equal (as sets) the LOCAL persistence-context identities of the observations classified qualifying DIRECT / qualifying INDIRECT_STRONG (evaluated only over a completed landscape). unresolved_items is a small typed PersistenceUnresolvedItem(description, kind) with kind in {KNOWN_PUBLIC_NOT_YET_RESOLVED -> PUBLIC_RESOLVABLE, ACCESS_OR_ANNOTATION_BLOCKED -> CURRENTLY_UNRESOLVABLE} -- an internal type only.
  E10-6: >-
    machine-local fatal_review review TRIGGER (FatalReviewRecord fields -- required / status / evidence_ids / persistence_context_ids / persistence_class / context_qualification_basis_refs / persistence_pattern_basis_refs / reproducibility_basis_refs / landscape_as_of / persistence_search_scope). the detector consumes ALREADY-CLASSIFIED evidence (no second qualification engine) -- an eligible contributor is classified.evidence_rung == DIRECT AND classified.persistence_implication == OPPOSES_PERSISTENCE AND persistence_pattern == NEAR_LOSS_OR_MARKED_LOSS (which by construction inherits protein-level + protein_measurement_validation_status QUALIFIED + CRC + a QUALIFIED context adequacy + malignant attribution + an auditable persistence_pattern_basis). required = true iff, on a COMPLETED audited landscape, Route A (one eligible contributor with reproducibility_status == QUALIFIED AND a non-empty reproducibility_basis -- the basis text is NEVER parsed) OR Route B (eligible contributors span >= 2 independent qualified persistence-context identities -- NOT "> 2" and NOT ">= 3"; genuine independence stays human-only). status single value POTENTIAL_FATAL_PATTERN; a raw detector may compute internally but a fatal_review is an actionable handoff ONLY on an accepted run; the machine NEVER emits PUBLIC_FATAL_SIGNAL_ESTABLISHED / a canonical fatal flag / KILL / HOLD / Decision, and NEVER decides whether the pattern is a real fatal signal. fatal_review is NOT on the proposal envelope. NO numeric / percent-positive / H-score / fold-change / context-count threshold.
  E10-7: >-
    Gate-NEUTRAL EvidencePackage per observation (PR A shape) + exact canonical reuse -- an observation already in the Evidence Library is reused as the EXACT canonical object (no allocator call, no re-created body); provenance comes from the resolved canonical SourceIndex record (unresolved id or provider <-> canonical metadata conflict -> HARD reject). the classification-driving reuse parity keys include observation_id / target_identity + context binding / observation_kind / molecular_layer / assay_method / protein_measurement_validation_status + basis / clinical_context + basis / context_adequacy_status + basis / malignant_cell_attribution + basis / persistence_pattern + basis / residual_target_presence_status + basis / reproducibility_status + basis / persistence_context_id(s) / context_key / landscape_as_of, plus the audit snapshot fields for a SEARCH_COMPLETION_AUDIT EP; a missing OR drifted field -> HARD. TGT-03-SPECIFIC DEDUP DEVIATION -- do NOT unconditionally copy the E8 (source_id, claim) dedup. observation_id is the authoritative observation identity (a duplicate is a HARD run rejection). a true duplicate is dropped ONLY when source_id AND claim AND every classification-driving fact AND the LOCAL persistence-context identity all match; any persistence-context difference -> both survive; a SEARCH_COMPLETION_AUDIT EP is never a dedup loser. machine acceptance = the E9 item-13 checklist as executable checks. a HARD identity / provenance / completion-consistency / classification-qualification failure rejects the WHOLE run (proposal_envelope = None) -- NEVER degraded to an accepted UNKNOWN; a genuinely incomplete public persistence search -> INCONCLUSIVE / UNKNOWN is NOT an integrity failure. narrow EXPERIMENT_REQUIRED (E8 precedence) -- while any unresolved public item remains, resolution stays PUBLIC_RESOLVABLE / CURRENTLY_UNRESOLVABLE; only once the enumerated public source space is exhausted does a directional INDIRECT_STRONG with no qualifying DIRECT protein, or a WEAK-only completed landscape, add EXPERIMENT_REQUIRED (clinical-context malignant-cell-resolved protein confirmation).
  E10-8: >-
    non-canonical AssessmentProposalEnvelope -- identity pins candidate_id / instantiation_id / canonical context_id CTX-CRC-REFRACTORY-MCRC / context_version 1 / gateset_id + version / gate_id + version, STRICTLY separate from the LOCAL persistence_context_id namespace. the envelope carries no assessment_id / assessment_version / review / fatal flag / Decision. legal Direction x Strength (frozen) -- POSITIVE / DIRECT, POSITIVE / INDIRECT_STRONG, NEGATIVE / DIRECT, NEGATIVE / INDIRECT_STRONG, CONFLICTING / DIRECT, CONFLICTING / INDIRECT_STRONG, INCONCLUSIVE / DIRECT, INCONCLUSIVE / INDIRECT_STRONG, INCONCLUSIVE / UNKNOWN -- no INCONCLUSIVE / WEAK. the Module never constructs a HUMAN_APPROVED CandidateGateAssessment (the review surface does). binding / registry reconciliation is the minimal set -- src/contracts/crc_adc_target_gateset.yaml + src/objects/crc_adc_target_gateset.py (TGT-03 0.0.0 -> 1.0.0, built_module_versions / BUILT_MODULE_VERSIONS gain TGT-03), gate_modules/README.md, tests/test_crc_adc_target_gateset.py, tests/test_gate_modules_boundary.py, tests/test_tgt03_module_construction_contract.py (migrate the "package does not exist / binding 0.0.0 / only four built" assertions to post-implementation reconciliation, like E8), plus the narrowest sync of other tests hard-coding the built roster (tests/test_tgt02/05/08_module*.py). MIGRATION_PENDING REMAINS (it lifts only once all eight primary Modules are built; after E10 remaining order TGT-04 -> TGT-06 -> TGT-07).

five_implementation_tightenings:  # ChatGPT AI审核方案 -- frozen in the code
  - "1. No normalizer inside the package -- Tgt03PersistenceProviderPort outputs normalized / upstream-qualified facts; the Module only does deterministic classification / aggregation."
  - "2. The fatal detector consumes already-classified observations (rung == DIRECT + implication == OPPOSES_PERSISTENCE + persistence_pattern == NEAR_LOSS_OR_MARKED_LOSS), not a parallel 'what counts as a qualified protein loss' engine."
  - "3. Route A never parses reproducibility_basis free text -- reproducibility_status == QUALIFIED + a non-empty auditable basis IS the machine predicate; scientific convincingness is a human judgement."
  - "4. Do not blind-copy the E8 (source_id, claim) dedup -- distinct persistence_context_id observations must not be dropped just for sharing a source / claim; the local context identity is TGT-03 scientific information."
  - "5. E10 migrates tests/test_tgt03_module_construction_contract.py (currently asserts the package is absent + binding 0.0.0 + only four built) to a post-implementation reconciliation test, like E8 -- it is not deleted -- plus the narrowest sync of every other test hard-coding the built roster."

three_headline_invariants:  # frozen at the top of contracts.py
  - Baseline expression is not persistence. Only explicitly qualified treatment / metastasis-context evidence can drive TGT-03.
  - A single observation is evidence, never a Direction; grading requires the completed and audited persistence landscape, and NEGATIVE remains a scientific persistence judgement -- not fatal and not KILL.
  - Only reproducible DIRECT-class protein near / marked loss may surface POTENTIAL_FATAL_PATTERN; reproducibility is Route A or Route B, remains human-reviewable, and the Module never decides fatality.

