scoping_decisions:  # ChatGPT AI审核方案, before code, 8 decisions
  E4-1: real deterministic MOD-TGT05 implementation (like E2, a full Gate-specific scientific core); files __init__ / module.yaml / contracts / ports / classify / evidence / aggregate / fatal_review / acceptance / module; module_version 1.0.0; minimal binding update (TGT-05 primary_module_version 0.0.0 -> 1.0.0, built_module_versions gains TGT-05); frozen E3 contract body untouched; NO generic GateModule framework / abstract base class; NO MOD-TGT01 refactor
  E4-2: one normalized Tgt05LiabilityProviderPort; every record carries an evidence_function in {LIABILITY_RUNG_EVIDENCE (A), ATTRIBUTION_ADJUDICATION (B), COVERAGE_CONTEXT (C)}; NormalizedLiabilityRecord carries facts only (observation_id, liability_event_id, target_identity, observation_kind, claim, provenance, plus optional species / modality / molecular_layer / finding / atlas_validated / vital_organ_class / affected_tissue / program_id / construct_fingerprint / toxicity_phenotype_key / observed_severity / target_attribution_stance+basis / translational_relevance); the provider never returns a rung or a direction; N/A is an explicit empty value, never omission
  E4-3: classification implements the frozen E3 item-06 truth table verbatim -- a validated human protein atlas NOT_DETECTED is COVERAGE_CONTEXT (not WEAK, not NEGATIVE); scRNA / RNA-only is WEAK; rodent-only is WEAK; aggregation is undisputed DIRECT -> POSITIVE/DIRECT, else undisputed INDIRECT_STRONG -> POSITIVE/INDIRECT_STRONG, else WEAK-only -> INCONCLUSIVE/WEAK, else INCONCLUSIVE/UNKNOWN; an established DIRECT/INDIRECT_STRONG liability plus a coverage gap stays POSITIVE (gap -> critical_unknowns); never NEGATIVE/safe
  E4-4: CONFLICTING is per liability_event_id -- a disputed event is one admissible source SUPPORTS + another admissible source REFUTES the SAME event id, and that event is not itself an undisputed established liability; if there is no other independent undisputed DIRECT/INDIRECT_STRONG liability -> CONFLICTING at the strongest rung the disputed observation could reach; if an independent established liability exists -> overall POSITIVE and the dispute -> critical_unknowns; "ADC-A toxicity, ADC-B reports no toxicity" is never a conflict and never a CONTRADICTING ref
  E4-5: fatal_review is an independent machine-local run output; status has one value POTENTIAL_FATAL_PATTERN (no FATAL_REVIEW_REQUIRED status -- required=true expresses it); required=true iff >= 2 distinct program_id same-target ADC clinical toxicity observations, each with a construct_fingerprint + a disclosed target_attribution_basis + SUPPORTS_TARGET_ATTRIBUTION + an EXACT normalized affected_tissue key match + an EXACT toxicity_phenotype_key match; no embeddings / LLM / ontology / fuzzy matching; same program in two publications = one program; "materially distinct" / "truly target-mediated" / "biologically meaningful convergence" stay human-review calls
  E4-6: Tgt05SweepCompletionRecord = 5 sweep booleans + a per-vital-organ {search_complete, coverage_result in (ADMISSIBLE_PROTEIN_DATA_FOUND, PUBLIC_SEARCH_EXHAUSTED_NO_ADMISSIBLE_PROTEIN_DATA, NOT_YET_COMPLETE)} map over CNS/CARDIAC/HEPATIC/PULMONARY/HEMATOPOIETIC/GASTROINTESTINAL; Path A (fatal_review.required -> provisional stop; the weaker atlas/RNA sweeps are not a prerequisite, but the same-target ADC construct inventory + attribution sweep still must be complete); Path B (a DIRECT ADC clinical liability exists AND fatal_review.required==false -> require the construct inventory + the attribution sweep); Path C (no DIRECT ADC clinical liability -> require the non-ADC + NHP + RNA-supporting + all six vital-organ protein coverage searches complete; an exhausted organ -> a critical_unknown EXPERIMENT_REQUIRED)
  E4-7: EvidencePackage is Gate-neutral + exact canonical reuse (an observation already in the Evidence Library is reused as the EXACT object -- no allocator call, no new body); a negative-atlas observation is ALSO an EvidencePackage whose does_not_support explicitly lists "the absence of a normal-tissue on-target liability" / "normal-tissue safety" / "a product-specific therapeutic window"; reuse parity covers the classification-driving fields FOR THAT OBSERVATION KIND (missing OR drifted -> HARD reject); SourceIndex authority is exactly as E2 (unresolved id or provider/canonical metadata conflict -> HARD reject)
  E4-8: CI runs synthetic / in-memory acceptance scenarios only -- no internet, no real atlas / clinical data, synthetic TARGET_A / PROGRAM_A / PROGRAM_B / LIVER (HEPATIC) / PHENO_X

owns_boundary_one_liner:
  pr_e4_owns: >-
    normalized TGT-05 observations -> source / identity QC -> frozen evidence-class mapping ->
    Gate-neutral EvidencePackages -> per-vital-organ coverage state -> Direction x Strength (frozen
    truth table) -> machine-local fatal_review review trigger -> path-based stop-rule acceptance ->
    non-canonical assessment proposal envelope
  pr_e4_does_not_own: >-
    web / atlas / clinical retrieval -> RNA/atlas normalisation + phenotype keying + attribution
    stance assignment -> source registry / provenance ledger -> dataset persistence -> ontology / LLM
    inference of toxicity convergence -> human target-attribution adjudication -> the human
    materially-distinct judgement -> the fatal decision -> CandidateGateAssessment approval ->
    GateSet Decision / KILL -> therapeutic-window prediction

