acceptance:
  package_layer:
    - isolated_python_environment_created
    - pinned_version_and_source_commit_recorded
    - import_and_cli_help_pass
    - dependency_versions_recorded
  artifact_layer:
    - model_files_have_finite_nonzero_sizes
    - sha256_or_upstream_content_hashes_recorded
    - cache_location_is_external_to_repository
  gpu_runtime_smoke:
    resources: 1x_l40s_4cpu_32g_15min
    checks:
      - nvidia_smi
      - torch_cuda_available
      - cuda_tensor_operation
      - package_import_on_compute_node
    pass_status: GPU_RUNTIME_PASS
  model_canary:
    resources: 1x_l40s_4cpu_32g_15min
    required_check: >-
      Complete one official minimal non-production model example on GPU and record
      the exit code, wall-clock runtime, and expected output completeness.
    pass_status: MODEL_CANARY_PASS
    pending_status: MODEL_CANARY_PENDING
    pending_rule: >-
      If model artifacts are missing, storage preflight blocks the download, or the
      15-minute allocation is insufficient, record MODEL_CANARY_PENDING. Do not
      describe the model as GPU-validated or fully usable.
  completion_rule: >-
    A package may be recorded as installed after package and artifact checks pass.
    GPU_RUNTIME_PASS certifies only the CUDA runtime and imports. The model is
    GPU-validated and usable for later gated evaluation only after MODEL_CANARY_PASS.
    MODEL_CANARY_PENDING is not a pass. None of these statuses constitutes a
    binder-design roster PASS or authorizes a production run.

stop_conditions:
  - home_quota_remaining_below_5_gib
  - no_official_source_or_license
  - dependency_conflict_requires_mutating_an_existing_environment
  - gpu_canary_fails_twice_for_the_same_reason
  - persistent_ssh_session_is_unavailable_and_duo_reauthentication_is_required

