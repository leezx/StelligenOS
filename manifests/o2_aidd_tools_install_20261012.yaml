  - preserve_at_least_5_gib_home_quota_headroom

storage_preflight:
  required_before_each_environment_install_or_weight_download:
    - reread_current_home_quota
    - estimate_incremental_environment_size
    - estimate_model_and_artifact_size
    - estimate_peak_temporary_download_and_unpack_size
    - estimate_package_manager_and_framework_cache_growth
  start_rule: >-
    Start a step only when the estimated peak usage for the entire step, not merely
    its final installed size, leaves at least 5 GiB of home quota free. If any
    component cannot be estimated or the projected headroom is below 5 GiB, stop
    before the step begins and record it as blocked_by_storage.
  cache_locations:
    uv: /home/zhl595/software/aidd_shared_cache/uv
    pip: /home/zhl595/software/aidd_shared_cache/pip
    huggingface: /home/zhl595/software/aidd_shared_cache/huggingface
    torch: /home/zhl595/software/aidd_shared_cache/torch
    temporary_downloads: /home/zhl595/software/aidd_shared_cache/tmp
  deduplication_rules:
    - reuse_model_artifacts_only_after_content_hash_match
    - do_not_copy_a_weight_when_a_verified_shared_artifact_can_be_referenced
    - clean_only_task_created_re_downloadable_temporary_files
    - never_delete_or_mutate_existing_user_environments_or_files_to_make_space

